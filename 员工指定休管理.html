<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, minimum-scale=0.5">
    <title>员工指定休管理</title>
    <style>
        :root {
            --primary: #1e3a5f;
            --primary-light: #2d5a8e;
            --primary-lighter: #3b7dd8;
            --primary-bg: #edf2f9;
            --accent: #4f8fda;
            --secondary: #6366f1;
            --secondary-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1d23;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 2px 8px rgba(30, 58, 95, 0.06), 0 8px 32px rgba(30, 58, 95, 0.08);
            --shadow-sm: 0 1px 3px rgba(30, 58, 95, 0.04), 0 4px 12px rgba(30, 58, 95, 0.06);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
            color: var(--primary);
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 44px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); box-shadow: 0 4px 12px rgba(30, 58, 95, 0.25); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }
        .btn-outline {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: var(--bg); border-color: var(--primary-light); }
        .btn-back {
            background: white;
            color: var(--text-light);
            border: 1px solid var(--border);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            min-height: 44px;
        }
        .btn-back:hover { background: var(--bg); border-color: var(--primary-light); color: var(--primary); }
        /* Touch optimization */
        .btn, .day, select, input {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            border: 1px solid rgba(30, 58, 95, 0.04);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }
        /* Selection area */
        .selection-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 500;
        }
        .form-group select, .form-group input {
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            min-width: 140px;
            outline: none;
            transition: all 0.2s;
            min-height: 44px;
            background: white;
        }
        .form-group select:focus, .form-group input:focus {
            border-color: var(--primary-lighter);
            box-shadow: 0 0 0 3px rgba(59, 125, 216, 0.1);
        }
        /* Submit buttons row */
        .submit-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        /* Calendar */
        .calendar {
            margin-top: 8px;
            position: relative;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .calendar-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .calendar-grid .weekday {
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            font-weight: 600;
            padding: 8px 0;
        }
        .calendar-grid .day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            padding: 4px 2px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            font-weight: 500;
        }
        .calendar-grid .day:hover:not(.empty):not(.disabled) {
            background: var(--primary-bg);
            transform: scale(1.05);
        }
        .calendar-grid .day.empty { cursor: default; }
        .calendar-grid .day.selected {
            background: #f3e8ff;
            color: #1e3a5f;
            box-shadow: 0 3px 10px rgba(243, 232, 255, 0.5);
            transform: scale(1.02);
            border: 2px solid #c084fc;
        }
        .calendar-grid .day.selected.leave-swap {
            background: #e5e7eb;
            border-color: #9ca3af;
            box-shadow: 0 3px 10px rgba(229, 231, 235, 0.5);
        }
        .calendar-grid .day.selected.leave-leave {
            background: #d1fae5;
            border-color: #34d399;
            box-shadow: 0 3px 10px rgba(209, 250, 229, 0.5);
        }
        .calendar-grid .day.selected.leave-annual {
            background: #dbeafe;
            border-color: #60a5fa;
            box-shadow: 0 3px 10px rgba(219, 234, 254, 0.5);
        }
        .calendar-grid .day.selected.leave-marriage {
            background: #fce7f3;
            border-color: #f472b6;
            box-shadow: 0 3px 10px rgba(252, 231, 243, 0.5);
        }
        .calendar-grid .day.selected.leave-prenatal {
            background: #fed7aa;
            border-color: #fb923c;
            box-shadow: 0 3px 10px rgba(254, 215, 170, 0.5);
        }
        .calendar-grid .day.selected.leave-maternity {
            background: #e0f2fe;
            border-color: #38bdf8;
            box-shadow: 0 3px 10px rgba(224, 242, 254, 0.5);
        }
        .calendar-grid .day.selected .day-label {
            color: rgba(0,0,0,0.6);
        }

        /* Leave type popup */
        .leave-type-popup {
            position: fixed;
            z-index: 100;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            padding: 12px;
            min-width: 160px;
        }
        .leave-type-popup .popup-title {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f1f5f9;
        }
        .leave-type-popup .popup-options {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .leave-type-popup .popup-opt {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: none;
            background: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: background 0.15s;
        }
        .leave-type-popup .popup-opt:hover {
            background: #f1f5f9;
        }
        .leave-type-popup .opt-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .leave-type-popup .opt-note {
            font-size: 11px;
            color: var(--danger);
            margin-left: auto;
        }
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 99;
        }
        .calendar-grid .day.holiday {
            color: var(--danger);
        }
        .calendar-grid .day.workday {
            color: var(--primary-lighter);
        }
        .calendar-grid .day.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .day-num {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.2;
        }
        .day-label {
            font-size: 10px;
            color: #ef4444;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            line-height: 1.2;
        }
        .day.workday .day-label {
            color: #f59e0b;
        }
        .calendar-legend {
            display: flex;
            gap: 16px;
            margin-top: 14px;
            font-size: 12px;
            color: var(--text-light);
        }
        .calendar-legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }
        .legend-dot.holiday { background: var(--danger); }
        .legend-dot.workday { background: var(--primary-lighter); }
        .legend-dot.selected { background: #f3e8ff; border: 1px solid #c084fc; }
        .legend-dot.swap { background: #e5e7eb; border: 1px solid #9ca3af; }
        .legend-dot.leave { background: #d1fae5; border: 1px solid #34d399; }
        .legend-dot.annual { background: #dbeafe; border: 1px solid #60a5fa; }
        /* Rest days config */
        .rest-config {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0;
            padding: 14px 16px;
            background: var(--primary-bg);
            border-radius: 10px;
            font-size: 13px;
            flex-wrap: wrap;
        }
        .rest-config input {
            width: 50px;
            padding: 6px 8px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            background: white;
        }
        /* Selected dates display */
        .selected-dates {
            margin-top: 14px;
            padding: 14px 16px;
            background: #fefce8;
            border-radius: 10px;
            min-height: 40px;
        }
        .selected-dates .label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .selected-dates .dates {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .date-tag {
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-item {
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
            text-align: center;
        }
        .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-item .desc {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .employee-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .emp-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .emp-item:hover { background: var(--bg); }
        .emp-item .status {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 6px;
            white-space: nowrap;
            font-weight: 500;
        }
        .emp-item .status.done { background: #d1fae5; color: #065f46; }
        .emp-item .status.pending { background: #fef3c7; color: #92400e; }
        .emp-dates {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 2px;
        }
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: var(--radius);
            padding: 28px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(30, 58, 95, 0.2);
        }
        .modal h3 {
            margin-bottom: 18px;
            font-size: 17px;
            color: var(--primary);
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .emp-manage-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .emp-manage-item:last-child { border: none; }
        .emp-manage-item .name { flex: 1; font-size: 13px; font-weight: 500; }
        .emp-manage-item .group {
            font-size: 11px;
            color: var(--text-light);
            background: var(--bg);
            padding: 3px 8px;
            border-radius: 6px;
        }
        .emp-manage-item .btn { padding: 5px 10px; font-size: 11px; min-height: unset; }
        /* Add employee form */
        .add-emp-form {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .add-emp-form input, .add-emp-form select {
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
        }
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--text);
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            z-index: 2000;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            max-width: calc(100vw - 40px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(240, 242, 245, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 16px;
            color: var(--text-light);
            backdrop-filter: blur(8px);
        }
        .loading-overlay.hidden { display: none; }
        /* Responsive - Tablet */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
        /* Responsive - Mobile */
        @media (max-width: 768px) {
            body {
                padding: 12px;
                overflow-x: hidden;
            }
            .header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            .header h1 {
                font-size: 20px;
            }
            .header-actions {
                width: 100%;
            }
            .header-actions .btn,
            .header-actions .btn-back {
                flex: 1;
                justify-content: center;
            }
            .layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .card {
                padding: 20px;
                border-radius: 14px;
            }
            .card-title {
                font-size: 14px;
                margin-bottom: 14px;
            }
            .selection-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .form-group {
                width: 100%;
            }
            .form-group select,
            .form-group input {
                min-width: unset;
                width: 100%;
                padding: 12px 14px;
                font-size: 16px; /* prevent iOS zoom */
            }
            .submit-row {
                width: 100%;
            }
            .submit-row .btn {
                flex: 1;
                padding: 12px 16px;
                font-size: 15px;
            }
            .rest-config {
                padding: 12px;
                font-size: 13px;
                gap: 6px;
            }
            .rest-config input {
                width: 48px;
                padding: 6px;
                font-size: 14px;
            }
            .calendar-grid {
                gap: 3px;
            }
            .calendar-grid .weekday {
                font-size: 11px;
                padding: 4px 0;
            }
            .calendar-grid .day {
                border-radius: 8px;
                min-height: 46px;
                padding: 3px 1px;
            }
            .day-num {
                font-size: 14px;
            }
            .day-label {
                font-size: 9px;
            }
            .calendar-legend {
                gap: 10px;
                font-size: 11px;
                flex-wrap: wrap;
            }
            .selected-dates {
                padding: 12px;
            }
            .selected-dates .label {
                font-size: 11px;
            }
            .date-tag {
                font-size: 11px;
                padding: 3px 8px;
            }
            .stats-grid {
                gap: 8px;
            }
            .stat-item {
                padding: 12px;
            }
            .stat-item .num {
                font-size: 18px;
            }
            .employee-list {
                max-height: 250px;
            }
            .emp-item {
                padding: 8px;
                font-size: 12px;
            }
            /* Modal mobile */
            .modal {
                padding: 20px;
                margin: 12px;
                max-height: 90vh;
                border-radius: 14px;
            }
            .modal h3 {
                font-size: 15px;
            }
            .emp-manage-item {
                gap: 6px;
                padding: 8px 0;
            }
            .emp-manage-item .btn {
                padding: 5px 8px;
                font-size: 10px;
            }
            .add-emp-form {
                flex-direction: column;
            }
            .add-emp-form input,
            .add-emp-form select {
                width: 100%;
            }
            .add-emp-form .btn {
                width: 100%;
                padding: 10px;
            }
        }
        /* Extra small screens */
        @media (max-width: 375px) {
            body {
                padding: 8px;
            }
            .header h1 {
                font-size: 18px;
            }
            .card {
                padding: 16px;
            }
            .calendar-grid .day {
                min-height: 44px;
                border-radius: 6px;
            }
            .day-num {
                font-size: 13px;
            }
            .day-label {
                font-size: 8px;
            }
            .calendar-grid {
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">加载中...</div>

    <div class="header">
        <h1>休假收集</h1>
        <div class="header-actions">
            <a href="index.html" class="btn-back">← 首页</a>
        </div>
    </div>

    <div class="layout">
        <div class="main-area">
            <div class="card">
                <div class="selection-row">
                    <div class="form-group">
                        <label>选择员工 <a href="javascript:void(0)" onclick="resetIdentity()" style="font-size:11px;color:var(--primary-lighter);font-weight:400;margin-left:4px;">切换身份</a></label>
                        <select id="empSelect" onchange="onEmployeeChange()">
                            <option value="">-- 请选择 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>选择月份</label>
                        <input type="month" id="monthSelect" onchange="onMonthChange()">
                    </div>
                    <div class="submit-row">
                        <button class="btn btn-success" onclick="submitSchedule()">✓ 提交</button>
                        <button class="btn btn-outline" id="cancelSubmitBtn" onclick="cancelSubmit()" style="display:none;">✕ 取消提交</button>
                        <a href="排班表生成.html" class="btn btn-primary" style="text-decoration:none;">⚡ 排班生成</a>
                        <button class="btn btn-outline" id="empManageBtn" onclick="openEmployeeModal()">👥 员工管理</button>
                    </div>
                </div>

                <div class="rest-config" id="restConfigArea">
                    <span>本月应休天数：</span>
                    <input type="number" id="totalRestDays" min="0" max="15" value="4" onchange="saveTotalRestDays()">
                    <span id="restDaysUnit">天（指定休不超过此数）</span>
                </div>



                <div id="deadlineNotice" style="display:none; padding:12px 16px; background:#fef2f2; border-radius:10px; color:#991b1b; font-size:13px; margin-bottom:14px;">
                    ⚠️ 本月已过截止日，无法提交指定休
                </div>

                <div class="calendar" id="calendarArea">
                    <div class="calendar-header">
                        <h3 id="calendarTitle">请先选择员工和月份</h3>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>

        const opts = {
            method,
            headers: {
                'apikey': SUPABASE_KEY,

                'Content-Type': 'application/json',
                'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : (method === 'DELETE' ? 'return=minimal' : ''),
                ...headers
            }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(url, opts);

    // === 默认月份选择逻辑（变更3） ===
    function getDefaultTargetMonth() {
        const now = new Date();
        const currentDay = now.getDate();
        const currentMonthNow = now.getMonth() + 1; // 1-12
        const currentYearNow = now.getFullYear();

        // 如果当前日期 <= 25号，那么下个月的指定休还可以提交
        // 如果当前日期 > 25号，那么下个月指定休已截止，目标是下下个月
        let targetMonth, targetYear;
        if (currentDay <= 25) {
            // 可以提交下个月的指定休
            targetMonth = currentMonthNow + 1;
            targetYear = currentYearNow;
        } else {
            // 下个月截止了，目标是下下个月
            targetMonth = currentMonthNow + 2;
            targetYear = currentYearNow;
        }
        if (targetMonth > 12) {
            targetMonth -= 12;
            targetYear++;
        }
        return { year: targetYear, month: targetMonth };
    }

    let scheduleConfirmed = false;
    async function checkScheduleConfirmed() {
        const notice = document.getElementById('deadlineNotice');
        try {
            const data = await supaFetch('schedules', {
                query: `?year=eq.${currentYear}&month=eq.${currentMonth}&select=locked`
            });
            if (data.length > 0 && data[0].locked) {
                scheduleConfirmed = true;
                notice.style.display = 'block';

                return;

        } catch (e) {}
        scheduleConfirmed = false;
    }

    // === 截止时间判断（变更3） ===
    function checkDeadline() {
        // 如果排班已确认，不覆盖提示
        if (scheduleConfirmed) return;

        const now = new Date();
        const notice = document.getElementById('deadlineNotice');

        // 规则：N月的指定休，截止日期是 N-1月的25号
        let deadlineMonth = currentMonth - 1;
        let deadlineYear = currentYear;
        if (deadlineMonth <= 0) {
            deadlineMonth = 12;
            deadlineYear--;
        }
        const deadline = new Date(deadlineYear, deadlineMonth - 1, 25, 23, 59, 59);

        if (now > deadline) {
            notice.style.display = 'block';
            notice.innerHTML = `⚠️ ${currentYear}年${currentMonth}月的休假收集已截止（截止日期：${deadlineYear}年${deadlineMonth}月25日），无法提交`;
        } else {
            notice.style.display = 'none';
        }
    }

    function isAfterDeadline() {
        const now = new Date();
        // 目标月份为 currentYear/currentMonth
        // 截止日为上个月25号
        let deadlineMonth = currentMonth - 1;
        let deadlineYear = currentYear;
        if (deadlineMonth <= 0) {
            deadlineMonth = 12;
            deadlineYear--;
        }
        // 截止时间：上个月25号当天结束（23:59:59）
        const deadline = new Date(deadlineYear, deadlineMonth - 1, 25, 23, 59, 59);
        return now > deadline;
    }

    // === Calendar Rendering ===
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const title = document.getElementById('calendarTitle');

        if (!currentYear || !currentMonth) {
            grid.innerHTML = '';
            title.textContent = '请先选择月份';
            return;
        }

        title.textContent = `${currentYear}年${currentMonth}月`;

        const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

        let html = '';
        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        weekdays.forEach(d => { html += `<div class="weekday">${d}</div>`; });

        for (let i = 0; i < firstDay; i++) {
            html += '<div class="day empty"></div>';
        }

        const isDeadlinePassed = isAfterDeadline();

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            let classes = 'day';

            const isHoliday = holidays[dateStr];
            const isWorkDay = workDays[dateStr];

            if (isHoliday) classes += ' holiday';
            if (isWorkDay) classes += ' workday';
            if (selectedDates[d]) {
                classes += ' selected';
                if (selectedDates[d] !== 'designated') classes += ' leave-' + selectedDates[d];
            }
            if (isDeadlinePassed || !currentEmployee) classes += ' disabled';

            // Build inner HTML with day-num and optional day-label
            let innerHtml = `<span class="day-num">${d}</span>`;
            if (isHoliday) {
                const shortName = holidayShortNames[isHoliday] || isHoliday;
                innerHtml += `<span class="day-label">${shortName}</span>`;
            } else if (isWorkDay) {
                innerHtml += `<span class="day-label">班</span>`;
            }

            html += `<div class="${classes}" data-day="${d}" onclick="toggleDay(${d})">${innerHtml}</div>`;
        }

        grid.innerHTML = html;
    }

    let pendingDay = null; // 等待选择类型的日期

    function toggleDay(day) {

        const isDeadlinePassed = isAfterDeadline();

        if (isDeadlinePassed) {
            showToast('已过截止日期，无法修改', 'error');
            return;
        }

        // 关闭已有弹窗
        hideLeavePopup();

        if (selectedDates[day]) {
            // 已选：取消
            delete selectedDates[day];
            renderCalendar();
            updateSelectedDatesDisplay();
        } else {
            // 新选：显示类型选择弹窗
            pendingDay = day;
            showLeavePopup(day);
        }
    }

    function showLeavePopup(day) {
        const popup = document.getElementById('leaveTypePopup');
        const dayEl = document.querySelector(`.day[data-day="${day}"]`);
        if (!dayEl) return;

        const rect = dayEl.getBoundingClientRect();

        popup.style.display = 'block';
        // 用 fixed 定位，紧贴点击日期的右边或下方
        const popupW = popup.offsetWidth || 160;
        const popupH = popup.offsetHeight || 300;

        let left = rect.right + 8;
        let top = rect.top;

        // 如果右边放不下，放左边
        if (left + popupW > window.innerWidth) {
            left = rect.left - popupW - 8;
        }
        // 如果下方超出，向上调整
        if (top + popupH > window.innerHeight) {
            top = window.innerHeight - popupH - 10;
        }
        if (top < 10) top = 10;

        popup.style.left = left + 'px';
        popup.style.top = top + 'px';

        // 添加背景遮罩
        if (!document.getElementById('popupOverlay')) {
            const overlay = document.createElement('div');
            overlay.id = 'popupOverlay';
            overlay.className = 'popup-overlay';
            overlay.onclick = hideLeavePopup;
            document.body.appendChild(overlay);
        }
        document.getElementById('popupOverlay').style.display = 'block';
    }

    function hideLeavePopup() {
        const popup = document.getElementById('leaveTypePopup');
        popup.style.display = 'none';
        pendingDay = null;
        const overlay = document.getElementById('popupOverlay');
        if (overlay) overlay.style.display = 'none';
    }

    function selectLeaveType(type) {
        if (pendingDay === null) return;

        // 检查指定休限制
        if (type === 'designated') {
            const maxRest = parseInt(document.getElementById('totalRestDays').value) || 4;
            const designatedCount = Object.values(selectedDates).filter(t => t === 'designated').length;
            if (designatedCount >= maxRest) {
                showToast(`指定休最多选择${maxRest}天`, 'error');
                hideLeavePopup();
                return;
            }
        }

        selectedDates[pendingDay] = type;
        hideLeavePopup();
        renderCalendar();
        updateSelectedDatesDisplay();
    }

    function updateSelectedDatesDisplay() {
        const container = document.getElementById('selectedDatesList');
        const days = Object.keys(selectedDates).map(Number).sort((a, b) => a - b);
        if (days.length === 0) {
            container.innerHTML = '<span style="color:var(--text-light);font-size:12px;">暂无选择</span>';
        } else {
            container.innerHTML = days.map(d => {
                const type = selectedDates[d];
                const info = LEAVE_TYPES[type] || LEAVE_TYPES.designated;
                return `<span class="date-tag" style="background:${info.color};color:white;">${currentMonth}月${d}日 ${info.label}</span>`;
            }).join('');
        }
    }

    // === Cancel Submit ===
    async function cancelSubmit() {
        if (!currentEmployee) return;
        if (scheduleConfirmed) {
            showToast('本月排班已确认，无法修改指定休', 'error');
            return;
        }
        const isDeadlinePassed = isAfterDeadline();
        if (isDeadlinePassed) {
            showToast('已过截止日期，无法操作', 'error');
            return;
        }
        try {
            const monthStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            await supaFetch('designated_rest', {
                method: 'DELETE',
                query: `?employee_id=eq.${encodeURIComponent(empNameToId[currentEmployee] || currentEmployee)}&month=eq.${monthStr}`
            });
            selectedDates = {};
            renderCalendar();
            updateSelectedDatesDisplay();
            await updateStats();
            await updateCancelButton();
            showToast(`${currentEmployee} 的假期已取消`, 'success');
        } catch (e) {
            showToast('取消失败', 'error');
        }
    }

    async function updateCancelButton() {
        const btn = document.getElementById('cancelSubmitBtn');
        if (!currentEmployee) {
            btn.style.display = 'none';
            return;
        }
        try {
            const monthStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            const data = await supaFetch('designated_rest', {
                query: `?employee_id=eq.${encodeURIComponent(empNameToId[currentEmployee] || currentEmployee)}&month=eq.${monthStr}&select=dates`
            });
            btn.style.display = (data.length > 0 && data[0].dates && data[0].dates.length > 0) ? 'inline-flex' : 'none';
        } catch (e) {
            btn.style.display = 'none';
        }
    }

    // === Submit ===
    async function submitSchedule() {
        if (!currentEmployee) {
            showToast('请先选择员工', 'error');
            return;
        }

        if (scheduleConfirmed) {
            showToast('本月排班已确认，无法修改指定休', 'error');
            return;
        }

        const isDeadlinePassed = isAfterDeadline();
        if (isDeadlinePassed) {
            showToast('已过截止日期，无法提交', 'error');
            return;
        }

        try {
            const monthStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            if (Object.keys(selectedDates).length === 0) {
                // 取消指定休：删除记录
                await supaFetch('designated_rest', {
                    method: 'DELETE',
                    query: `?employee_id=eq.${encodeURIComponent(empNameToId[currentEmployee] || currentEmployee)}&month=eq.${monthStr}`
                });
                showToast(`${currentEmployee} 的指定休已取消`, 'success');
            } else {
                // Upsert 指定休/假期
                const days = Object.keys(selectedDates).map(Number).sort((a, b) => a - b);
                await supaFetch('designated_rest', {
                    method: 'POST',
                    body: {
                        employee_id: empNameToId[currentEmployee] || currentEmployee,
                        month: monthStr,
                        dates: days,
                        leave_types: selectedDates,
                        submitted: true,
                        submitted_at: new Date().toISOString()
                    }
                });
                showToast(`${currentEmployee} 的假期已保存`, 'success');
            }
            await updateStats();
            await updateCancelButton();
        } catch (e) {
            showToast('提交失败', 'error');
        }
    }

    // === Stats ===
    async function updateStats() {
        let submitted = 0;
        let pending = 0;
        let listHtml = '';

        try {
            // 读取当月所有 designated_rest 记录
            const monthStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            const data = await supaFetch('designated_rest', {
                query: `?month=eq.${monthStr}&select=employee_id,submitted,dates`
            });

            const submittedMap = {};
            data.forEach(record => {
                if (record.submitted && record.dates && record.dates.length > 0) {
                    submittedMap[empIdToName[record.employee_id] || record.employee_id] = record.dates;
                }
            });

            employees.forEach(emp => {
                const adminMark = isAdmin(emp.name) ? '⭐ ' : '';
                if (submittedMap[emp.name]) {
                    submitted++;
                    const dates = submittedMap[emp.name];
                    listHtml += `<div class="emp-item">
                        <div>
                            <div>${adminMark}${emp.name}</div>
                            <div class="emp-dates">${dates.map(d => d + '日').join('、')}</div>
                        </div>
                        <span class="status done">已提交</span>
                    </div>`;
                } else {
                    pending++;
                    listHtml += `<div class="emp-item">
                        <div>${adminMark}${emp.name}</div>
                        <span class="status pending">未提交</span>
                    </div>`;
                }
            });
        } catch (e) {
            console.error('Failed to update stats:', e);
            employees.forEach(emp => {
                pending++;
                listHtml += `<div class="emp-item">
                    <div>${emp.name}</div>
                    <span class="status pending">未提交</span>
                </div>`;
            });
        }

        document.getElementById('submittedCount').textContent = submitted;
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('empStatusList').innerHTML = listHtml;
    }

    // === Employee Management ===
    function openEmployeeModal() {
        // 验证管理员权限：使用当前选中的员工作为身份
        const currentUser = localStorage.getItem('last_selected_employee') || currentEmployee;
        if (!currentUser) {
            showToast('请先选择员工', 'error');
            return;
        }
        if (!isAdmin(currentUser)) {
            showToast('⚠️ 只有管理员才能操作员工管理', 'error');
            return;
        }
        document.getElementById('empModal').classList.add('active');
        renderEmployeeManageList();
    }

    function closeEmployeeModal() {
        document.getElementById('empModal').classList.remove('active');
    }

    function renderEmployeeManageList() {
        const container = document.getElementById('empManageList');
        container.innerHTML = employees.map((emp, idx) => {
            const isEmpAdmin = adminList.includes(emp.name);
            const adminLabel = isEmpAdmin ? ' ⭐管理员' : '';
            const adminBtnHtml = isEmpAdmin
                ? `<button class="btn btn-warning" onclick="toggleAdmin('${emp.name}', false)">取消管理员</button>`
                : `<button class="btn btn-outline" onclick="toggleAdmin('${emp.name}', true)">设为管理员</button>`;
            return `
            <div class="emp-manage-item">
                <span class="name">${emp.name}${adminLabel}</span>
                <span class="group">${emp.group}</span>
                ${adminBtnHtml}
                <button class="btn btn-danger" onclick="removeEmployee(${idx})">删除</button>
            </div>
        `}).join('');
    }

    async function toggleAdmin(name, setAsAdmin) {
        let list = [...adminList];
        if (setAsAdmin) {
            if (!list.includes(name)) {
                list.push(name);
            }
            showToast(`${name} 已设为管理员`, 'success');
        } else {
            if (list.length <= 1) {
                showToast('至少保留一个管理员', 'error');
                return;
            }
            list = list.filter(n => n !== name);
            showToast(`${name} 已取消管理员`, 'success');
        }
        await saveAdminList(list);
        renderEmployeeManageList();
        populateEmployeeSelect();
        await updateStats();
    }

    async function addEmployee() {
        const name = document.getElementById('newEmpName').value.trim();
        const group = document.getElementById('newEmpGroup').value;
        if (!name) {
            showToast('请输入姓名', 'error');
            return;
        }
        if (employees.find(e => e.name === name)) {
            showToast('员工已存在', 'error');
            return;
        }
        employees.push({ name, group });
        await saveEmployees();
        populateEmployeeSelect();
        renderEmployeeManageList();
        document.getElementById('newEmpName').value = '';
        showToast(`已添加 ${name}`, 'success');
        await updateStats();
    }

    async function removeEmployee(idx) {
        const name = employees[idx].name;
        if (confirm(`确定删除 ${name}？`)) {
            employees.splice(idx, 1);
            let list = [...adminList];
            list = list.filter(n => n !== name);
            if (list.length === 0) list = ['谢焕君'];
            await saveAdminList(list);
            await saveEmployees();
            populateEmployeeSelect();
            renderEmployeeManageList();
            showToast(`已删除 ${name}`, 'success');
            await updateStats();
        }
    }

    // === Toast ===
    function showToast(msg, type) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast ' + (type || '');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // === Start ===
    init();
    </script>
</body>
