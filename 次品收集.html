<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>次品照片收集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 20px; text-align: center; padding: 16px 0; color: #333; }
        .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 14px; color: #666; margin-bottom: 10px; font-weight: 500; }
        label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
        input[type=number], input[type=text] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #4A90D9; }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .photo-slot { aspect-ratio: 1; border: 2px dashed #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; background: #fafafa; min-height: 100px; }
        .photo-count { text-align: right; font-size: 12px; color: #888; margin-top: 6px; }
        .photo-slot { aspect-ratio: 1; border: 2px dashed #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; background: #fafafa; }
        .photo-slot.has-photo { border: 2px solid #4A90D9; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
        .photo-slot .add-icon { font-size: 28px; color: #bbb; }
        .photo-slot .del { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; background: rgba(220,38,38,0.9); color: #fff; border: none; border-radius: 50%; font-size: 12px; cursor: pointer; }
        .submit-btn { width: 100%; padding: 14px; background: #4A90D9; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; }
        .submit-btn:active:not(:disabled) { opacity: 0.8; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 999; display: none; }
        .history-item { padding: 10px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        .history-item .time { color: #888; font-size: 11px; }
        .history-item .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-done { background: #d1fae5; color: #059669; }
        .tab-btn { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: #4A90D9; color: #fff; border-color: #4A90D9; }
    </style>
</head>
<body>
<div class="container">
    <h1>📷 次品照片收集</h1>

    <div class="card">
        <label>采购单号</label>
        <div style="display:flex;gap:8px;">
            <input type="number" id="poId" placeholder="输入或扫码" inputmode="numeric" style="flex:1;">
            <button onclick="startScan()" style="padding:12px 16px;background:#4A90D9;color:#fff;border:none;border-radius:8px;font-size:14px;white-space:nowrap;">📷 扫码</button>
        </div>
        <div id="poInfo" style="margin-top:10px;font-size:13px;color:#666;"></div>
    </div>

    <div class="card" id="photoCard">
        <div class="card-title">拍照上传（不限张数）</div>
        <div class="photo-grid" id="photoGrid"></div>
    </div>

    <div class="card">
        <label>备注（可选）</label>
        <input type="text" id="note" placeholder="次品描述">
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submit()" disabled>提交</button>

    <div class="card" style="margin-top:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div class="card-title" style="margin-bottom:0;">提交记录</div>
            <div style="font-size:12px;">
                <span style="color:#f59e0b;font-weight:600;" id="pendingCount">待处理: 0</span>
                <span style="margin-left:8px;color:#10b981;font-weight:600;" id="doneCount">已处理: 0</span>
            </div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
            <button class="tab-btn active" onclick="switchTab('all',this)">全部</button>
            <button class="tab-btn" onclick="switchTab('pending',this)">待处理</button>
            <button class="tab-btn" onclick="switchTab('done',this)">已处理</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" multiple>

<script>
const SUPABASE_URL = 'https://elyfxyrdbuykyklfjfdr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseWZ4eXJkYnV5a3lrbGZqZmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIwMjQsImV4cCI6MjA5NjU3ODAyNH0.irrMM8iKJVGnOBW6VQ4BHlkwiVIDtB97EPiHvasOWyg';

let photos = []; // base64 strings
const MAX_SIZE = 5 * 1024 * 1024;

function initPhotoGrid() {
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = '';
    photos.forEach((p, i) => {
        const slot = document.createElement('div');
        slot.className = 'photo-slot has-photo';
        slot.innerHTML = `<img src="${p}"><button class="del" onclick="removePhoto(${i})">✕</button>`;
        grid.appendChild(slot);
    });
    // 添加按钮
    const addSlot = document.createElement('div');
    addSlot.className = 'photo-slot';
    addSlot.innerHTML = '<span class="add-icon">+</span>';
    addSlot.onclick = triggerUpload;
    grid.appendChild(addSlot);
    updateBtn();
}

function triggerUpload() {
    document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    for (const file of files) {
        if (file.size > MAX_SIZE) { showToast('照片超过5MB，已跳过', 'orange'); continue; }
        const b64 = await compressAndConvert(file);
        photos.push(b64);
    }
    initPhotoGrid();
    this.value = '';
});

function removePhoto(i) { photos.splice(i, 1); initPhotoGrid(); }

function compressAndConvert(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                const maxDim = 1600;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = h * maxDim / w; w = maxDim; }
                    else { w = w * maxDim / h; h = maxDim; }
                }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

function updateBtn() {
    const poId = document.getElementById('poId').value.trim();
    document.getElementById('submitBtn').disabled = !(poId && photos.length > 0);
}

document.getElementById('poId').addEventListener('input', updateBtn);

async function submit() {
    const poId = document.getElementById('poId').value.trim();
    if (!poId || photos.length === 0) return;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '提交中...';

    const record = {
        po_id: parseInt(poId),
        photos: photos,
        note: document.getElementById('note').value.trim(),
        status: 'pending',
        created_at: new Date().toISOString()
    };

    try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/defect_reports`, {
            method: 'POST', headers: {
                'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json', 'Prefer': 'return=minimal'
            }, body: JSON.stringify(record)
        });
        if (r.ok) {
            // 同时存本地
            saveLocal(record);
            showToast('提交成功 ✓', 'green');
            photos = []; initPhotoGrid();
            document.getElementById('poId').value = '';
            document.getElementById('note').value = '';
            loadHistory();
        } else {
            // 网络提交失败，存本地
            saveLocal(record);
            showToast('已保存到本地（网络异常）', 'orange');
            photos = []; initPhotoGrid();
            loadHistory();
        }
    } catch(e) {
        saveLocal(record);
        showToast('已保存到本地（离线模式）', 'orange');
        photos = []; initPhotoGrid();
        loadHistory();
    }
    btn.disabled = false; btn.textContent = '提交';
}

function saveLocal(record) {
    const list = JSON.parse(localStorage.getItem('defect_reports') || '[]');
    list.unshift(record);
    localStorage.setItem('defect_reports', JSON.stringify(list.slice(0, 50)));
}

let currentTab = 'all';

function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadHistory();
}

function loadHistory() {
    const list = JSON.parse(localStorage.getItem('defect_reports') || '[]');
    const pending = list.filter(r => r.status === 'pending');
    const done = list.filter(r => r.status === 'done');
    document.getElementById('pendingCount').textContent = `待处理: ${pending.length}`;
    document.getElementById('doneCount').textContent = `已处理: ${done.length}`;

    let filtered = list;
    if (currentTab === 'pending') filtered = pending;
    else if (currentTab === 'done') filtered = done;

    const el = document.getElementById('historyList');
    if (filtered.length === 0) { el.innerHTML = '<div style="color:#999;font-size:13px;">暂无记录</div>'; return; }
    el.innerHTML = filtered.slice(0, 20).map(r => `<div class="history-item">
        <strong>采购单 ${r.po_id}</strong> · ${r.photos.length}张照片
        <span class="badge ${r.status==='done'?'badge-done':'badge-pending'}">${r.status==='done'?'已处理':'待处理'}</span>
        ${r.note ? '<br>' + r.note : ''}
        <div class="time">${new Date(r.created_at).toLocaleString()}</div>
    </div>`).join('');
}

function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = color; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}

initPhotoGrid();
loadHistory();

// 条形码扫描
function startScan() {
    if (!('BarcodeDetector' in window)) {
        // 回退：用相机拍照识别
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                try {
                    const detector = new BarcodeDetector({formats:['code_128','ean_13','ean_8','code_39']});
                    const codes = await detector.detect(img);
                    if (codes.length > 0) {
                        document.getElementById('poId').value = codes[0].rawValue;
                        updateBtn();
                        showToast('扫码成功: ' + codes[0].rawValue, 'green');
                    } else {
                        showToast('未识别到条形码', 'orange');
                    }
                } catch(err) {
                    showToast('设备不支持扫码，请手动输入', 'orange');
                }
            };
        };
        input.click();
        return;
    }
    // 使用BarcodeDetector API
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
    input.onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const bitmap = await createImageBitmap(file);
        const detector = new BarcodeDetector({formats:['code_128','ean_13','ean_8','code_39']});
        const codes = await detector.detect(bitmap);
        if (codes.length > 0) {
            document.getElementById('poId').value = codes[0].rawValue;
            updateBtn();
            showToast('扫码成功: ' + codes[0].rawValue, 'green');
        } else { showToast('未识别到条形码', 'orange'); }
    };
    input.click();
}
</script>
</body>
</html>
