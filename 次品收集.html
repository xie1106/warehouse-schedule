<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>次品照片收集</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 12px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 18px; text-align: center; padding: 12px 0; color: #333; }
        .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
        input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: #4A90D9; }
        #poId::placeholder { font-size: 12px; color: #ccc; }
        .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
        .photo-slot { aspect-ratio: 1; border: 2px dashed #ddd; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; background: #fafafa; }
        .photo-slot.has-photo { border: 2px solid #4A90D9; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
        .photo-slot .del { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; background: rgba(220,38,38,0.9); color: #fff; border: none; border-radius: 50%; font-size: 11px; cursor: pointer; }
        .photo-slot .add-icon { font-size: 24px; color: #bbb; }
        .submit-btn { width: 100%; padding: 12px; background: #4A90D9; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 9999; display: none; }
        .record { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
        .record-header { display: flex; justify-content: space-between; align-items: center; }
        .record-title { font-size: 14px; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-done { background: #d1fae5; color: #059669; }
        .badge-error { background: #fee2e2; color: #dc2626; }
        .record-time { color: #888; font-size: 11px; margin-top: 4px; }
        .record-photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
        .record-photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .tab-btn { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: #4A90D9; color: #fff; border-color: #4A90D9; }
        .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-box input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .record-actions { display: flex; gap: 8px; margin-top: 8px; }
        .record-actions button { padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; background: #fff; font-size: 11px; cursor: pointer; }
        /* 图片预览弹窗 */
        .img-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9998; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .img-modal img { max-width: 95%; max-height: 75vh; object-fit: contain; }
        .img-modal-actions { margin-top: 16px; display: flex; gap: 12px; }
        .img-modal-actions button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; color: #fff; }
        /* 自定义确认弹窗 */
        .confirm-overlay { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:9998;display:none;align-items:center;justify-content:center; }
        .confirm-box { background:#fff;border-radius:14px;padding:24px;text-align:center;max-width:280px;width:80%; }
        .confirm-box p { font-size:16px;margin-bottom:20px;color:#333; }
        .confirm-btns { display:flex;gap:12px; }
        .confirm-btns button { flex:1;padding:10px;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer; }
        .confirm-cancel { background:#f0f0f0;color:#333; }
        .confirm-ok { background:#e53e3e;color:#fff; }
    </style>
</head>
<body>
<div class="container">
    <h1>📷 次品照片收集</h1>

    <!-- 收集模块 -->
    <div class="card" style="padding:12px 16px;cursor:pointer;" onclick="toggleCollect(event)">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:16px;font-weight:600;color:#4A90D9;">📷 次品拍照</span>
            <span id="collectArrow" style="font-size:12px;color:#999;">展开 ▼</span>
        </div>
        <div id="collectForm" style="display:none;margin-top:12px;" onclick="event.stopPropagation();">
            <div style="margin-bottom:10px;">
                <label>采购单号 <span style="color:#e53e3e;">*</span></label>
                <div style="display:flex;gap:8px;">
                    <div style="flex:1;position:relative;">
                        <input type="text" id="poId" placeholder="请输入正确采购单号" inputmode="numeric" pattern="[0-9]*" style="width:100%;padding-right:32px;">
                        <button onclick="document.getElementById('poId').value='';updateBtn();" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:#999;cursor:pointer;padding:4px;">✕</button>
                    </div>
                    <button onclick="startScan()" style="padding:10px 20px;background:#4A90D9;color:#fff;border:none;border-radius:8px;font-size:14px;min-width:60px;">扫码</button>
                </div>
                <div id="poHint" style="display:none;color:#e53e3e;font-size:12px;margin-top:4px;"></div>
            </div>
            <div style="margin-bottom:10px;">
                <label>上传照片</label>
                <div style="font-size:11px;color:#e53e3e;margin-bottom:4px;">需要吊牌、次品位置的清晰图片</div>
                <div class="photo-grid" id="photoGrid"></div>
            </div>
            <div style="margin-bottom:10px;">
                <label>备注（可选）</label>
                <input type="text" id="note" placeholder="次品描述">
            </div>
            <button class="submit-btn" id="submitBtn" onclick="submitRecord()" disabled>提交</button>
        </div>
    </div>

    <!-- 提交记录 -->
    <div class="card" style="min-height:50vh;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:16px;font-weight:600;">提交记录</span>
            <div style="font-size:11px;">
                <span style="color:#f59e0b;font-weight:600;" id="pendingCount">待处理:0</span>
                <span style="margin-left:6px;color:#10b981;font-weight:600;" id="doneCount">已处理:0</span>
                <span style="margin-left:6px;color:#ef4444;font-weight:600;" id="errorCount">异常:0</span>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索采购单号" inputmode="numeric" oninput="loadHistory()">
            <button onclick="searchScan()" style="padding:8px 14px;background:#4A90D9;color:#fff;border:none;border-radius:8px;font-size:13px;">扫码</button>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
            <button class="tab-btn active" onclick="switchTab('all',this)">全部</button>
            <button class="tab-btn" onclick="switchTab('pending',this)">待处理</button>
            <button class="tab-btn" onclick="switchTab('done',this)">已处理</button>
            <button class="tab-btn" onclick="switchTab('error',this)">异常</button>
            <button class="tab-btn" onclick="switchTab('1688',this)" style="color:#1d4ed8;">1688</button>
            <button class="tab-btn" onclick="switchTab('non1688',this)" style="color:#d97706;">非1688</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<!-- 图片预览弹窗 -->
<div class="img-modal" id="imgModal" onclick="closeModal()">
    <img id="modalImg" src="" onclick="event.stopPropagation();" style="max-width:92%;max-height:70vh;object-fit:contain;border-radius:8px;">
    <div style="color:#fff;font-size:14px;margin-top:12px;" id="imgCounter"></div>
    <div style="display:flex;gap:16px;margin-top:16px;" onclick="event.stopPropagation()">
        <button onclick="prevImg()" style="padding:10px 20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:#fff;font-size:16px;cursor:pointer;">上一张</button>
        <button onclick="downloadImg()" style="padding:10px 20px;background:#4A90D9;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;">保存图片</button>
        <button onclick="nextImg()" style="padding:10px 20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:#fff;font-size:16px;cursor:pointer;">下一张</button>
    </div>
    <button onclick="closeModal()" style="margin-top:12px;padding:8px 24px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#ccc;font-size:13px;cursor:pointer;">关闭</button>
</div>

<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <p id="confirmMsg">确定删除这条记录？</p>
        <div class="confirm-btns">
            <button class="confirm-cancel" onclick="confirmResolve(false)">取消</button>
            <button class="confirm-ok" onclick="confirmResolve(true)">确定</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none" multiple>
<script>
const SUPABASE_URL = 'https://elyfxyrdbuykyklfjfdr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseWZ4eXJkYnV5a3lrbGZqZmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIwMjQsImV4cCI6MjA5NjU3ODAyNH0.irrMM8iKJVGnOBW6VQ4BHlkwiVIDtB97EPiHvasOWyg';

let photos = [];
let collectOpen = false;
let currentTab = 'all';
let editingIdx = -1;

function toggleCollect(e) {
    collectOpen = !collectOpen;
    document.getElementById('collectForm').style.display = collectOpen ? 'block' : 'none';
    document.getElementById('collectArrow').textContent = collectOpen ? '收起 ▲' : '展开 ▼';
}

// Photo grid
function initPhotoGrid() {
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = '';
    photos.forEach((p, i) => {
        const slot = document.createElement('div');
        slot.className = 'photo-slot has-photo';
        slot.innerHTML = `<img src="${p}"><button class="del" onclick="event.stopPropagation();removePhoto(${i})">✕</button>`;
        grid.appendChild(slot);
    });
    const addSlot = document.createElement('div');
    addSlot.className = 'photo-slot';
    addSlot.innerHTML = '<span class="add-icon">+</span>';
    addSlot.onclick = () => document.getElementById('fileInput').click();
    grid.appendChild(addSlot);
    updateBtn();
}

function removePhoto(i) { photos.splice(i, 1); initPhotoGrid(); }

document.getElementById('fileInput').addEventListener('change', async function(e) {
    for (const file of Array.from(e.target.files)) {
        if (file.size > 5*1024*1024) { showToast('照片超过5MB，已跳过','orange'); continue; }
        photos.push(await compressImg(file));
    }
    initPhotoGrid(); this.value = '';
});

function compressImg(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > 1600 || h > 1600) { if (w > h) { h = h*1600/w; w = 1600; } else { w = w*1600/h; h = 1600; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

// Validation
function updateBtn() {
    const poId = document.getElementById('poId').value.trim();
    document.getElementById('submitBtn').disabled = !(/^\d{6,}$/.test(poId) && photos.length > 0);
}
document.getElementById('poId').addEventListener('input', function() {
    updateBtn();
    const val = this.value.trim(), hint = document.getElementById('poHint');
    if (val && !/^\d+$/.test(val)) { hint.textContent = '⚠️ 请输入纯数字'; hint.style.display = 'block'; }
    else if (val && val.length < 6) { hint.textContent = '⚠️ 采购单号不少于6位'; hint.style.display = 'block'; }
    else { hint.style.display = 'none'; }
});

// Upload photo to Storage, return public URL
async function uploadPhoto(base64, poId, index) {
    const res = await fetch(base64);
    const blob = await res.blob();
    const filename = `${poId}/${Date.now()}_${index}.jpg`;
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/defect-photos/${filename}`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'image/jpeg' },
        body: blob
    });
    if (r.ok) {
        return `${SUPABASE_URL}/storage/v1/object/public/defect-photos/${filename}`;
    }
    return base64; // fallback
}

// Submit
async function submitRecord() {
    const poId = document.getElementById('poId').value.trim();
    if (!/^\d{6,}$/.test(poId) || photos.length === 0) return;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '上传图片中...';

    // 上传图片到CDN
    const photoUrls = [];
    for (let i = 0; i < photos.length; i++) {
        btn.textContent = `上传图片 ${i+1}/${photos.length}...`;
        const url = await uploadPhoto(photos[i], poId, i);
        photoUrls.push(url);
    }
    btn.textContent = '提交中...';

    const record = { po_id: poId, photos: photoUrls, note: document.getElementById('note').value.trim(), status: 'pending', created_at: new Date().toISOString() };

    if (editingIdx >= 0) {
        const list = getRecords();
        const rec = list[editingIdx];
        if (rec && rec.id) {
            await fetch(`${SUPABASE_URL}/rest/v1/defect_reports?id=eq.${rec.id}`, {
                method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                body: JSON.stringify({ po_id: poId, photos: photoUrls, note: document.getElementById('note').value.trim() })
            });
        }
        editingIdx = -1;
        showToast('修改成功 ✓', 'green');
    } else {
        await syncToServer(record);
        showToast('提交成功 ✓', 'green');
    }

    photos = []; initPhotoGrid();
    document.getElementById('poId').value = '';
    document.getElementById('note').value = '';
    await fetchRecords();
    btn.disabled = false; btn.textContent = '提交';
}

function saveLocal(record) {}
function getRecords() { return window._records || []; }
function saveRecords(list) {}

async function syncToServer(record) {
    try {
        await fetch(`${SUPABASE_URL}/rest/v1/defect_reports`, {
            method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
            body: JSON.stringify(record)
        });
    } catch(e) {}
}

async function fetchRecords() {
    try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/defect_reports?select=id,po_id,status,note,created_at&order=created_at.desc&limit=100`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (r.ok) { window._records = await r.json(); }
    } catch(e) {}
    loadHistory();
}

// History & Search
function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadHistory();
}

function loadHistory() {
    const list = getRecords();
    const search = document.getElementById('searchInput').value.trim();
    let filtered = list;
    if (search) filtered = filtered.filter(r => String(r.po_id).includes(search));
    if (currentTab === 'all') {} // 显示全部
    else if (currentTab === 'pending') filtered = filtered.filter(r => r.status === 'pending');
    else if (currentTab === 'done') filtered = filtered.filter(r => r.status === 'done');
    else if (currentTab === 'error') filtered = filtered.filter(r => r.status === 'error');
    else if (currentTab === '1688') filtered = filtered.filter(r => (r.note||'').includes('[1688:'));
    else if (currentTab === 'non1688') filtered = filtered.filter(r => (r.note||'').includes('[系统:非1688'));

    const allPending = list.filter(r => r.status === 'pending').length;
    const allDone = list.filter(r => r.status === 'done').length;
    const allError = list.filter(r => r.status === 'error').length;
    document.getElementById('pendingCount').textContent = `待处理:${allPending}`;
    document.getElementById('doneCount').textContent = `已处理:${allDone}`;
    document.getElementById('errorCount').textContent = `异常:${allError}`;

    const el = document.getElementById('historyList');
    if (filtered.length === 0) { el.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:20px;">暂无记录</div>'; return; }
    el.innerHTML = filtered.slice(0, 30).map((r, i) => {
        const realIdx = list.indexOf(r);
        const statusClass = r.status==='done'?'badge-done':r.status==='error'?'badge-error':'badge-pending';
        const statusText = r.status==='done'?'已处理':r.status==='error'?'异常':'待处理';
        const is1688 = (r.note||'').includes('[1688:');
        const isNon1688 = (r.note||'').includes('[系统:非1688');
        const tagHtml = is1688 ? '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#1677ff;color:#fff;margin-left:6px;">1688</span>' : isNon1688 ? '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#faad14;color:#fff;margin-left:6px;">非1688</span>' : '';
        const noteDisplay = (r.note||'').replace(/\s*\[系统:[^\]]*\]/g, '').replace(/\s*\[1688:[^\]]*\]/g, '').trim();
        const photosHtml = `<div class="record-photos" id="photos_${realIdx}" data-poid="${r.po_id}" style="display:none;"></div>`;
        const photoCount = (r.photos||[]).length || '?';
        return `<div class="record">
            <div class="record-header">
                <span class="record-title">采购单 ${r.po_id}${tagHtml} <button onclick="togglePhotos(${realIdx})" style="padding:4px 12px;background:#fff;border:1.5px solid #4A90D9;border-radius:14px;color:#4A90D9;font-size:12px;cursor:pointer;margin-left:8px;">查看图片</button></span>
                <span class="badge ${statusClass}">${statusText}</span>
            </div>
            <div class="record-time">${new Date(r.created_at).toLocaleString()}${noteDisplay?' · '+noteDisplay:''}</div>
            ${photosHtml}
            <div class="record-actions">
                ${r.status!=='done'?`<button onclick="markDone(${realIdx})" style="color:#059669;border-color:#059669;">✅ 完成</button>`:`<button onclick="markUndone(${realIdx})" style="color:#d97706;border-color:#d97706;">↩ 反完成</button>`}
                <button onclick="editRecord(${realIdx})">✏️ 编辑</button>
                <button onclick="deleteRecord(${realIdx})">🗑 删除</button>
            </div>
        </div>`;
    }).join('');
}

// Edit & Delete
function editRecord(idx) {
    const list = getRecords();
    const r = list[idx];
    if (!r) return;
    editingIdx = idx;
    document.getElementById('poId').value = r.po_id;
    document.getElementById('note').value = r.note || '';
    photos = [...(r.photos || [])];
    initPhotoGrid();
    collectOpen = true;
    document.getElementById('collectForm').style.display = 'block';
    document.getElementById('collectArrow').textContent = '收起 ▲';
    document.getElementById('submitBtn').textContent = '保存修改';
    updateBtn();
    window.scrollTo(0, 0);
}

let _confirmCb = null;
function showConfirm(msg) {
    return new Promise(resolve => {
        document.getElementById('confirmMsg').textContent = msg;
        document.getElementById('confirmOverlay').style.display = 'flex';
        _confirmCb = resolve;
    });
}
function confirmResolve(val) {
    document.getElementById('confirmOverlay').style.display = 'none';
    if (_confirmCb) { _confirmCb(val); _confirmCb = null; }
}

async function deleteRecord(idx) {
    const ok = await showConfirm('确定删除这条记录？');
    if (!ok) return;
    const list = getRecords();
    const rec = list[idx];
    if (rec && rec.id) {
        await fetch(`${SUPABASE_URL}/rest/v1/defect_reports?id=eq.${rec.id}`, {
            method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
    }
    await fetchRecords();
    showToast('已删除', 'green');
}

async function markDone(idx) {
    const list = getRecords();
    const rec = list[idx];
    if (rec && rec.id) {
        await fetch(`${SUPABASE_URL}/rest/v1/defect_reports?id=eq.${rec.id}`, {
            method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'done' })
        });
    }
    await fetchRecords();
    showToast('已标记完成', 'green');
}

async function markUndone(idx) {
    const list = getRecords();
    const rec = list[idx];
    if (rec && rec.id) {
        await fetch(`${SUPABASE_URL}/rest/v1/defect_reports?id=eq.${rec.id}`, {
            method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'pending' })
        });
    }
    await fetchRecords();
    showToast('已恢复为待处理', 'green');
}

async function togglePhotos(idx) {
    const el = document.getElementById('photos_' + idx);
    if (!el) return;
    if (el.style.display === 'none') {
        el.style.display = 'grid';
        if (!el.dataset.loaded) {
            el.innerHTML = '<div style="color:#999;font-size:12px;">加载中...</div>';
            const list = getRecords();
            const rec = list[idx];
            if (rec && rec.id) {
                const r = await fetch(`${SUPABASE_URL}/rest/v1/defect_reports?id=eq.${rec.id}&select=photos`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (r.ok) {
                    const data = await r.json();
                    const photos = (data[0] && data[0].photos) || [];
                    el.dataset.photos = JSON.stringify(photos);
                    const poId = el.dataset.poid || '';
                    el.innerHTML = photos.map((p, pi) => `<img src="${p}" onclick="event.stopPropagation();openModal(null, JSON.parse(this.parentElement.dataset.photos), ${pi}, '${poId}')">`).join('');
                    el.dataset.loaded = '1';
                }
            }
        }
    } else {
        el.style.display = 'none';
    }
}

// Image modal
let modalPhotos = [];
let modalIndex = 0;

let modalPoId = '';

function openModal(src, photos, idx, poId) {
    if (photos) { modalPhotos = photos; modalIndex = idx || 0; }
    else { modalPhotos = [src]; modalIndex = 0; }
    if (poId) modalPoId = poId;
    document.getElementById('modalImg').src = modalPhotos[modalIndex];
    document.getElementById('imgCounter').textContent = `${modalIndex+1} / ${modalPhotos.length}`;
    document.getElementById('imgModal').style.display = 'flex';
}
function prevImg() {
    if (modalIndex > 0) { modalIndex--; document.getElementById('modalImg').src = modalPhotos[modalIndex]; document.getElementById('imgCounter').textContent = `${modalIndex+1} / ${modalPhotos.length}`; }
}
function nextImg() {
    if (modalIndex < modalPhotos.length - 1) { modalIndex++; document.getElementById('modalImg').src = modalPhotos[modalIndex]; document.getElementById('imgCounter').textContent = `${modalIndex+1} / ${modalPhotos.length}`; }
}
function closeModal() { document.getElementById('imgModal').style.display = 'none'; }

function downloadImg() {
    const src = document.getElementById('modalImg').src;
    const filename = `${modalPoId}_${modalIndex+1}.jpg`;
    fetch(src).then(r => r.blob()).then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('已保存 ✓', 'green');
    }).catch(() => showToast('保存失败，请长按图片保存', 'orange'));
}
async function copyImg() {
    try {
        const src = document.getElementById('modalImg').src;
        const res = await fetch(src);
        const blob = await res.blob();
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        showToast('已复制到剪贴板', 'green');
    } catch(e) { showToast('复制失败，请长按图片保存', 'orange'); }
}

// Barcode scan
function searchScan() {
    const overlay = document.createElement('div');
    overlay.id = 'scanOverlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;';
    overlay.innerHTML = `<div style="color:#fff;padding:16px;font-size:16px;">扫码搜索采购单</div>
        <div id="searchScanReader" style="width:100%;max-width:400px;"></div>
        <div style="padding:20px;"><button onclick="stopSearchScan()" style="padding:12px 32px;background:#e53e3e;color:#fff;border:none;border-radius:8px;font-size:16px;">取消</button></div>`;
    document.body.appendChild(overlay);
    window._searchScanner = new Html5Qrcode("searchScanReader");
    window._searchScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 280, height: 120 } },
        (text) => {
            document.getElementById('searchInput').value = text;
            loadHistory();
            showToast('扫码成功', 'green');
            stopSearchScan();
        }, () => {}
    ).catch(() => { stopSearchScan(); showToast('无法启动扫码', 'orange'); });
}
function stopSearchScan() {
    if (window._searchScanner) { window._searchScanner.stop().catch(()=>{}); window._searchScanner = null; }
    const o = document.getElementById('scanOverlay');
    if (o) document.body.removeChild(o);
}

let html5Scanner = null;
function startScan() {
    const overlay = document.createElement('div');
    overlay.id = 'scanOverlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;';
    overlay.innerHTML = `<div style="color:#fff;padding:16px;font-size:16px;">对准条形码扫描</div>
        <div id="scanReader" style="width:100%;max-width:400px;"></div>
        <div style="padding:20px;"><button onclick="stopScan()" style="padding:12px 32px;background:#e53e3e;color:#fff;border:none;border-radius:8px;font-size:16px;">取消</button></div>`;
    document.body.appendChild(overlay);

    html5Scanner = new Html5Qrcode("scanReader");
    html5Scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 280, height: 120 } },
        (text) => {
            document.getElementById('poId').value = text;
            updateBtn();
            showToast('扫码成功: ' + text, 'green');
            stopScan();
        },
        () => {}
    ).catch(() => {
        stopScan();
        showToast('无法启动扫码，请手动输入', 'orange');
    });
}
function stopScan() {
    if (html5Scanner) { html5Scanner.stop().catch(()=>{}); html5Scanner = null; }
    const o = document.getElementById('scanOverlay');
    if (o) document.body.removeChild(o);
}

function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = color; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}

initPhotoGrid();
fetchRecords();
