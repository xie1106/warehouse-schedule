<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>方案B - 手动输入SKU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 12px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 18px; text-align: center; padding: 12px 0; color: #333; }
        .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
        input[type=text], input[type=number] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: #4A90D9; }
        .sku-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .sku-row input[type=text] { flex: 1; }
        .sku-row input[type=number] { width: 70px; text-align: center; }
        .sku-row .del-btn { width: 32px; height: 32px; border: none; background: #fee2e2; color: #dc2626; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .add-sku-btn { width: 100%; padding: 10px; border: 1.5px dashed #4A90D9; border-radius: 8px; background: #f0f7ff; color: #4A90D9; font-size: 13px; cursor: pointer; text-align: center; margin-top: 8px; }
        .scan-btn { padding: 8px 14px; background: #4A90D9; color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .submit-btn { width: 100%; padding: 12px; background: #4A90D9; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
        .submit-btn:disabled { background: #ccc; }
        .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
        .photo-slot { aspect-ratio: 1; border: 2px dashed #ddd; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #fafafa; }
        .photo-slot .add-icon { font-size: 24px; color: #bbb; }
        .hint { font-size: 12px; color: #e53e3e; margin-top: 4px; }
        .desc { font-size: 12px; color: #999; margin-top: 8px; text-align: center; line-height: 1.6; }
        .field-label { font-size: 12px; color: #888; margin-bottom: 2px; }
    </style>
</head>
<body>
<div class="container">
    <h1>次品收集 — 方案B</h1>
    <p class="desc">手动输入/扫码SKU编码 + 次品数量</p>

    <div class="card">
        <label>采购单号</label>
        <input type="text" id="poId" placeholder="输入或扫码采购单号">
    </div>

    <div class="card">
        <label>次品商品明细</label>
        <div id="skuRows">
            <div class="sku-row">
                <div style="flex:1;">
                    <div class="field-label">SKU编码（扫吊牌条码）</div>
                    <div style="display:flex;gap:6px;">
                        <input type="text" placeholder="G699322M">
                        <button class="scan-btn" onclick="scanSku(this)">扫码</button>
                    </div>
                </div>
                <div style="width:70px;">
                    <div class="field-label">次品数</div>
                    <input type="number" min="1" value="1">
                </div>
                <button class="del-btn" onclick="delSkuRow(this)">×</button>
            </div>
        </div>
        <div class="add-sku-btn" onclick="addSkuRow()">+ 添加另一个SKU</div>
    </div>

    <div class="card">
        <label>拍照上传</label>
        <p class="hint">需要吊牌、次品位置的清晰图片</p>
        <div class="photo-grid">
            <div class="photo-slot"><span class="add-icon">+</span></div>
        </div>
    </div>

    <button class="submit-btn" disabled>提交</button>
</div>

<script>
function addSkuRow() {
    const row = document.createElement('div');
    row.className = 'sku-row';
    row.innerHTML = `
        <div style="flex:1;">
            <div class="field-label">SKU编码（扫吊牌条码）</div>
            <div style="display:flex;gap:6px;">
                <input type="text" placeholder="G699322M">
                <button class="scan-btn" onclick="scanSku(this)">扫码</button>
            </div>
        </div>
        <div style="width:70px;">
            <div class="field-label">次品数</div>
            <input type="number" min="1" value="1">
        </div>
        <button class="del-btn" onclick="delSkuRow(this)">×</button>
    `;
    document.getElementById('skuRows').appendChild(row);
}

function delSkuRow(btn) {
    const rows = document.querySelectorAll('.sku-row');
    if (rows.length > 1) btn.parentElement.remove();
}

function scanSku(btn) {
    alert('扫描吊牌条码获取SKU编码');
}
</script>
</body>
</html>
