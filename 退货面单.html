<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>退货面单系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; height: 100vh; overflow: hidden; }
        .container { max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; height: 100%; padding: 0 12px; }
        h1 { text-align: center; font-size: 18px; padding: 14px 0; color: #333; }
        .tabs { display: flex; gap: 0; margin-bottom: 12px; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; }
        .tab-btn { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600; border: none; background: #fff; cursor: pointer; color: #666; transition: all 0.2s; }
        .tab-btn.active { background: #4A90D9; color: #fff; }
        .panel { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .panel.active { display: block; }
        .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group textarea { height: 60px; resize: none; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-primary { background: #4A90D9; color: #fff; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-outline { background: #fff; color: #4A90D9; border: 1.5px solid #4A90D9; }
        .supplier-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #4A90D9; }
        .supplier-item .name { font-weight: 600; font-size: 14px; }
        .supplier-item .addr { font-size: 12px; color: #666; margin-top: 2px; }
        .supplier-item .actions { display: flex; gap: 8px; }
        .supplier-item .actions button { padding: 4px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; font-size: 12px; cursor: pointer; }
        .order-item { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #10b981; }
        .order-item .header { display: flex; justify-content: space-between; align-items: center; }
        .order-item .po { font-weight: 600; font-size: 14px; }
        .order-item .status { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-shipped { background: #d1fae5; color: #059669; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 12px 24px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 9999; display: none; }
        /* 面单预览 */
        .waybill { width: 76mm; height: 130mm; border: 1px solid #000; padding: 4mm; font-size: 10px; font-family: monospace; margin: 0 auto; background: #fff; }
        .waybill .title { text-align: center; font-size: 16px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px; }
        .waybill .section { border-bottom: 1px solid #000; padding: 4px 0; margin-bottom: 4px; }
        .waybill .label { font-weight: bold; }
</style>
</head>
<body>
<div class="container">
    <h1>📦 退货面单系统</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchPanel('return')">退货下单</button>
        <button class="tab-btn" onclick="switchPanel('orders')">退货记录</button>
        <button class="tab-btn" onclick="switchPanel('suppliers')">供应商</button>
    </div>

    <!-- 退货下单 -->
    <div class="panel active" id="panel-return">
        <div class="card">
            <div class="card-title">退货信息</div>
            <div class="form-group">
                <label>采购单号</label>
                <input type="text" id="returnPoId" placeholder="输入或从次品系统带入">
            </div>
            <div class="form-group">
                <label>供应商</label>
                <select id="returnSupplier" onchange="fillSupplierAddr()">
                    <option value="">选择供应商</option>
                </select>
            </div>
            <div class="form-group">
                <label>收件人</label>
                <input type="text" id="returnContact" placeholder="自动填充">
            </div>
            <div class="form-group">
                <label>电话</label>
                <input type="tel" id="returnPhone" placeholder="自动填充">
            </div>
            <div class="form-group">
                <label>退货地址</label>
                <textarea id="returnAddr" placeholder="自动填充"></textarea>
            </div>
            <div class="form-group">
                <label>退货明细</label>
                <textarea id="returnItems" placeholder="款号×数量，如：WM5225×2, Y6662×1"></textarea>
            </div>
            <div class="form-group">
                <label>快递</label>
                <select id="returnExpress">
                    <option value="yto">圆通速递</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="createReturn()" style="margin-top:8px;">📋 生成面单</button>
        </div>
    </div>

    <!-- 退货记录 -->
    <div class="panel" id="panel-orders">
        <div id="orderList"></div>
    </div>

    <!-- 供应商管理 -->
    <div class="panel" id="panel-suppliers">
        <div style="margin-bottom:10px;">
            <button class="btn btn-outline" onclick="showAddSupplier()">+ 添加供应商</button>
        </div>
        <div id="supplierList"></div>
        <!-- 添加供应商表单 -->
        <div id="addSupplierForm" style="display:none;">
            <div class="card">
                <div class="card-title">添加供应商</div>
                <div class="form-group"><label>供应商名称</label><input type="text" id="sName"></div>
                <div class="form-group"><label>收件人</label><input type="text" id="sContact"></div>
                <div class="form-group"><label>电话</label><input type="tel" id="sPhone"></div>
                <div class="form-group"><label>省</label><input type="text" id="sProvince" placeholder="广东省"></div>
                <div class="form-group"><label>市</label><input type="text" id="sCity" placeholder="广州市"></div>
                <div class="form-group"><label>区</label><input type="text" id="sDistrict" placeholder="海珠区"></div>
                <div class="form-group"><label>详细地址</label><input type="text" id="sAddress"></div>
                <div style="display:flex;gap:8px;margin-top:10px;">
                    <button class="btn btn-success" onclick="saveSupplier()" style="flex:1;">保存</button>
                    <button class="btn btn-outline" onclick="hideAddSupplier()" style="flex:1;">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 面单预览弹窗 -->
    <div id="waybillModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;overflow-y:auto;padding:20px;">
        <div style="max-width:320px;margin:0 auto;">
            <div id="waybillContent"></div>
            <div style="display:flex;gap:10px;margin-top:16px;">
                <button class="btn btn-primary" onclick="printWaybill()" style="flex:1;">🖨️ 打印</button>
                <button class="btn btn-outline" onclick="closeWaybill()" style="flex:1;border-color:#fff;color:#fff;">关闭</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL = 'https://elyfxyrdbuykyklfjfdr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseWZ4eXJkYnV5a3lrbGZqZmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIwMjQsImV4cCI6MjA5NjU3ODAyNH0.irrMM8iKJVGnOBW6VQ4BHlkwiVIDtB97EPiHvasOWyg';

// 供应商数据（localStorage存储）
let suppliers = JSON.parse(localStorage.getItem('suppliers') || '[]');
// 退货订单（localStorage暂存，后续可用Supabase）
let returnOrders = JSON.parse(localStorage.getItem('returnOrders') || '[]');

function switchPanel(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    event.target.classList.add('active');
    if (name === 'suppliers') renderSuppliers();
    if (name === 'orders') renderOrders();
}

function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = color || '#333';
    t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000);
}

// === 供应商管理 ===
function renderSuppliers() {
    const el = document.getElementById('supplierList');
    if (suppliers.length === 0) { el.innerHTML = '<div style="color:#999;text-align:center;padding:20px;font-size:13px;">暂无供应商，请添加</div>'; return; }
    el.innerHTML = suppliers.map((s, i) => `
        <div class="supplier-item">
            <div>
                <div class="name">${s.name}</div>
                <div class="addr">${s.contact} ${s.phone}</div>
                <div class="addr">${s.province}${s.city}${s.district}${s.address}</div>
            </div>
            <div class="actions">
                <button onclick="editSupplier(${i})">✏️</button>
                <button onclick="deleteSupplier(${i})" style="color:#dc2626;">✕</button>
            </div>
        </div>`).join('');
    // 更新退货下单的下拉
    updateSupplierSelect();
}

function updateSupplierSelect() {
    const sel = document.getElementById('returnSupplier');
    sel.innerHTML = '<option value="">选择供应商</option>' + suppliers.map((s,i) => `<option value="${i}">${s.name}</option>`).join('');
}

function fillSupplierAddr() {
    const idx = document.getElementById('returnSupplier').value;
    if (idx === '') return;
    const s = suppliers[idx];
    document.getElementById('returnContact').value = s.contact;
    document.getElementById('returnPhone').value = s.phone;
    document.getElementById('returnAddr').value = s.province + s.city + s.district + s.address;
}

function showAddSupplier() { document.getElementById('addSupplierForm').style.display = 'block'; }
function hideAddSupplier() { document.getElementById('addSupplierForm').style.display = 'none'; clearSupplierForm(); }
function clearSupplierForm() { ['sName','sContact','sPhone','sProvince','sCity','sDistrict','sAddress'].forEach(id => document.getElementById(id).value = ''); }

function saveSupplier() {
    const s = {
        name: document.getElementById('sName').value.trim(),
        contact: document.getElementById('sContact').value.trim(),
        phone: document.getElementById('sPhone').value.trim(),
        province: document.getElementById('sProvince').value.trim(),
        city: document.getElementById('sCity').value.trim(),
        district: document.getElementById('sDistrict').value.trim(),
        address: document.getElementById('sAddress').value.trim()
    };
    if (!s.name) { showToast('请填写供应商名称', '#ef4444'); return; }
    suppliers.push(s);
    localStorage.setItem('suppliers', JSON.stringify(suppliers));
    hideAddSupplier();
    renderSuppliers();
    showToast('已添加', '#10b981');
}

function deleteSupplier(i) {
    if (!confirm('确定删除 ' + suppliers[i].name + '？')) return;
    suppliers.splice(i, 1);
    localStorage.setItem('suppliers', JSON.stringify(suppliers));
    renderSuppliers();
}

function editSupplier(i) {
    const s = suppliers[i];
    document.getElementById('sName').value = s.name;
    document.getElementById('sContact').value = s.contact;
    document.getElementById('sPhone').value = s.phone;
    document.getElementById('sProvince').value = s.province;
    document.getElementById('sCity').value = s.city;
    document.getElementById('sDistrict').value = s.district;
    document.getElementById('sAddress').value = s.address;
    suppliers.splice(i, 1);
    localStorage.setItem('suppliers', JSON.stringify(suppliers));
    showAddSupplier();
}
</script>
<script>
// === 退货下单 ===
function createReturn() {
    const poId = document.getElementById('returnPoId').value.trim();
    const supplierIdx = document.getElementById('returnSupplier').value;
    const contact = document.getElementById('returnContact').value.trim();
    const phone = document.getElementById('returnPhone').value.trim();
    const addr = document.getElementById('returnAddr').value.trim();
    const items = document.getElementById('returnItems').value.trim();
    if (!poId) { showToast('请输入采购单号', '#ef4444'); return; }
    if (!contact || !phone || !addr) { showToast('请填写收件信息', '#ef4444'); return; }

    const order = {
        id: Date.now(),
        poId, contact, phone, addr, items,
        supplier: supplierIdx !== '' ? suppliers[supplierIdx].name : '未知',
        express: '圆通速递',
        status: 'pending',
        createdAt: new Date().toISOString(),
        waybillNo: ''
    };
    returnOrders.unshift(order);
    localStorage.setItem('returnOrders', JSON.stringify(returnOrders));
    showWaybill(order);
    showToast('退货单已创建', '#10b981');
}

// === 面单预览 ===
function showWaybill(order) {
    const html = `
    <div class="waybill">
        <div class="title">圆通速递</div>
        <div class="section">
            <div class="label">寄件人</div>
            <div>广州市捷展贸易有限公司</div>
            <div>广州市海珠区</div>
            <div>020-XXXXXXXX</div>
        </div>
        <div class="section">
            <div class="label">收件人</div>
            <div>${order.contact}</div>
            <div>${order.addr}</div>
            <div>${order.phone}</div>
        </div>
        <div class="section">
            <div class="label">退货明细</div>
            <div>采购单号: ${order.poId}</div>
            <div>${order.items || '无明细'}</div>
        </div>
        <div class="section">
            <div class="label">供应商</div>
            <div>${order.supplier}</div>
        </div>
        <div style="text-align:center;padding:8px;font-size:11px;color:#666;">
            ${new Date(order.createdAt).toLocaleString()}<br>
            运单号: ${order.waybillNo || '等待圆通API返回'}
        </div>
    </div>`;
    document.getElementById('waybillContent').innerHTML = html;
    document.getElementById('waybillModal').style.display = 'block';
}

function closeWaybill() { document.getElementById('waybillModal').style.display = 'none'; }

function printWaybill() {
    const content = document.getElementById('waybillContent').innerHTML;
    const win = window.open('', '_blank');
    win.document.write(`<html><head><style>
        .waybill{width:76mm;height:130mm;border:1px solid #000;padding:4mm;font-size:10px;font-family:monospace;background:#fff;}
        .waybill .title{text-align:center;font-size:16px;font-weight:bold;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:6px;}
        .waybill .section{border-bottom:1px solid #000;padding:4px 0;margin-bottom:4px;}
        .waybill .label{font-weight:bold;}
        @media print{@page{size:76mm 130mm;margin:0;}}
    </style></head><body>${content}</body></html>`);
    win.document.close();
    win.print();
}

// === 退货记录 ===
function renderOrders() {
    const el = document.getElementById('orderList');
    if (returnOrders.length === 0) { el.innerHTML = '<div style="color:#999;text-align:center;padding:20px;font-size:13px;">暂无退货记录</div>'; return; }
    el.innerHTML = returnOrders.map(o => `
        <div class="order-item">
            <div class="header">
                <span class="po">采购单 ${o.poId}</span>
                <span class="status ${o.status === 'shipped' ? 'status-shipped' : 'status-pending'}">${o.status === 'shipped' ? '已寄出' : '待寄出'}</span>
            </div>
            <div style="font-size:12px;color:#666;margin-top:4px;">
                ${o.supplier} · ${o.express}<br>
                ${o.items || ''}<br>
                ${new Date(o.createdAt).toLocaleString()}
            </div>
            <div style="margin-top:6px;display:flex;gap:8px;">
                <button onclick="showWaybill(${JSON.stringify(o).replace(/"/g,'&quot;')})" style="padding:4px 10px;border:1px solid #4A90D9;border-radius:6px;background:#fff;color:#4A90D9;font-size:12px;cursor:pointer;">查看面单</button>
                <button onclick="deleteOrder(${o.id})" style="padding:4px 10px;border:1px solid #dc2626;border-radius:6px;background:#fff;color:#dc2626;font-size:12px;cursor:pointer;">删除</button>
            </div>
        </div>`).join('');
}

function deleteOrder(id) {
    returnOrders = returnOrders.filter(o => o.id !== id);
    localStorage.setItem('returnOrders', JSON.stringify(returnOrders));
    renderOrders();
    showToast('已删除', '#10b981');
}

// 初始化
updateSupplierSelect();
</script>
