<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>改标计时&计件统计系统</title>
<style>
:root{--primary:#4F46E5;--primary-light:#818CF8;--success:#10B981;--danger:#EF4444;--warning:#F59E0B;--bg:#F3F4F6;--card:#FFF;--text:#1F2937;--text2:#6B7280;--border:#E5E7EB}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;padding-bottom:70px}
.header{background:var(--primary);color:#fff;padding:14px 16px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header .user-info{font-size:13px;font-weight:400;opacity:.85;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:47px;z-index:99}
.tab{flex:1;text-align:center;padding:10px 0;font-size:14px;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer;display:none}
.tab.visible{display:block}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.page{display:none;padding:12px}
.page.active{display:block}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:14px;font-weight:600;margin-bottom:10px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary)}
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:10px;text-align:center;border-radius:8px;border:2px solid var(--border);font-size:14px;font-weight:600;cursor:pointer;background:#fff}
.type-btn.active{border-color:var(--primary);background:var(--primary);color:#fff}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{display:inline-block;width:auto;padding:6px 14px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.5}
.timer-display{text-align:center;font-size:42px;font-weight:700;color:var(--primary);padding:16px 0;font-variant-numeric:tabular-nums}
.timer-display.running{color:var(--success)}
.record-item{padding:12px 0;border-bottom:1px solid var(--border)}
.record-item:last-child{border-bottom:none}
.record-row{display:flex;justify-content:space-between;align-items:center}
.record-style{font-weight:600;font-size:15px}
.record-detail{font-size:13px;color:var(--text2);margin-top:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-pending{background:#FEF3C7;color:#92400E}
.badge-approved{background:#D1FAE5;color:#065F46}
.badge-rejected{background:#FEE2E2;color:#991B1B}
/* PLACEHOLDER_CSS2 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.stat-card{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.stat-value{font-size:22px;font-weight:700;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text2);margin-top:2px}
.month-picker{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.month-picker button{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
.month-picker span{font-size:16px;font-weight:600;min-width:100px;text-align:center}
.empty{text-align:center;color:var(--text2);padding:30px 0;font-size:14px}
.login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:20px}
.login-card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:340px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.login-card h2{text-align:center;margin-bottom:20px;font-size:18px}
.worker-list{display:flex;flex-direction:column;gap:8px}
.worker-item{padding:12px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:15px;cursor:pointer}
.worker-item:active{background:var(--primary);color:#fff;border-color:var(--primary)}
.record-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.record-table th{background:var(--bg);padding:6px 4px;text-align:left;font-weight:600;font-size:11px;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap;overflow:hidden}
.record-table td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.record-table tr:last-child td{border-bottom:none}
.record-table tr.clickable{cursor:pointer}
.record-table tr.clickable:active{background:var(--bg)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.edit-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--primary)}
.edit-btn:active{background:var(--primary);color:#fff}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto}
.reject-input{margin-top:8px;display:none}
.reject-input.show{display:block}
.filter-bar{display:flex;gap:8px;margin-bottom:10px}
.filter-bar select,.filter-bar input{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.role-tag{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px}
.role-worker{background:#DBEAFE;color:#1E40AF}
.role-approver{background:#FEF3C7;color:#92400E}
.role-admin{background:#EDE9FE;color:#5B21B6}
.role-checker{background:#ECFDF5;color:#047857}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <h2>选择身份</h2>
    <div class="worker-list" id="workerList"></div>
    <div style="margin-top:14px;text-align:center">
      <a href="#" onclick="showAddForm('login')" style="color:var(--primary);font-size:13px">+ 添加新成员</a>
    </div>
    <div id="addFormLogin" style="display:none;margin-top:12px">
      <div class="form-group"><input id="newNameLogin" placeholder="姓名"></div>
      <div class="form-group">
        <select id="newRoleLogin"><option value="worker">车标人</option><option value="approver">审核人</option><option value="admin">管理员</option><option value="checker">对账</option></select>
      </div>
      <div class="form-group"><input id="newPinLogin" placeholder="PIN码（4位数字）" type="password" maxlength="4" inputmode="numeric"></div>
      <button class="btn btn-primary" onclick="addMemberFrom('login')">添加</button>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainApp" style="display:none">
<div class="header">
  <span>改标计时&计件统计</span>
  <span class="user-info" id="headerUser" onclick="logout()"></span>
</div>
<div class="tabs" id="mainTabs">
  <div class="tab" data-page="record" data-roles="worker,admin" data-order-worker="1" data-order-approver="9" data-order-admin="3" data-order-checker="9">录入</div>
  <div class="tab" data-page="history" data-roles="worker,approver,admin,checker" data-order-worker="2" data-order-approver="2" data-order-admin="1" data-order-checker="1">记录</div>
  <div class="tab" data-page="approve" data-roles="approver,admin" data-order-worker="9" data-order-approver="1" data-order-admin="4" data-order-checker="9">审核</div>
  <div class="tab" data-page="manage" data-roles="admin" data-order-worker="9" data-order-approver="9" data-order-admin="2" data-order-checker="9">管理</div>
</div>

<!-- 录入页 -->
<div class="page" id="page-record">
  <div class="card">
    <div class="type-toggle">
      <div class="type-btn active" data-type="piece" onclick="switchType('piece')">📦 计件</div>
      <div class="type-btn" data-type="time" onclick="switchType('time')">⏱ 计时</div>
    </div>
    <div class="form-group"><label>款号/单号</label><input id="inputStyle" placeholder="输入款号或单号"></div>
    <div class="form-group" style="position:relative"><label>销售</label><input id="inputSales" placeholder="输入销售名字" autocomplete="off" onfocus="showSalesHints()" oninput="showSalesHints()"><div id="salesHints" style="display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;max-height:150px;overflow-y:auto;z-index:10"></div></div>
    <div id="pieceFields">
      <div class="form-group"><label>数量（件）</label><input id="inputQty" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="form-group"><label>单价（元/件）</label><input id="inputPiecePrice" type="number" inputmode="decimal" step="0.1" placeholder="0.00"></div>
    </div>
    <div id="timeFields" style="display:none">
      <div class="type-toggle" style="margin-bottom:10px">
        <div class="type-btn active" data-tmode="timer" onclick="switchTimeMode('timer')">⏱ 计时器</div>
        <div class="type-btn" data-tmode="manual" onclick="switchTimeMode('manual')">✏️ 手动输入</div>
      </div>
      <div id="timerMode">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div id="timerBtns1" style="margin-bottom:12px">
          <button class="btn btn-success" onclick="startTimer()">▶ 开始计时</button>
        </div>
        <div id="timerBtns2" style="display:none;display:flex;gap:8px;margin-bottom:12px">
          <button class="btn btn-success" id="btnPause" onclick="pauseTimer()" style="flex:1">⏸ 暂停</button>
          <button class="btn btn-danger" id="btnStop" onclick="stopTimer()" style="flex:1">⏹ 结束</button>
        </div>
      </div>
      <div id="manualMode" style="display:none">
        <div style="margin-bottom:8px">
          <label style="font-size:13px;color:var(--text2)">开始时间</label>
          <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
            <select id="inputStartH" onchange="calcManualTime()" style="flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:18px;font-weight:600;text-align:center;appearance:none;-webkit-appearance:none;background:#fff"></select>
            <span style="font-size:20px;font-weight:700">:</span>
            <select id="inputStartM" onchange="calcManualTime()" style="flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:18px;font-weight:600;text-align:center;appearance:none;-webkit-appearance:none;background:#fff"></select>
          </div>
        </div>
        <div style="margin-bottom:8px">
          <label style="font-size:13px;color:var(--text2)">结束时间</label>
          <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
            <select id="inputEndH" onchange="calcManualTime()" style="flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:18px;font-weight:600;text-align:center;appearance:none;-webkit-appearance:none;background:#fff"></select>
            <span style="font-size:20px;font-weight:700">:</span>
            <select id="inputEndM" onchange="calcManualTime()" style="flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:18px;font-weight:600;text-align:center;appearance:none;-webkit-appearance:none;background:#fff"></select>
          </div>
        </div>
      </div>
      <div style="border:2px solid var(--primary);border-radius:8px;padding:12px;text-align:center;min-height:44px;margin-bottom:12px" id="timeResult"><span style="color:var(--text2);font-size:14px">工时将显示在这里</span></div>
    </div>
    <div class="form-group"><label>备注</label><textarea id="inputRemark" rows="2" placeholder="款号/单号和备注至少填一个"></textarea></div>
    <button class="btn btn-primary" id="btnSubmit" onclick="submitRecord()">提交</button>
  </div>
</div>

<!-- 记录+统计页 -->
<div class="page" id="page-history">
  <div class="card">
    <div class="month-picker">
      <button onclick="changeMonth(-1)">◀</button>
      <span id="statsMonth"></span>
      <button onclick="changeMonth(1)">▶</button>
    </div>
    <div class="stat-grid" id="statsGrid"></div>
  </div>
  <div class="card">
    <div class="filter-bar">
      <select id="historyStatus" onchange="loadHistory()">
        <option value="all">全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option>
      </select>
      <select id="historyType" onchange="loadHistory()">
        <option value="all">全部类型</option><option value="piece">计件</option><option value="time">计时</option>
      </select>
    </div>
    <div id="historyList"></div>
  </div>
  <button class="btn btn-primary" style="margin-top:8px" id="btnExport" onclick="exportCSV()">📥 导出Excel</button>
</div>

<!-- 审核页 -->
<div class="page" id="page-approve">
  <div class="card">
    <div class="card-title">待审核</div>
    <div id="approveList"></div>
  </div>
</div>

<!-- 管理页 -->
<div class="page" id="page-manage">
  <div class="card">
    <div class="card-title">成员管理</div>
    <div id="memberList"></div>
    <div style="margin-top:10px">
      <a href="#" onclick="showAddForm('manage')" style="color:var(--primary);font-size:13px">+ 添加成员</a>
    </div>
    <div id="addFormManage" style="display:none;margin-top:12px">
      <div class="form-group"><input id="newNameManage" placeholder="姓名"></div>
      <div class="form-group">
        <select id="newRoleManage"><option value="worker">车标人</option><option value="approver">审核人</option><option value="admin">管理员</option><option value="checker">对账</option></select>
      </div>
      <div class="form-group"><input id="newPinManage" placeholder="PIN码（4位数字）" type="password" maxlength="4" inputmode="numeric"></div>
      <button class="btn btn-success btn-sm" onclick="addMemberFrom('manage')">确认添加</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">工价设置</div>
    <div class="form-group"><label>计时工价（元/小时）</label><input id="settingHourPrice" type="number" inputmode="decimal" step="0.5" value="39.5"></div>
    <button class="btn btn-primary btn-sm" onclick="saveHourPrice()">保存</button>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal" style="display:none" onclick="if(event.target===this)closeEdit()">
  <div class="modal-card">
    <div class="card-title">修改记录</div>
    <div class="form-group"><label>款号/单号</label><input id="editStyle"></div>
    <div class="form-group"><label>销售</label><input id="editSales"></div>
    <div id="editPieceFields">
      <div class="form-group"><label>数量</label><input id="editQty" type="number" inputmode="numeric"></div>
      <div class="form-group" id="editPricePieceWrap"><label>单价（元/件）</label><input id="editPiecePrice" type="number" inputmode="decimal" step="0.1"></div>
    </div>
    <div id="editTimeFields" style="display:none">
      <div class="form-group"><label>工时（小时）</label><input id="editHours" type="number" inputmode="decimal" step="0.1"></div>
      <div class="form-group" id="editPriceTimeWrap"><label>工时单价（元/小时）</label><input id="editHourPrice" type="number" inputmode="decimal" step="0.5"></div>
    </div>
    <div class="form-group"><label>备注</label><textarea id="editRemark" rows="2"></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="saveEdit()" style="flex:1">保存</button>
      <button class="btn" onclick="closeEdit()" style="flex:1;background:var(--border)">取消</button>
    </div>
  </div>
</div>

<script>
const SB_URL='https://elyfxyrdbuykyklfjfdr.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseWZ4eXJkYnV5a3lrbGZqZmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIwMjQsImV4cCI6MjA5NjU3ODAyNH0.irrMM8iKJVGnOBW6VQ4BHlkwiVIDtB97EPiHvasOWyg';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

let currentUser=null, timerInterval=null, timerSeconds=0, timerRunning=false, statsYear, statsMonth;
let HOUR_PRICE=parseFloat(localStorage.getItem('label_hour_price')||'39.5');

async function sb(table,method='GET',body=null,query=''){
  const opts={method,headers:{...H}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(`${SB_URL}/rest/v1/${table}${query}`,opts);
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}

// === Roles ===
function userRole(){
  if(!currentUser)return'worker';
  // Check both sources: role field or _type
  return currentUser.role||currentUser._type||'worker';
}
function canSee(roles){return roles.split(',').includes(userRole());}
function isAdmin(){return userRole()==='admin';}
function isApprover(){return userRole()==='approver'||isAdmin();}
function canSeePrice(){return isApprover()||userRole()==="checker";}

// === Login ===
async function initLogin(){
  const all=await loadAllMembers();
  const el=document.getElementById('workerList');
  if(!all.length){el.innerHTML='<div class="empty">暂无成员，请先添加</div>';return;}
  el.innerHTML=all.map(w=>{
    const roleLabel=w.role==='admin'?'管理员':w.role==='approver'?'审核人':w.role==='checker'?'对账':'车标人';
    const roleClass=w.role==='admin'?'role-admin':w.role==='approver'?'role-approver':w.role==='checker'?'role-checker':'role-worker';
    return `<div class="worker-item" onclick="loginAs('${w.id}')">${w.name}<span class="role-tag ${roleClass}">${roleLabel}</span></div>`;
  }).join('');
}

async function loadAllMembers(){
  const workers=await sb('label_workers','GET',null,'?order=created_at.asc')||[];
  const approvers=await sb('label_approvers','GET',null,'?order=created_at.asc')||[];
  return [...workers.map(w=>({...w,_src:'workers',role:w.role||'worker'})),...approvers.map(a=>({...a,_src:'approvers',role:'approver'}))];
}

// PLACEHOLDER_JS_A
async function loginAs(id){
  const pin=prompt('请输入PIN码');if(!pin)return;
  // Try workers first, then approvers
  let data=await sb('label_workers','GET',null,`?id=eq.${id}&pin=eq.${pin}`);
  let src='workers';
  if(!data||!data.length){data=await sb('label_approvers','GET',null,`?id=eq.${id}&pin=eq.${pin}`);src='approvers';}
  if(!data||!data.length){alert('PIN码错误');return;}
  currentUser={...data[0],_src:src,role:data[0].role||(src==='approvers'?'approver':'worker')};
  localStorage.setItem('label_user',JSON.stringify(currentUser));
  showMain();
}
function showMain(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainApp').style.display='block';
  const roleLabel=userRole()==='admin'?'管理员':isApprover()?'审核人':userRole()==='checker'?'对账':'车标人';
  document.getElementById('headerUser').innerHTML=currentUser.name+' <span style="font-size:11px;opacity:.7">退出</span>';
  // Show/hide and sort tabs by role
  const role=userRole();
  const tabContainer=document.getElementById('mainTabs');
  const tabs=[...tabContainer.querySelectorAll('.tab')];
  tabs.forEach(t=>{
    const roles=t.dataset.roles||'';
    t.classList.toggle('visible',roles.split(',').includes(role));
  });
  tabs.sort((a,b)=>(parseInt(a.dataset['order'+role.charAt(0).toUpperCase()+role.slice(1)])||9)-(parseInt(b.dataset['order'+role.charAt(0).toUpperCase()+role.slice(1)])||9));
  tabs.forEach(t=>tabContainer.appendChild(t));
  document.getElementById('btnExport').style.display=canSeePrice()?'block':'none';
  const now=new Date();statsYear=now.getFullYear();statsMonth=now.getMonth()+1;
  // Default tab: admin→记录, approver→审核, worker→录入
  switchTab(isAdmin()?'history':userRole()==='checker'?'history':isApprover()?'approve':'record');
}
function logout(){localStorage.removeItem('label_user');currentUser=null;document.getElementById('loginPage').style.display='flex';document.getElementById('mainApp').style.display='none';initLogin();}

// === Tabs ===
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.page)));
function switchTab(page){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+page));
  if(page==='history'){loadHistory();loadStats();}
  if(page==='approve')loadApprove();
  if(page==='manage')loadManage();
}

// === Type Toggle ===
function switchType(type){document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===type));document.getElementById('pieceFields').style.display=type==='piece'?'block':'none';document.getElementById('timeFields').style.display=type==='time'?'block':'none';}
function switchTimeMode(mode){document.querySelectorAll('[data-tmode]').forEach(b=>b.classList.toggle('active',b.dataset.tmode===mode));document.getElementById('timerMode').style.display=mode==='timer'?'block':'none';document.getElementById('manualMode').style.display=mode==='manual'?'block':'none';updateTimeResult();}

// === Timer (persistent) ===
function saveTimerState(){localStorage.setItem('label_timer',JSON.stringify({seconds:timerSeconds,running:timerRunning,startedAt:timerRunning?Date.now()-timerSeconds*1000:null,stopped:timerStopped}));}
function loadTimerState(){
  const s=localStorage.getItem('label_timer');if(!s)return;
  const d=JSON.parse(s);timerStopped=d.stopped||false;
  if(d.running&&d.startedAt){timerSeconds=Math.floor((Date.now()-d.startedAt)/1000);timerRunning=false;startTimer();}
  else{timerSeconds=d.seconds||0;}
  updateTimer();updateTimerUI();
}
let timerStopped=false;
let stoppedMinutes=0;
function startTimer(){
  const style=document.getElementById('inputStyle').value.trim();
  const sales=document.getElementById('inputSales').value.trim();
  if(!style&&!sales){alert('请先填写款号/单号或销售');return;}
  timerRunning=true;stoppedMinutes=0;
  document.getElementById('timerDisplay').classList.add('running');
  timerInterval=setInterval(()=>{timerSeconds++;updateTimer();if(timerSeconds%5===0)saveTimerState();},1000);
  updateTimerUI();saveTimerState();
}
function pauseTimer(){
  clearInterval(timerInterval);timerRunning=false;
  document.getElementById('timerDisplay').classList.remove('running');
  updateTimerUI();saveTimerState();
}
function stopTimer(){
  clearInterval(timerInterval);timerRunning=false;
  stoppedMinutes=timerSeconds/60;
  timerSeconds=0;timerStopped=false;
  document.getElementById('timerDisplay').classList.remove('running');
  updateTimer();updateTimerUI();updateTimeResult();
  localStorage.removeItem('label_timer');
}
function resetTimerFull(){
  clearInterval(timerInterval);timerSeconds=0;timerRunning=false;timerStopped=false;stoppedMinutes=0;
  updateTimer();updateTimerUI();updateTimeResult();localStorage.removeItem('label_timer');
}
function updateTimer(){
  const h=Math.floor(timerSeconds/3600),m=Math.floor((timerSeconds%3600)/60),s=timerSeconds%60;
  document.getElementById('timerDisplay').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  updateTimeResult();
}
function updateTimeResult(){
  const el=document.getElementById('timeResult');
  const isManual=document.querySelector('[data-tmode="manual"]')&&document.querySelector('[data-tmode="manual"]').classList.contains('active');
  if(isManual){
    let mins=getManualMinutes();
    if(mins<=0){el.innerHTML='<span style="color:var(--danger);font-weight:600">结束时间须晚于开始时间</span>';return;}
    el.innerHTML=`<span style="color:var(--primary);font-size:18px;font-weight:700">工时：${(mins/60).toFixed(1)} 小时（${mins} 分钟）</span>`;
  }else{
    const mins=stoppedMinutes>0?stoppedMinutes:(timerSeconds>0?Math.round(timerSeconds/60*10)/10:0);
    if(mins<0.01){el.innerHTML='<span style="color:var(--text2);font-size:14px">工时将显示在这里</span>';return;}
    el.innerHTML=`<span style="color:var(--primary);font-size:18px;font-weight:700">工时：${(mins/60).toFixed(1)} 小时（${Math.round(mins)} 分钟）</span>`;
  }
}
function updateTimerUI(){
  const b1=document.getElementById('timerBtns1'),b2=document.getElementById('timerBtns2');
  if(timerRunning||timerSeconds>0){
    b1.style.display='none';b2.style.display='flex';
    document.getElementById('btnPause').textContent=timerRunning?'⏸ 暂停':'▶ 继续';
    document.getElementById('btnPause').onclick=timerRunning?pauseTimer:startTimer;
  }else{b1.style.display='block';b2.style.display='none';}
}

// Manual time calc
function initTimeSelects(){
  const now=new Date();const ch=now.getHours(),cm=Math.floor(now.getMinutes()/5)*5;
  ['inputStartH','inputEndH'].forEach(id=>{const el=document.getElementById(id);el.innerHTML='';for(let h=6;h<=23;h++)el.innerHTML+=`<option value="${h}"${h===ch?' selected':''}>${String(h).padStart(2,'0')}时</option>`;});
  ['inputStartM','inputEndM'].forEach(id=>{const el=document.getElementById(id);el.innerHTML='';for(let m=0;m<60;m+=5)el.innerHTML+=`<option value="${m}"${m===cm?' selected':''}>${String(m).padStart(2,'0')}分</option>`;});
}
initTimeSelects();
document.addEventListener('change',e=>{if(['inputStartH','inputStartM','inputEndH','inputEndM'].includes(e.target.id))calcManualTime();});
function getManualMinutes(){
  const sh=parseInt(document.getElementById('inputStartH').value),sm=parseInt(document.getElementById('inputStartM').value);
  const eh=parseInt(document.getElementById('inputEndH').value),em=parseInt(document.getElementById('inputEndM').value);
  return (eh*60+em)-(sh*60+sm);
}
function calcManualTime(){updateTimeResult();}

// === Submit ===
async function submitRecord(){
  const style=document.getElementById('inputStyle').value.trim();
  const remark=document.getElementById('inputRemark').value.trim();
  if(!style&&!remark){alert('款号/单号和备注至少填一个');return;}
  const type=document.querySelector('.type-btn.active[data-type]').dataset.type;
  let rec={worker_id:currentUser.id,worker_name:currentUser.name,type,style_no:style||'-',salesperson:document.getElementById('inputSales').value.trim(),remark:remark};
  if(type==='piece'){
    const qty=parseInt(document.getElementById('inputQty').value);const price=parseFloat(document.getElementById('inputPiecePrice').value);
    if(!qty||qty<=0){alert('请输入数量');return;}if(!price||price<=0){alert('请输入单价');return;}
    rec.quantity=qty;rec.unit_price=price;
  }else{
    const isManual=document.querySelector('[data-tmode="manual"]').classList.contains('active');
    let minutes;
    if(isManual){
      minutes=getManualMinutes();
      if(minutes<=0){alert('结束时间须晚于开始时间');return;}
    } else {
      if(stoppedMinutes>0){minutes=stoppedMinutes;}
      else if(timerSeconds>=60){minutes=Math.round(timerSeconds/60*10)/10;}
      else{alert('请先计时或输入时间');return;}
    }
    rec.duration_minutes=minutes;rec.unit_price=HOUR_PRICE;
  }
  document.getElementById('btnSubmit').disabled=true;
  try{await sb('label_records','POST',rec);addSalesHistory(rec.salesperson);alert('提交成功！');document.getElementById('inputStyle').value='';document.getElementById('inputQty').value='';document.getElementById('inputPiecePrice').value='';document.getElementById('inputRemark').value='';resetTimerFull();initTimeSelects();updateTimeResult();}
  catch(e){alert('提交失败：'+e.message);}
  document.getElementById('btnSubmit').disabled=false;
}

async function loadHistory(){
  const status=document.getElementById('historyStatus').value;
  const type=document.getElementById('historyType').value;
  let q='?order=created_at.desc&limit=100';
  if(userRole()==='worker')q+=`&worker_id=eq.${currentUser.id}`;
  if(status!=='all')q+=`&status=eq.${status}`;
  if(type!=='all')q+=`&type=eq.${type}`;
  const data=await sb('label_records','GET',null,q);
  const el=document.getElementById('historyList');
  if(!data||!data.length){el.innerHTML='<div class="empty">暂无记录</div>';return;}
  const sp=canSeePrice();const showWorker=userRole()!=='worker';
  let html='<div class="table-wrap"><table class="record-table"><thead><tr><th>日期</th>'+(showWorker?'<th>车标人</th>':'')+'<th>类型</th><th>款号/单号</th><th>销售</th><th>数量/工时</th>'+(sp?'<th>单价</th>':'')+'<th>状态</th></tr></thead><tbody>';
  data.forEach(r=>{
    const date=new Date(r.created_at).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
    const typeStr=r.type==='piece'?'计件':'计时';
    const qtyStr=r.type==='piece'?(r.quantity+'件'):((r.duration_minutes/60).toFixed(1)+'h');
    const amt=r.type==='piece'?(r.quantity*r.unit_price).toFixed(2):(r.duration_minutes/60*r.unit_price).toFixed(2);
    const badge=r.status==='pending'?'badge-pending':r.status==='approved'?'badge-approved':'badge-rejected';
    const label=r.status==='pending'?'待审核':r.status==='approved'?'已通过':'已驳回';
    const pw=r.type==='piece'&&r.unit_price>1?'color:var(--danger);font-weight:600':'';
    const delBtn=isAdmin()?' <button class="edit-btn" style="color:var(--danger);border-color:var(--danger)" onclick="event.stopPropagation();deleteRecord(\''+r.id+'\')">删除</button>':'';
    const priceCol=sp?'<td style="'+pw+'">¥'+r.unit_price+(r.type==='time'?'/时':'')+'</td>':'';
    html+=`<tr class="clickable" onclick='openEdit(${JSON.stringify(r).replace(/'/g,"&#39;")})'><td>${date}</td>${showWorker?'<td>'+r.worker_name+'</td>':''}<td>${typeStr}</td><td style="font-weight:600">${r.style_no}</td><td>${r.salesperson||''}</td><td>${qtyStr}</td>${priceCol}<td><span class="badge ${badge}">${label}</span></td>${delBtn?'<td onclick="event.stopPropagation()">'+delBtn+'</td>':''}</tr>`;
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
}

let editingId=null;
function openEdit(r){
  editingId=r.id;
  document.getElementById('editStyle').value=r.style_no||'';
  document.getElementById('editSales').value=r.salesperson||'';
  document.getElementById('editRemark').value=r.remark||'';
  const sp=canSeePrice();
  if(r.type==='piece'){
    document.getElementById('editPieceFields').style.display='block';
    document.getElementById('editTimeFields').style.display='none';
    document.getElementById('editQty').value=r.quantity||'';
    document.getElementById('editPiecePrice').value=r.unit_price||'';
    document.getElementById('editPricePieceWrap').style.display=sp?'block':'none';
  }else{
    document.getElementById('editPieceFields').style.display='none';
    document.getElementById('editTimeFields').style.display='block';
    document.getElementById('editHours').value=r.duration_minutes?(r.duration_minutes/60).toFixed(1):'';
    document.getElementById('editHourPrice').value=r.unit_price||'';
    document.getElementById('editPriceTimeWrap').style.display=sp?'block':'none';
  }
  document.getElementById('editModal').style.display='flex';
}
function closeEdit(){document.getElementById('editModal').style.display='none';editingId=null;}
async function saveEdit(){
  if(!editingId)return;
  const patch={style_no:document.getElementById('editStyle').value.trim(),salesperson:document.getElementById('editSales').value.trim(),remark:document.getElementById('editRemark').value.trim(),status:'pending',reject_reason:null,approved_by:null,approved_at:null};
  if(document.getElementById('editPieceFields').style.display!=='none'){
    patch.quantity=parseInt(document.getElementById('editQty').value)||0;
    if(canSeePrice())patch.unit_price=parseFloat(document.getElementById('editPiecePrice').value)||0;
  }else{
    const hrs=parseFloat(document.getElementById('editHours').value)||0;
    patch.duration_minutes=Math.round(hrs*60*10)/10;
    if(canSeePrice())patch.unit_price=parseFloat(document.getElementById('editHourPrice').value)||HOUR_PRICE;
  }
  await sb('label_records','PATCH',patch,`?id=eq.${editingId}`);
  closeEdit();loadHistory();loadStats();loadApprove();
}

async function loadStats(){
  document.getElementById('statsMonth').textContent=`${statsYear}年${statsMonth}月`;
  const start=`${statsYear}-${String(statsMonth).padStart(2,'0')}-01T00:00:00`;
  const endM=statsMonth===12?1:statsMonth+1;const endY=statsMonth===12?statsYear+1:statsYear;
  const end=`${endY}-${String(endM).padStart(2,'0')}-01T00:00:00`;
  let q=`?status=eq.approved&created_at=gte.${start}&created_at=lt.${end}&order=created_at.desc`;
  if(userRole()==='worker')q+=`&worker_id=eq.${currentUser.id}`;
  const data=await sb('label_records','GET',null,q);
  const grid=document.getElementById('statsGrid');
  if(!data||!data.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">本月无数据</div>';return;}
  let totalPieces=0,totalMinutes=0,totalAmount=0,count=data.length;
  data.forEach(r=>{if(r.type==='piece'){totalPieces+=r.quantity||0;totalAmount+=(r.quantity||0)*r.unit_price;}else{totalMinutes+=r.duration_minutes||0;totalAmount+=(r.duration_minutes||0)/60*r.unit_price;}});
  const showPrice=canSeePrice();
  grid.innerHTML=`<div class="stat-card"><div class="stat-value">${count}</div><div class="stat-label">记录数</div></div><div class="stat-card"><div class="stat-value">${totalPieces}</div><div class="stat-label">总件数</div></div><div class="stat-card"><div class="stat-value">${(totalMinutes/60).toFixed(1)}h</div><div class="stat-label">总工时</div></div>${showPrice?'<div class="stat-card"><div class="stat-value">¥'+totalAmount.toFixed(0)+'</div><div class="stat-label">总金额</div></div>':''}`;
}
function changeMonth(d){statsMonth+=d;if(statsMonth>12){statsMonth=1;statsYear++;}if(statsMonth<1){statsMonth=12;statsYear--;}loadHistory();loadStats();}

    const name=prompt('该记录未填写销售名字，请输入销售名字后才能审核通过：');

  }else{
    await sb('label_records','PATCH',{status:'approved',approved_by:currentUser.name,approved_at:new Date().toISOString()},`?id=eq.${id}`);

async function renameMember(id,src,oldName){
  const newName=prompt('修改名字（修改后历史记录同步更新）：',oldName);
  if(!newName||!newName.trim()||newName.trim()===oldName)return;
  if(!confirm(`确认将「${oldName}」改为「${newName.trim()}」？所有历史记录也会同步修改。`))return;
  const table=src==='approvers'?'label_approvers':'label_workers';
  await sb(table,'PATCH',{name:newName.trim()},`?id=eq.${id}`);
  await sb('label_records','PATCH',{worker_name:newName.trim()},`?worker_id=eq.${id}`);
  if(currentUser&&currentUser.id===id){currentUser.name=newName.trim();localStorage.setItem('label_user',JSON.stringify(currentUser));document.getElementById('headerUser').innerHTML=currentUser.name+' <span style="font-size:11px;opacity:.7">退出</span>';}
  loadManage();alert('修改成功，历史记录已同步更新');

    currentUser=JSON.parse(saved);
    const table=currentUser._src==='approvers'?'label_approvers':'label_workers';
    const check=await sb(table,'GET',null,`?id=eq.${currentUser.id}`);
    if(check&&check.length){currentUser={...check[0],_src:currentUser._src,role:check[0].role||currentUser.role||'worker'};showMain();loadTimerState();return;}
  }
  initLogin();
})();
</script>
</div>
