<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库库位热力图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#333}
.header{padding:12px 16px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:16px;font-weight:700;color:#333}
.header .info{font-size:12px;color:#888}
.toolbar{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap;align-items:center}
.toolbar .section-label{font-size:11px;color:#999;margin-right:2px}
.toolbar .divider{width:1px;height:24px;background:#d0d0d0;margin:0 8px}
.tab{padding:6px 14px;border-radius:4px;border:1px solid #d0d0d0;background:#fff;color:#666;font-size:12px;font-weight:600;cursor:pointer}
.tab:hover{background:#e8f0fe;border-color:#4285f4}
.tab.active{background:#4285f4;color:#fff;border-color:#4285f4}
.heat-btn{padding:5px 12px;border-radius:4px;border:1px solid #d0d0d0;background:#fff;color:#666;font-size:11px;cursor:pointer}
.heat-btn:hover{border-color:#ff9800}
.heat-btn.active{border-color:#ff9800;background:#fff3e0;color:#e65100;font-weight:600}
.export-btn{padding:5px 12px;border-radius:4px;border:1px solid #4caf50;background:#4caf50;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.export-btn:hover{background:#388e3c}
.suggest-btn{padding:5px 12px;border-radius:4px;border:1px solid #9c27b0;background:#9c27b0;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.suggest-btn:hover{background:#7b1fa2}
.legend{display:flex;gap:10px;padding:6px 16px;background:#fff;border-bottom:1px solid #e0e0e0;font-size:10px;color:#666;align-items:center}
.legend-item{display:flex;align-items:center;gap:3px}
.legend-box{width:12px;height:12px;border-radius:2px;border:1px solid #ccc}
.container{padding:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:11px}
th{background:#f0f2f5;padding:6px 4px;border:1px solid #d0d0d0;font-weight:700;text-align:center;position:sticky;top:0;z-index:2}
th.row-header{position:sticky;left:0;z-index:3;background:#f0f2f5;min-width:40px}
td{border:1px solid #d0d0d0;padding:0;vertical-align:top}
.bin-cell{min-width:90px}
.layer{padding:3px 6px;border-bottom:1px solid #e8e8e8;text-align:center;font-size:10px;cursor:pointer;transition:all 0.15s}
.layer:last-child{border-bottom:none}
.layer:hover{filter:brightness(0.85)}
.layer .lname{font-weight:600;color:#333}
.layer .lqty{color:#666;font-size:9px}
/* 颜色等级 */
.heat-0{background:#fff}
.heat-1{background:#e3f2fd}.heat-1 .lname{color:#333}
.heat-2{background:#bbdefb}.heat-2 .lname{color:#333}
.heat-3{background:#90caf9}.heat-3 .lname{color:#333}
.heat-4{background:#64b5f6;color:#fff}.heat-4 .lname,.heat-4 .lqty{color:#fff}
.heat-5{background:#ff9800;color:#fff}.heat-5 .lname,.heat-5 .lqty{color:#fff}
.heat-6{background:#f44336;color:#fff}.heat-6 .lname,.heat-6 .lqty{color:#fff}
.zone-stats{font-size:12px;color:#4285f4;padding:6px 16px}
.empty-cell{background:#fafafa}
.tooltip{display:none;position:fixed;background:#333;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;z-index:100;pointer-events:none;max-width:260px}
.layer.dimmed{opacity:0.12}
/* 弹窗 */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:200;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,0.2);max-width:700px;width:92%;max-height:80vh;overflow:auto}
.modal-header{padding:12px 16px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:14px;color:#333}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999;padding:0 4px}
.modal-close:hover{color:#333}
.modal-body{padding:0}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{background:#f0f2f5;padding:8px 10px;text-align:left;border-bottom:1px solid #d0d0d0;font-weight:600;position:sticky;top:0}
.dt td{padding:6px 10px;border-bottom:1px solid #eee}
.dt tr:hover td{background:#f5f8ff}
.dt .qc{text-align:right;font-weight:600;color:#4285f4}
.dt .kc{text-align:right;color:#666}
/* 建议弹窗 */
.suggest-card{margin:8px 12px;padding:12px;border:1px solid #e0e0e0;border-radius:8px;background:#fafafa}
.suggest-card h4{font-size:13px;margin-bottom:6px;color:#333}
.suggest-card .from{color:#f44336;font-weight:600}
.suggest-card .to{color:#4caf50;font-weight:600}
.suggest-card p{font-size:12px;color:#555;line-height:1.6;margin:4px 0}
</style>
</head>
<body>
<div class="header">
  <h1>🏭 仓库库位热力图</h1>
  <span class="info" id="info">30天出库数据</span>
</div>
<div class="toolbar" id="toolbar">
  <span class="section-label">区域</span>
  <div id="tabs" style="display:contents"></div>
  <div class="divider"></div>
  <span class="section-label">筛选</span>
  <div class="heat-btn" data-heat="all" onclick="filterHeat('all')">全部</div>
  <div class="heat-btn" data-heat="hot" onclick="filterHeat('hot')">🔥高频</div>
  <div class="heat-btn" data-heat="mid" onclick="filterHeat('mid')">中频</div>
  <div class="heat-btn" data-heat="cold" onclick="filterHeat('cold')">❄️低频</div>
  <div class="heat-btn" data-heat="zero" onclick="filterHeat('zero')">⬜无出库</div>
  <div class="divider"></div>
  <div class="export-btn" onclick="exportCSV()">📥 导出CSV</div>
  <div class="suggest-btn" onclick="showSuggestions()">💡 调整建议</div>
</div>
<div class="legend">
  <div class="legend-item"><div class="legend-box" style="background:#fff"></div>无出库</div>
  <div class="legend-item"><div class="legend-box" style="background:#e3f2fd"></div>低频</div>
  <div class="legend-item"><div class="legend-box" style="background:#90caf9"></div>中频</div>
  <div class="legend-item"><div class="legend-box" style="background:#64b5f6"></div>较高</div>
  <div class="legend-item"><div class="legend-box" style="background:#ff9800"></div>高频</div>
  <div class="legend-item"><div class="legend-box" style="background:#f44336"></div>超高频</div>
</div>
<div class="zone-stats" id="zoneStats"></div>
<div class="container"><div id="tableWrap"></div></div>
<div class="tooltip" id="tooltip"></div>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">库位商品信息</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

const HIDE = new Set(['BF','M','W','Z']);
const VZ = Object.keys(DATA).filter(z=>!HIDE.has(z)).sort();
const tabsEl = document.getElementById('tabs');
const statsEl = document.getElementById('zoneStats');
const wrapEl = document.getElementById('tableWrap');
const tooltip = document.getElementById('tooltip');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

let skuData = null;
let curZone = null;
let curHeat = 'all';

function getAllQty(){
  const a=[];
  for(const z of VZ) for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
    const q=DATA[z][r][g][l]; if(q>0) a.push(q);
  }
  return a.sort((a,b)=>a-b);
}
const allQ=getAllQty();
const p50=allQ[Math.floor(allQ.length*0.5)]||1;
const p75=allQ[Math.floor(allQ.length*0.75)]||1;
const p90=allQ[Math.floor(allQ.length*0.90)]||1;
const p95=allQ[Math.floor(allQ.length*0.95)]||1;

function heatLevel(qty){
  if(!qty||qty===0) return 0;
  if(qty<=p50) return 1;
  if(qty<=p75) return 2;
  if(qty<=p90) return 3;
  if(qty<=p95) return 4;
  if(qty<=p95*2) return 5;
  return 6;
}

function matchFilter(level){
  if(curHeat==='all') return true;
  if(curHeat==='hot') return level>=5;
  if(curHeat==='mid') return level>=2 && level<=4;
  if(curHeat==='cold') return level===1;
  if(curHeat==='zero') return level===0;
  return true;
}


function renderZone(zone){
  curZone=zone;
  const zd=DATA[zone];
  const rows=Object.keys(zd).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
  const gs=new Set();
  rows.forEach(r=>Object.keys(zd[r]).forEach(g=>gs.add(g)));
  const groups=[...gs].sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));

  let tB=0,tQ=0,aB=0;
  rows.forEach(r=>groups.forEach(g=>{
    if(zd[r]&&zd[r][g]) Object.entries(zd[r][g]).forEach(([l,q])=>{tB++;tQ+=q;if(q>0)aB++;});
  }));
  statsEl.textContent=zone+'区: '+tB+'个库位 | '+aB+'个有出库 | 30天出库 '+tQ.toLocaleString()+'件';

  let h='<table><thead><tr><th class="row-header">排\\组</th>';
  groups.forEach(g=>{h+='<th>'+g+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><th class="row-header">'+r+'</th>';
    groups.forEach(g=>{
      if(zd[r]&&zd[r][g]){
        const layers=zd[r][g];
        const lkeys=Object.keys(layers).sort((a,b)=>parseInt(a)-parseInt(b));
        h+='<td class="bin-cell">';
        lkeys.forEach(l=>{
          const q=layers[l]||0;
          const fn=zone+'-'+r+'-'+g+'-'+l;
          const lv=heatLevel(q);
          const dim=matchFilter(lv)?'':'dimmed';
          h+='<div class="layer heat-'+lv+' '+dim+'" data-bin="'+fn+'" data-qty="'+q+'" data-lv="'+lv+'"><span class="lname">'+fn+'</span><br><span class="lqty">('+q+')</span></div>';
        });
        h+='</td>';
      } else {h+='<td class="empty-cell"></td>';}
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  wrapEl.innerHTML=h;
  bindLayerEvents();
}

function bindLayerEvents(){
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.onmouseenter=e=>{
      tooltip.style.display='block';
      tooltip.innerHTML='<b>'+el.dataset.bin+'</b><br>30天出库: '+parseInt(el.dataset.qty).toLocaleString()+'件<br><span style="color:#aaa;font-size:10px">点击查看商品</span>';
    };
    el.onmousemove=e=>{tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-40)+'px';};
    el.onmouseleave=()=>{tooltip.style.display='none';};
    el.onclick=()=>{tooltip.style.display='none';showBinDetail(el.dataset.bin,parseInt(el.dataset.qty));};
  });
}


function filterHeat(heat){
  curHeat=heat;
  document.querySelectorAll('.heat-btn').forEach(b=>b.classList.toggle('active',b.dataset.heat===heat));
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.classList.toggle('dimmed',!matchFilter(parseInt(el.dataset.lv)));
  });
}
filterHeat('all');

VZ.forEach(z=>{
  const btn=document.createElement('div');
  btn.className='tab';btn.textContent=z+'区';btn.dataset.zone=z;
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');renderZone(z);
  };
  tabsEl.appendChild(btn);
});
if(VZ.length){tabsEl.querySelector('.tab').classList.add('active');renderZone(VZ[0]);}

function closeModal(){modal.classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

async function loadSkuData(){
  if(skuData) return skuData;
  try{const r=await fetch('bin_sku_detail.json');skuData=await r.json();return skuData;}catch(e){return null;}
}

async function showBinDetail(binName,totalQty){
  modalTitle.textContent=binName+' 库位商品信息';
  modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">加载中...</div>';
  modal.classList.add('show');
  const data=await loadSkuData();
  if(!data||!data[binName]){modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">暂无数据</div>';return;}
  const items=data[binName];
  let h='<table class="dt"><thead><tr><th>商品编号</th><th>商品类目</th><th style="text-align:right">现有库存</th><th style="text-align:right">30天出库</th></tr></thead><tbody>';
  let tS=0;
  items.forEach(it=>{
    tS+=(it.k||0);
    h+='<tr><td>'+it.s+'</td><td>'+(it.n||'-')+'</td><td class="kc">'+(it.k||0).toLocaleString()+'</td><td class="qc">'+it.q.toLocaleString()+'</td></tr>';
  });
  h+='</tbody><tfoot><tr style="font-weight:700;background:#f0f2f5"><td>合计 ('+items.length+'个SKU)</td><td></td><td class="kc">'+tS.toLocaleString()+'</td><td class="qc">'+totalQty.toLocaleString()+'</td></tr></tfoot></table>';
  modalBody.innerHTML=h;
}


async function exportCSV(){
  const data=await loadSkuData();
  if(!data){alert('数据加载失败');return;}
  let csv='\uFEFF库位,商品编号,商品类目,现有库存,30天出库\n';
  // All visible zones
  for(const z of VZ){
    for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
      const fn=z+'-'+r+'-'+g+'-'+l;
      const items=data[fn]||[];
      if(items.length===0){
        csv+=fn+',,,,0\n';
      } else {
        items.forEach(it=>{
          csv+=fn+','+it.s+','+(it.n||'')+','+(it.k||0)+','+it.q+'\n';
        });
      }
    }
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='仓库热力图_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}


async function showSuggestions(){
  modalTitle.textContent='💡 库位调整建议';
  modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">分析中...</div>';
  modal.classList.add('show');
  const data=await loadSkuData();
  if(!data){modalBody.innerHTML='<div style="padding:20px;color:#888">数据加载失败</div>';return;}

  // 1. 收集所有库位热力数据
  const binInfo=[];
  for(const z of VZ){
    for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
      const fn=z+'-'+r+'-'+g+'-'+l;
      const qty=DATA[z][r][g][l];
      const lv=heatLevel(qty);
      const row=parseInt(r)||0;
      const layer=parseInt(l)||0;
      binInfo.push({name:fn,zone:z,row:row,layer:layer,qty:qty,lv:lv});
    }
  }

  // 拣货便利度评分: A区>B>C>D... 排号小的离入口近, 层2-3最方便拿
  const zoneScore={'A':10,'B':8,'C':7,'D':6,'E':5,'F':4,'G':3,'H':2};
  function convenience(b){
    const zs=zoneScore[b.zone]||1;
    const rs=Math.max(0,20-b.row); // 排号越小越好
    const ls=b.layer>=2&&b.layer<=3?5:(b.layer===1||b.layer===4)?3:1; // 2-3层最好
    return zs*3+rs+ls*2;
  }

  binInfo.forEach(b=>b.conv=convenience(b));

  // 找问题: 高频出库但在偏远位置, 低频出库但占了好位置
  const hotFar=[]; // 高频但不方便
  const coldNear=[]; // 低频但很方便
  const convSorted=[...binInfo].sort((a,b)=>b.conv-a.conv);
  const convP75=convSorted[Math.floor(convSorted.length*0.25)]?.conv||0;
  const convP25=convSorted[Math.floor(convSorted.length*0.75)]?.conv||0;

  binInfo.forEach(b=>{
    if(b.lv>=5 && b.conv<=convP25) hotFar.push(b);
    if(b.lv<=1 && b.qty===0 && b.conv>=convP75) coldNear.push(b);
  });

  hotFar.sort((a,b)=>b.qty-a.qty);
  coldNear.sort((a,b)=>b.conv-a.conv);

  let html='<div style="padding:12px">';
  html+='<div style="margin-bottom:12px;padding:10px;background:#e8f5e9;border-radius:6px;font-size:12px">'+
    '<b>分析规则</b>：A区最近入口，排号越小越近，2-3层最方便拿取。高频出库商品应放在方便位置。</div>';

  // 建议配对: 把高频从远处搬到近处空位
  const pairs=[];
  const usedTargets=new Set();
  hotFar.slice(0,20).forEach(hot=>{
    const target=coldNear.find(c=>!usedTargets.has(c.name));
    if(target){
      usedTargets.add(target.name);
      pairs.push({from:hot,to:target});
    }
  });

  if(pairs.length===0){
    html+='<div style="padding:20px;text-align:center;color:#4caf50;font-size:14px">✅ 当前库位分布合理，无需调整</div>';
  } else {
    html+='<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#333">建议调整 ('+pairs.length+'项)</div>';
    pairs.forEach((p,i)=>{
      html+='<div class="suggest-card"><h4>#'+(i+1)+' '+p.from.name+' → '+p.to.name+'</h4>'+
        '<p><span class="from">'+p.from.name+'</span> 30天出库 <b>'+p.from.qty.toLocaleString()+'</b>件，位置偏远(便利度'+p.from.conv+')</p>'+
        '<p>建议移至 <span class="to">'+p.to.name+'</span> (便利度'+p.to.conv+'，当前无出库)</p></div>';
    });
  }

  // 统计总览
  const hotCount=binInfo.filter(b=>b.lv>=5).length;
  const midCount=binInfo.filter(b=>b.lv>=2&&b.lv<=4).length;
  const coldCount=binInfo.filter(b=>b.lv===1).length;
  const zeroCount=binInfo.filter(b=>b.lv===0).length;
  html+='<div style="margin-top:12px;padding:10px;background:#f5f5f5;border-radius:6px;font-size:12px;color:#555">'+
    '<b>库位总览</b>：高频(🔥) '+hotCount+' | 中频 '+midCount+' | 低频(❄️) '+coldCount+' | 无出库 '+zeroCount+
    ' | 总计 '+binInfo.length+'</div>';

  html+='</div>';
  modalBody.innerHTML=html;
}

const HIDE = new Set(['BF','M','W','Z']);
const VZ = Object.keys(DATA).filter(z=>!HIDE.has(z)).sort();
const tabsEl = document.getElementById('tabs');
const statsEl = document.getElementById('zoneStats');
const wrapEl = document.getElementById('tableWrap');
const tooltip = document.getElementById('tooltip');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

let skuData = null;
let curZone = null;
let curHeat = 'all';

function getAllQty(){
  const a=[];
  for(const z of VZ) for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
    const q=DATA[z][r][g][l]; if(q>0) a.push(q);
  }
  return a.sort((a,b)=>a-b);
}
const allQ=getAllQty();
const p50=allQ[Math.floor(allQ.length*0.5)]||1;
const p75=allQ[Math.floor(allQ.length*0.75)]||1;
const p90=allQ[Math.floor(allQ.length*0.90)]||1;
const p95=allQ[Math.floor(allQ.length*0.95)]||1;

function heatLevel(qty){
  if(!qty||qty===0) return 0;
  if(qty<=p50) return 1;
  if(qty<=p75) return 2;
  if(qty<=p90) return 3;
  if(qty<=p95) return 4;
  if(qty<=p95*2) return 5;
  return 6;
}

function matchFilter(level){
  if(curHeat==='all') return true;
  if(curHeat==='hot') return level>=5;
  if(curHeat==='mid') return level>=2 && level<=4;
  if(curHeat==='cold') return level===1;
  if(curHeat==='zero') return level===0;
  return true;
}


function renderZone(zone){
  curZone=zone;
  const zd=DATA[zone];
  const rows=Object.keys(zd).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
  const gs=new Set();
  rows.forEach(r=>Object.keys(zd[r]).forEach(g=>gs.add(g)));
  const groups=[...gs].sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));

  let tB=0,tQ=0,aB=0;
  rows.forEach(r=>groups.forEach(g=>{
    if(zd[r]&&zd[r][g]) Object.entries(zd[r][g]).forEach(([l,q])=>{tB++;tQ+=q;if(q>0)aB++;});
  }));
  statsEl.textContent=zone+'区: '+tB+'个库位 | '+aB+'个有出库 | 30天出库 '+tQ.toLocaleString()+'件';

  let h='<table><thead><tr><th class="row-header">排\\组</th>';
  groups.forEach(g=>{h+='<th>'+g+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><th class="row-header">'+r+'</th>';
    groups.forEach(g=>{
      if(zd[r]&&zd[r][g]){
        const layers=zd[r][g];
        const lkeys=Object.keys(layers).sort((a,b)=>parseInt(a)-parseInt(b));
        h+='<td class="bin-cell">';
        lkeys.forEach(l=>{
          const q=layers[l]||0;
          const fn=zone+'-'+r+'-'+g+'-'+l;
          const lv=heatLevel(q);
          const dim=matchFilter(lv)?'':'dimmed';
          h+='<div class="layer heat-'+lv+' '+dim+'" data-bin="'+fn+'" data-qty="'+q+'" data-lv="'+lv+'"><span class="lname">'+fn+'</span><br><span class="lqty">('+q+')</span></div>';
        });
        h+='</td>';
      } else {h+='<td class="empty-cell"></td>';}
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  wrapEl.innerHTML=h;
  bindLayerEvents();
}

function bindLayerEvents(){
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.onmouseenter=e=>{
      tooltip.style.display='block';
      tooltip.innerHTML='<b>'+el.dataset.bin+'</b><br>30天出库: '+parseInt(el.dataset.qty).toLocaleString()+'件<br><span style="color:#aaa;font-size:10px">点击查看商品</span>';
    };
    el.onmousemove=e=>{tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-40)+'px';};
    el.onmouseleave=()=>{tooltip.style.display='none';};
    el.onclick=()=>{tooltip.style.display='none';showBinDetail(el.dataset.bin,parseInt(el.dataset.qty));};
  });
}


function filterHeat(heat){
  curHeat=heat;
  document.querySelectorAll('.heat-btn').forEach(b=>b.classList.toggle('active',b.dataset.heat===heat));
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.classList.toggle('dimmed',!matchFilter(parseInt(el.dataset.lv)));
  });
}
filterHeat('all');

VZ.forEach(z=>{
  const btn=document.createElement('div');
  btn.className='tab';btn.textContent=z+'区';btn.dataset.zone=z;
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');renderZone(z);
  };
  tabsEl.appendChild(btn);
});
if(VZ.length){tabsEl.querySelector('.tab').classList.add('active');renderZone(VZ[0]);}

function closeModal(){modal.classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

async function loadSkuData(){
  if(skuData) return skuData;
  try{const r=await fetch('bin_sku_detail.json');skuData=await r.json();return skuData;}catch(e){return null;}
}

async function showBinDetail(binName,totalQty){
  modalTitle.textContent=binName+' 库位商品信息';
  modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">加载中...</div>';
  modal.classList.add('show');
  const data=await loadSkuData();
  if(!data||!data[binName]){modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">暂无数据</div>';return;}
  const items=data[binName];
  let h='<table class="dt"><thead><tr><th>商品编号</th><th>商品类目</th><th style="text-align:right">现有库存</th><th style="text-align:right">30天出库</th></tr></thead><tbody>';
  let tS=0;
  items.forEach(it=>{
    tS+=(it.k||0);
    h+='<tr><td>'+it.s+'</td><td>'+(it.n||'-')+'</td><td class="kc">'+(it.k||0).toLocaleString()+'</td><td class="qc">'+it.q.toLocaleString()+'</td></tr>';
  });
  h+='</tbody><tfoot><tr style="font-weight:700;background:#f0f2f5"><td>合计 ('+items.length+'个SKU)</td><td></td><td class="kc">'+tS.toLocaleString()+'</td><td class="qc">'+totalQty.toLocaleString()+'</td></tr></tfoot></table>';
  modalBody.innerHTML=h;
}


async function exportCSV(){
  const data=await loadSkuData();
  if(!data){alert('数据加载失败');return;}
  let csv='\uFEFF库位,商品编号,商品类目,现有库存,30天出库\n';
  // All visible zones
  for(const z of VZ){
    for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
      const fn=z+'-'+r+'-'+g+'-'+l;
      const items=data[fn]||[];
      if(items.length===0){
        csv+=fn+',,,,0\n';
      } else {
        items.forEach(it=>{
          csv+=fn+','+it.s+','+(it.n||'')+','+(it.k||0)+','+it.q+'\n';
        });
      }
    }
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='仓库热力图_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

  modal.classList.add('show');

  // 仓库布局: 主干道在每排货架两端, 中间是货架深处
  // 组号范围配置(基于平面图)
  const zoneConfig={
    'A':{groups:10,minG:1,maxG:10},  // 01~10, 两端靠主干道
    'B':{groups:8,minG:1,maxG:8},
    'C':{groups:14,minG:1,maxG:14},
    'D':{groups:10,minG:1,maxG:10},
    'E':{groups:8,minG:1,maxG:8},
    'F':{groups:8,minG:1,maxG:8},
    'G':{groups:8,minG:1,maxG:8},
    'H':{groups:8,minG:1,maxG:8},
  };

  // 距离主干道的距离 (组号离两端越远=越深)
  function distToAisle(zone,groupNum){
    const cfg=zoneConfig[zone];
    if(!cfg) return 99;
    const mid=(cfg.minG+cfg.maxG)/2;
    return Math.abs(groupNum-mid); // 越小=越深(中间), 越大=越靠两端
  }
  // 反过来: 离主干道越近分数越高
  function aisleScore(zone,groupNum){
    const cfg=zoneConfig[zone];
    if(!cfg) return 0;
    const mid=(cfg.minG+cfg.maxG)/2;
    const halfRange=(cfg.maxG-cfg.minG)/2;
    const distFromMid=Math.abs(groupNum-mid);
    return distFromMid; // 大=靠主干道, 小=在排中间深处
  }

  // 便利度: 靠主干道 + 层2-3 + 区域权重
  const zoneW={'A':10,'B':8,'C':6,'D':7,'E':5,'F':4,'G':3,'H':2};
  function convenience(b){
    const zw=zoneW[b.zone]||1;
    const as=aisleScore(b.zone,b.groupNum)*4; // 主干道距离权重最大
    const ls=b.layer>=2&&b.layer<=3?5:(b.layer===1||b.layer===4)?3:1;
    return zw*2+as+ls*2;
  }

  // 收集库位信息
  const binInfo=[];
  for(const z of VZ){
    for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
      const fn=z+'-'+r+'-'+g+'-'+l;
      const qty=DATA[z][r][g][l];
      const lv=heatLevel(qty);
      const groupNum=parseInt(g)||0;
      binInfo.push({name:fn,zone:z,row:parseInt(r)||0,groupNum:groupNum,group:g,layer:parseInt(l)||0,qty:qty,lv:lv});
    }
  }
  binInfo.forEach(b=>b.conv=convenience(b));

  // 核心逻辑: 同一排内, 高频在中间深处→建议调到两端主干道位置
  const suggestions=[];

  // 按区+排分组
  const byRow={};
  binInfo.forEach(b=>{
    const key=b.zone+'-'+b.row;
    if(!byRow[key]) byRow[key]=[];
    byRow[key].push(b);
  });

  for(const key in byRow){
    const rowBins=byRow[key];
    if(rowBins.length<3) continue;

    const cfg=zoneConfig[rowBins[0].zone];
    if(!cfg) continue;
    const mid=(cfg.minG+cfg.maxG)/2;

    // 找"高频但在排中间"和"低频/空但靠主干道"
    const hotMiddle=rowBins.filter(b=>b.qty>p75 && Math.abs(b.groupNum-mid)<(cfg.maxG-cfg.minG)*0.3);
    const coldEdge=rowBins.filter(b=>b.qty<=p50 && Math.abs(b.groupNum-mid)>=(cfg.maxG-cfg.minG)*0.3);

    hotMiddle.sort((a,b)=>b.qty-a.qty);
    coldEdge.sort((a,b)=>a.qty-b.qty); // 空的优先

    const used=new Set();
    hotMiddle.forEach(hot=>{
      const target=coldEdge.find(c=>!used.has(c.name) && c.layer===hot.layer);
      if(target && hot.qty>target.qty*3){
        used.add(target.name);
        suggestions.push({
          from:hot, to:target,
          reason:'排中间(组'+hot.group+')高频出库，建议调到靠主干道位置(组'+target.group+')'
        });
      }
    });
  }

  // 也找跨排的: 高频在远排, 建议调到近排靠主干道
  const hotFarGlobal=binInfo.filter(b=>b.lv>=5 && b.conv<20).sort((a,b)=>b.qty-a.qty);
  const coldNearGlobal=binInfo.filter(b=>b.qty===0 && b.conv>35).sort((a,b)=>b.conv-a.conv);
  const usedG=new Set(suggestions.map(s=>s.to.name));

  hotFarGlobal.slice(0,10).forEach(hot=>{
    if(suggestions.some(s=>s.from.name===hot.name)) return;
    const target=coldNearGlobal.find(c=>!usedG.has(c.name));
    if(target){
      usedG.add(target.name);
      suggestions.push({
        from:hot, to:target,
        reason:'高频出库('+hot.qty+'件)位于偏远位置(便利度'+hot.conv+')，建议调到更靠主干道的空位(便利度'+target.conv+')'
      });
    }
  });

  suggestions.sort((a,b)=>b.from.qty-a.from.qty);

  // 渲染
  let html='<div style="padding:12px">';
  html+='<div style="margin-bottom:12px;padding:10px;background:#e8f5e9;border-radius:6px;font-size:12px;line-height:1.8">'+
    '<b>📐 分析规则（基于平面图）</b><br>'+
    '• 主干道在每排货架<b>两端</b>（组号最小和最大的位置）<br>'+
    '• 排中间位置（组号居中）是货架深处，拣货需走到最里面<br>'+
    '• 2-3层最方便拿取，1层需弯腰，4层以上需踮脚/梯子<br>'+
    '• <b>高频出库商品应放在靠主干道 + 好拿的层</b></div>';

  if(suggestions.length===0){
    html+='<div style="padding:20px;text-align:center;color:#4caf50;font-size:14px">✅ 当前库位分布合理，无需调整</div>';
  } else {
    html+='<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#333">建议调整 ('+suggestions.length+'项，按出库量排序)</div>';
    suggestions.slice(0,30).forEach((s,i)=>{
      const skus=data[s.from.name]||[];
      const topSku=skus.length?skus[0].s+' ('+(skus[0].n||'未知')+')':'';
      html+='<div class="suggest-card">'+
        '<h4>#'+(i+1)+' <span class="from">'+s.from.name+'</span> → <span class="to">'+s.to.name+'</span></h4>'+
        '<p>'+s.reason+'</p>'+
        '<p style="font-size:11px;color:#888">出库: '+s.from.qty.toLocaleString()+'件 → 目标位出库: '+s.to.qty.toLocaleString()+'件'+(topSku?' | 主要商品: '+topSku:'')+'</p>'+
        '</div>';
    });
  }

  // 统计
  const hotCount=binInfo.filter(b=>b.lv>=5).length;
  const midCount=binInfo.filter(b=>b.lv>=2&&b.lv<=4).length;
  const coldCount=binInfo.filter(b=>b.lv===1).length;
  const zeroCount=binInfo.filter(b=>b.lv===0).length;
  html+='<div style="margin-top:12px;padding:10px;background:#f5f5f5;border-radius:6px;font-size:12px;color:#555">'+
    '<b>库位总览</b>：🔥高频 '+hotCount+' | 中频 '+midCount+' | ❄️低频 '+coldCount+' | ⬜无出库 '+zeroCount+' | 总计 '+binInfo.length+'</div>';
  html+='</div>';
  modalBody.innerHTML=html;
}

</script>

  groups.forEach(g=>{h+='<th>'+g+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><th class="row-header">'+r+'</th>';
    groups.forEach(g=>{
      if(zd[r]&&zd[r][g]){
        const layers=zd[r][g];
        const lkeys=Object.keys(layers).sort((a,b)=>parseInt(a)-parseInt(b));
        h+='<td class="bin-cell">';
        lkeys.forEach(l=>{
          const q=layers[l]||0;
          const fn=zone+'-'+r+'-'+g+'-'+l;
          const lv=heatLevel(q);
          const dim=matchFilter(lv)?'':'dimmed';
          h+='<div class="layer heat-'+lv+' '+dim+'" data-bin="'+fn+'" data-qty="'+q+'" data-lv="'+lv+'"><span class="lname">'+fn+'</span><br><span class="lqty">('+q+')</span></div>';
        });
        h+='</td>';
      } else {h+='<td class="empty-cell"></td>';}
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  wrapEl.innerHTML=h;
  bindLayerEvents();
}

function bindLayerEvents(){
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.onmouseenter=e=>{
      tooltip.style.display='block';
      tooltip.innerHTML='<b>'+el.dataset.bin+'</b><br>30天出库: '+parseInt(el.dataset.qty).toLocaleString()+'件<br><span style="color:#aaa;font-size:10px">点击查看商品</span>';
    };
    el.onmousemove=e=>{tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-40)+'px';};
    el.onmouseleave=()=>{tooltip.style.display='none';};
    el.onclick=()=>{tooltip.style.display='none';showBinDetail(el.dataset.bin,parseInt(el.dataset.qty));};
  });
}


function filterHeat(heat){
  curHeat=heat;
  document.querySelectorAll('.heat-btn').forEach(b=>b.classList.toggle('active',b.dataset.heat===heat));
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.classList.toggle('dimmed',!matchFilter(parseInt(el.dataset.lv)));
  });
}
filterHeat('all');

VZ.forEach(z=>{
  const btn=document.createElement('div');
  btn.className='tab';btn.textContent=z+'区';btn.dataset.zone=z;
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');renderZone(z);
  };
  tabsEl.appendChild(btn);
});
if(VZ.length){tabsEl.querySelector('.tab').classList.add('active');renderZone(VZ[0]);}

function closeModal(){modal.classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

async function loadSkuData(){
  if(skuData) return skuData;
  try{const r=await fetch('bin_sku_detail.json');skuData=await r.json();return skuData;}catch(e){return null;}
}

async function showBinDetail(binName,totalQty){
  modalTitle.textContent=binName+' 库位商品信息';
  modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">加载中...</div>';
  modal.classList.add('show');
  const data=await loadSkuData();
  if(!data||!data[binName]){modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">暂无数据</div>';return;}
  const items=data[binName];
  let h='<table class="dt"><thead><tr><th>商品编号</th><th>商品类目</th><th style="text-align:right">现有库存</th><th style="text-align:right">30天出库</th></tr></thead><tbody>';
  let tS=0;
  items.forEach(it=>{
    tS+=(it.k||0);
    h+='<tr><td>'+it.s+'</td><td>'+(it.n||'-')+'</td><td class="kc">'+(it.k||0).toLocaleString()+'</td><td class="qc">'+it.q.toLocaleString()+'</td></tr>';
  });
  h+='</tbody><tfoot><tr style="font-weight:700;background:#f0f2f5"><td>合计 ('+items.length+'个SKU)</td><td></td><td class="kc">'+tS.toLocaleString()+'</td><td class="qc">'+totalQty.toLocaleString()+'</td></tr></tfoot></table>';
  modalBody.innerHTML=h;
}


async function exportCSV(){
  const data=await loadSkuData();
  if(!data){alert('数据加载失败');return;}
  let csv='\uFEFF库位,商品编号,商品类目,现有库存,30天出库\n';
  // All visible zones
  for(const z of VZ){
    for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
      const fn=z+'-'+r+'-'+g+'-'+l;
      const items=data[fn]||[];
      if(items.length===0){
        csv+=fn+',,,,0\n';
      } else {
        items.forEach(it=>{
          csv+=fn+','+it.s+','+(it.n||'')+','+(it.k||0)+','+it.q+'\n';
        });
      }
    }
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='仓库热力图_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}


async function showSuggestions(){
  modalTitle.textContent='💡 库位调整建议';
  modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">分析中...</div>';
  modal.classList.add('show');
  const data=await loadSkuData();
  if(!data){modalBody.innerHTML='<div style="padding:20px;color:#888">数据加载失败</div>';return;}

  // CONV = {bin_name(无层): {v:便利度, p:距打包台, a:距主干道}}
  // 便利度越高越好, 靠打包台+主干道
  // 层: 2-3层最好拿(黄金层), 1层弯腰, 4+层踮脚

  function layerBonus(l){ return (l>=2&&l<=3)?6:(l===1||l===4)?3:0; }

  // 库位完整名 zone-row-group -> 去查CONV
  function binBase(zone,row,group){
    // 匹配CONV里的key格式
    const padR=String(row).padStart(2,'0');
    const padG=String(group).padStart(2,'0');
    const keys=[zone+'-'+padR+'-'+padG, zone+'-'+row+'-'+group, zone+'-'+padR+'-'+group, zone+'-'+row+'-'+padG];
    for(const k of keys){ if(CONV[k]) return CONV[k]; }
    return null;
  }

  const binInfo=[];
  for(const z of VZ){
    for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
      const fn=z+'-'+r+'-'+g+'-'+l;
      const qty=DATA[z][r][g][l];
      const lv=heatLevel(qty);
      const ci=binBase(z,r,g);
      const baseConv=ci?ci.v:30;
      const distPack=ci?ci.p:40;
      const distAisle=ci?ci.a:3;
      const conv=baseConv+layerBonus(parseInt(l)||1);
      binInfo.push({name:fn,zone:z,row:r,group:g,layer:parseInt(l)||1,qty:qty,lv:lv,conv:conv,distPack:distPack,distAisle:distAisle});
    }
  }

  // 按便利度排序
  binInfo.sort((a,b)=>b.conv-a.conv);

  // 高频出库但便利度低 → 应该搬到便利的位置
  // 低频/无出库但便利度高 → 浪费好位置
  const convMedian=binInfo[Math.floor(binInfo.length/2)].conv;

  const hotBadPos=binInfo.filter(b=>b.qty>p90 && b.conv<convMedian).sort((a,b)=>b.qty-a.qty);
  const coldGoodPos=binInfo.filter(b=>b.qty<=p50 && b.conv>convMedian).sort((a,b)=>b.conv-a.conv);

  // 配对: 优先同层交换
  const suggestions=[];
  const usedFrom=new Set();
  const usedTo=new Set();

  hotBadPos.forEach(hot=>{
    if(usedFrom.has(hot.name)) return;
    // 找同层的好位置空位
    let target=coldGoodPos.find(c=>!usedTo.has(c.name) && c.layer===hot.layer && c.qty===0);
    // 没同层空位就找同层低频
    if(!target) target=coldGoodPos.find(c=>!usedTo.has(c.name) && c.layer===hot.layer && c.qty<hot.qty/5);
    // 还没有就放宽层限制
    if(!target) target=coldGoodPos.find(c=>!usedTo.has(c.name) && c.qty===0);
    if(target && target.conv>hot.conv+5){
      usedFrom.add(hot.name);
      usedTo.add(target.name);
      const reason=[];
      if(hot.distPack>30) reason.push('远离打包台(距'+hot.distPack+'格)');
      if(hot.distAisle>3) reason.push('不靠主干道(距'+hot.distAisle+'列)');
      if(hot.layer>=5) reason.push('高层位不方便拿取');
      const benefit=[];
      if(target.distPack<20) benefit.push('靠近打包台(距'+target.distPack+'格)');
      if(target.distAisle<=2) benefit.push('紧邻主干道');
      if(target.layer>=2&&target.layer<=3) benefit.push('黄金层位('+target.layer+'层)');
      suggestions.push({from:hot,to:target,reason:reason.join('，')||'位置偏远',benefit:benefit.join('，')||'位置更优'});
    }
  });

  suggestions.sort((a,b)=>b.from.qty-a.from.qty);

  // 渲染
  let html='<div style="padding:12px">';
  html+='<div style="margin-bottom:12px;padding:12px;background:#e8f5e9;border-radius:8px;font-size:12px;line-height:1.8">'+
    '<b>📐 分析规则（基于仓库平面图实测）</b><br>'+
    '• <b>打包台</b>在仓库中间位置，越靠近打包台拣货路径越短（权重最高）<br>'+
    '• <b>主干道</b>（黄色通道）在各区之间，靠主干道的库位更方便进出<br>'+
    '• <b>2-3层</b>是黄金层位，拿取最方便；1层弯腰、4层以上踮脚<br>'+
    '• 四周靠墙/窗户，不是主干道，属于偏远位置</div>';

  if(suggestions.length===0){
    html+='<div style="padding:20px;text-align:center;color:#4caf50;font-size:14px">✅ 当前库位分布合理，无需调整</div>';
  } else {
    html+='<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#333">建议调整 ('+suggestions.length+'项，按出库量排序)</div>';
    suggestions.slice(0,30).forEach((s,i)=>{
      const skus=data[s.from.name]||[];
      const topSku=skus.length?skus[0].n||skus[0].s:'';
      html+='<div class="suggest-card">'+
        '<h4>#'+(i+1)+' <span class="from">'+s.from.name+'</span> → <span class="to">'+s.to.name+'</span></h4>'+
        '<p>📦 30天出库 <b>'+s.from.qty.toLocaleString()+'件</b>'+(topSku?' ('+topSku+')':'')+'</p>'+
        '<p style="color:#e53935">❌ 当前: '+s.reason+' (便利度'+s.from.conv+')</p>'+
        '<p style="color:#43a047">✅ 建议: '+s.benefit+' (便利度'+s.to.conv+')</p>'+
        '</div>';
    });
  }

  // 总览
  const hotCount=binInfo.filter(b=>b.lv>=5).length;
  const midCount=binInfo.filter(b=>b.lv>=2&&b.lv<=4).length;
  const coldCount=binInfo.filter(b=>b.lv===1).length;
  const zeroCount=binInfo.filter(b=>b.lv===0).length;
  const misplaced=hotBadPos.length;
  html+='<div style="margin-top:12px;padding:10px;background:#f5f5f5;border-radius:6px;font-size:12px;color:#555">'+
    '<b>库位总览</b>：🔥高频 '+hotCount+' | 中频 '+midCount+' | ❄️低频 '+coldCount+' | ⬜无出库 '+zeroCount+' | 总计 '+binInfo.length+
    '<br>⚠️ 高频出库但位置偏远的库位: <b style="color:#e53935">'+misplaced+'</b>个</div>';
  html+='</div>';
  modalBody.innerHTML=html;
}

</script>
