<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库库位热力图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#333}
.header{padding:12px 16px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:16px;font-weight:700;color:#333}
.header .info{font-size:12px;color:#888}
.toolbar{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap;align-items:center}
.toolbar .section-label{font-size:11px;color:#999;margin-right:2px}
.toolbar .divider{width:1px;height:24px;background:#d0d0d0;margin:0 8px}
.tab{padding:6px 14px;border-radius:4px;border:1px solid #d0d0d0;background:#fff;color:#666;font-size:12px;font-weight:600;cursor:pointer}
.tab:hover{background:#e8f0fe;border-color:#4285f4}
.tab.active{background:#4285f4;color:#fff;border-color:#4285f4}
.heat-btn{padding:5px 12px;border-radius:4px;border:1px solid #d0d0d0;background:#fff;color:#666;font-size:11px;cursor:pointer}
.heat-btn:hover{border-color:#ff9800}
.heat-btn.active{border-color:#ff9800;background:#fff3e0;color:#e65100;font-weight:600}
.export-btn{padding:5px 12px;border-radius:4px;border:1px solid #4caf50;background:#4caf50;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.export-btn:hover{background:#388e3c}
.suggest-btn{padding:5px 12px;border-radius:4px;border:1px solid #9c27b0;background:#9c27b0;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.suggest-btn:hover{background:#7b1fa2}
.period-btn{padding:5px 12px;border-radius:4px;border:1px solid #1976d2;background:#fff;color:#1976d2;font-size:11px;cursor:pointer;font-weight:600}
.period-btn:hover{background:#e3f2fd}
.period-btn.active{background:#1976d2;color:#fff}
.style-btn{padding:5px 12px;border-radius:4px;border:1px solid #ff6f00;background:#ff6f00;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.style-btn:hover{background:#e65100}
.cooccur-btn{padding:5px 12px;border-radius:4px;border:1px solid #00695c;background:#00695c;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.cooccur-btn:hover{background:#004d40}
.legend{display:flex;gap:10px;padding:6px 16px;background:#fff;border-bottom:1px solid #e0e0e0;font-size:10px;color:#666;align-items:center}
.legend-item{display:flex;align-items:center;gap:3px}
.legend-box{width:12px;height:12px;border-radius:2px;border:1px solid #ccc}
.container{padding:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:11px}
th{background:#f0f2f5;padding:6px 4px;border:1px solid #d0d0d0;font-weight:700;text-align:center;position:sticky;top:0;z-index:2}
th.row-header{position:sticky;left:0;z-index:3;background:#f0f2f5;min-width:40px}
td{border:1px solid #d0d0d0;padding:0;vertical-align:top}
.bin-cell{min-width:90px}
.layer{padding:3px 6px;border-bottom:1px solid #e8e8e8;text-align:center;font-size:10px;cursor:pointer;transition:all 0.15s}
.layer:last-child{border-bottom:none}
.layer:hover{filter:brightness(0.85)}
.layer .lname{font-weight:600;color:#333}
.layer .lqty{color:#666;font-size:9px}
/* 颜色等级 */
.heat-0{background:#fff}
.heat-1{background:#e3f2fd}.heat-1 .lname{color:#333}
.heat-2{background:#bbdefb}.heat-2 .lname{color:#333}
.heat-3{background:#90caf9}.heat-3 .lname{color:#333}
.heat-4{background:#64b5f6;color:#fff}.heat-4 .lname,.heat-4 .lqty{color:#fff}
.heat-5{background:#ff9800;color:#fff}.heat-5 .lname,.heat-5 .lqty{color:#fff}
.heat-6{background:#f44336;color:#fff}.heat-6 .lname,.heat-6 .lqty{color:#fff}
.zone-stats{font-size:12px;color:#4285f4;padding:6px 16px}
.empty-cell{background:#fafafa}
.tooltip{display:none;position:fixed;background:#333;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;z-index:100;pointer-events:none;max-width:260px}
.layer.dimmed{opacity:0.12}
.layer.hl-row{outline:2px solid #1565c0;outline-offset:-1px;z-index:2}
.hl-active{background:#1565c0!important;color:#fff!important;font-weight:700}
/* 弹窗 */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:200;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,0.2);max-width:700px;width:92%;max-height:80vh;overflow:auto}
.modal-header{padding:12px 16px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:14px;color:#333}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999;padding:0 4px}
.modal-close:hover{color:#333}
.modal-body{padding:0}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{background:#f0f2f5;padding:8px 10px;text-align:left;border-bottom:1px solid #d0d0d0;font-weight:600;position:sticky;top:0}
.dt td{padding:6px 10px;border-bottom:1px solid #eee}
.dt tr:hover td{background:#f5f8ff}
.dt .qc{text-align:right;font-weight:600;color:#4285f4}
.dt .kc{text-align:right;color:#666}
/* 建议弹窗 */
.suggest-card{margin:8px 12px;padding:12px;border:1px solid #e0e0e0;border-radius:8px;background:#fafafa}
.suggest-card h4{font-size:13px;margin-bottom:6px;color:#333}
.suggest-card .from{color:#f44336;font-weight:600}
.suggest-card .to{color:#4caf50;font-weight:600}
.suggest-card p{font-size:12px;color:#555;line-height:1.6;margin:4px 0}
</style>
</head>
<body>
<div class="header">
  <h1>🏭 仓库库位热力图</h1>
  <span class="info" id="info">30天出库数据</span>
</div>
<div class="toolbar" id="toolbar">
  <span class="section-label">时间</span>
  <div class="period-btn active" data-period="30d" onclick="switchPeriod('30d')">30天</div>
  <div class="period-btn" data-period="7d" onclick="switchPeriod('7d')">7天</div>
  <div class="period-btn" data-period="15d" onclick="switchPeriod('15d')">15天</div>
  <div class="period-btn" data-period="60d" onclick="switchPeriod('60d')">60天</div>
  <div class="divider"></div>
  <span class="section-label">区域</span>
  <div id="tabs" style="display:contents"></div>
  <div class="divider"></div>
  <span class="section-label">筛选</span>
  <div class="heat-btn" data-heat="all" onclick="filterHeat('all')">全部</div>
  <div class="heat-btn" data-heat="hot" onclick="filterHeat('hot')">🔥高频</div>
  <div class="heat-btn" data-heat="mid" onclick="filterHeat('mid')">中频</div>
  <div class="heat-btn" data-heat="cold" onclick="filterHeat('cold')">❄️低频</div>
  <div class="heat-btn" data-heat="zero" onclick="filterHeat('zero')">⬜无出库</div>
  <div class="divider"></div>
  <div class="export-btn" onclick="exportCSV()">📥 导出CSV</div>
  <div class="suggest-btn" onclick="showSuggestions()">💡 款级调整</div>
  <div class="style-btn" onclick="showStyleAnalysis()">📊 动销分析</div>
  <div class="cooccur-btn" onclick="showCooccur()">🔗 关联购买</div>
</div>
<div class="legend">
  <div class="legend-item"><div class="legend-box" style="background:#fff"></div>无出库</div>
  <div class="legend-item"><div class="legend-box" style="background:#e3f2fd"></div>低频</div>
  <div class="legend-item"><div class="legend-box" style="background:#90caf9"></div>中频</div>
  <div class="legend-item"><div class="legend-box" style="background:#64b5f6"></div>较高</div>
  <div class="legend-item"><div class="legend-box" style="background:#ff9800"></div>高频</div>
  <div class="legend-item"><div class="legend-box" style="background:#f44336"></div>超高频</div>
</div>
<div class="zone-stats" id="zoneStats"></div>
<div class="container"><div id="tableWrap"></div></div>
<div class="tooltip" id="tooltip"></div>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">库位商品信息</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

const HIDE = new Set(['BF','M','W','Z']);
let curPeriod = '30d';
let DATA = ALL_DATA[curPeriod];
const tabsEl = document.getElementById('tabs');
const statsEl = document.getElementById('zoneStats');
const wrapEl = document.getElementById('tableWrap');
const tooltip = document.getElementById('tooltip');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const infoEl = document.getElementById('info');

function getVZ(){ return Object.keys(DATA).filter(z=>!HIDE.has(z)).sort(); }
let VZ = getVZ();
let curZone = null;
let curHeat = 'all';
let p50,p75,p90,p95;

function getAllQty(){
  const a=[];
  for(const z of VZ) for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
    const q=DATA[z][r][g][l]; if(q>0) a.push(q);
  }
  return a.sort((a,b)=>a-b);
}
function calcPercentiles(){
  const allQ=getAllQty();
  p50=allQ[Math.floor(allQ.length*0.5)]||1;
  p75=allQ[Math.floor(allQ.length*0.75)]||1;
  p90=allQ[Math.floor(allQ.length*0.90)]||1;
  p95=allQ[Math.floor(allQ.length*0.95)]||1;
}
calcPercentiles();

function heatLevel(qty){
  if(!qty||qty===0) return 0;
  if(qty<=p50) return 1;
  if(qty<=p75) return 2;
  if(qty<=p90) return 3;
  if(qty<=p95) return 4;
  if(qty<=p95*2) return 5;
  return 6;
}

function matchFilter(level){
  if(curHeat==='all') return true;
  if(curHeat==='hot') return level>=5;
  if(curHeat==='mid') return level>=2 && level<=4;
  if(curHeat==='cold') return level===1;
  if(curHeat==='zero') return level===0;
  return true;
}


function renderZone(zone){
  curZone=zone;
  const zd=DATA[zone];
  const rows=Object.keys(zd).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
  const gs=new Set();
  // 找该区最大层数(至少3层)
  let maxLayer=3;
  rows.forEach(r=>Object.keys(zd[r]).forEach(g=>{
    gs.add(g);
    Object.keys(zd[r][g]).forEach(l=>{const ln=parseInt(l)||0;if(ln>maxLayer)maxLayer=ln;});
  }));
  const groups=[...gs].sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));

  let tB=0,tQ=0,aB=0;
  rows.forEach(r=>groups.forEach(g=>{
    for(let l=1;l<=maxLayer;l++){
      tB++;
      const q=(zd[r]&&zd[r][g]&&zd[r][g][String(l)])||0;
      tQ+=q;if(q>0)aB++;
    }
  }));
  statsEl.textContent=zone+'区: '+tB+'个库位 | '+aB+'个有出库 | '+curPeriod+'出库 '+tQ.toLocaleString()+'件';

  let h='<table><thead><tr><th class="row-header" style="cursor:pointer" title="点击高亮整排">排\\组</th>';
  groups.forEach(g=>{h+='<th style="cursor:pointer" data-hl-group="'+g+'" title="点击高亮整组">'+g+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><th class="row-header" style="cursor:pointer" data-hl-row="'+r+'" title="点击高亮整排">'+r+'</th>';
    groups.forEach(g=>{
      h+='<td class="bin-cell" data-row="'+r+'" data-group="'+g+'">';
      for(let l=1;l<=maxLayer;l++){
        const q=(zd[r]&&zd[r][g]&&zd[r][g][String(l)])||0;
        const fn=zone+'-'+r+'-'+g+'-'+l;
        const lv=heatLevel(q);
        const dim=matchFilter(lv)?'':'dimmed';
        h+='<div class="layer heat-'+lv+' '+dim+'" data-bin="'+fn+'" data-qty="'+q+'" data-lv="'+lv+'" data-row="'+r+'" data-group="'+g+'"><span class="lname">'+fn+'</span><br><span class="lqty">('+q+')</span></div>';
      }
      h+='</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  wrapEl.innerHTML=h;
  bindLayerEvents();
  bindHighlight();
}

function bindLayerEvents(){
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.onmouseenter=e=>{
      tooltip.style.display='block';
      tooltip.innerHTML='<b>'+el.dataset.bin+'</b><br>'+curPeriod+'出库: '+parseInt(el.dataset.qty).toLocaleString()+'件<br><span style="color:#aaa;font-size:10px">点击查看商品</span>';
    };
    el.onmousemove=e=>{tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-40)+'px';};
    el.onmouseleave=()=>{tooltip.style.display='none';};
    el.onclick=()=>{tooltip.style.display='none';showBinDetail(el.dataset.bin,parseInt(el.dataset.qty));};
  });
}

let hlRow=null,hlGroup=null;
function bindHighlight(){
  // 点击排号 → 高亮整排
  wrapEl.querySelectorAll('[data-hl-row]').forEach(th=>{
    th.onclick=()=>{
      const r=th.dataset.hlRow;
      if(hlRow===r){hlRow=null;}else{hlRow=r;hlGroup=null;}
      applyHighlight();
    };
  });
  // 点击组号 → 高亮整组
  wrapEl.querySelectorAll('[data-hl-group]').forEach(th=>{
    th.onclick=()=>{
      const g=th.dataset.hlGroup;
      if(hlGroup===g){hlGroup=null;}else{hlGroup=g;hlRow=null;}
      applyHighlight();
    };
  });
}

function applyHighlight(){
  // 清除所有高亮
  wrapEl.querySelectorAll('.hl-row').forEach(el=>el.classList.remove('hl-row'));
  wrapEl.querySelectorAll('[data-hl-row]').forEach(th=>th.classList.remove('hl-active'));
  wrapEl.querySelectorAll('[data-hl-group]').forEach(th=>th.classList.remove('hl-active'));
  if(hlRow){
    wrapEl.querySelectorAll('[data-hl-row="'+hlRow+'"]').forEach(th=>th.classList.add('hl-active'));
    wrapEl.querySelectorAll('.layer[data-row="'+hlRow+'"]').forEach(el=>el.classList.add('hl-row'));
  }
  if(hlGroup){
    wrapEl.querySelectorAll('[data-hl-group="'+hlGroup+'"]').forEach(th=>th.classList.add('hl-active'));
    wrapEl.querySelectorAll('.layer[data-group="'+hlGroup+'"]').forEach(el=>el.classList.add('hl-row'));
  }
}


function filterHeat(heat){
  curHeat=heat;
  document.querySelectorAll('.heat-btn').forEach(b=>b.classList.toggle('active',b.dataset.heat===heat));
  wrapEl.querySelectorAll('.layer').forEach(el=>{
    el.classList.toggle('dimmed',!matchFilter(parseInt(el.dataset.lv)));
  });
}
filterHeat('all');

VZ.forEach(z=>{
  const btn=document.createElement('div');
  btn.className='tab';btn.textContent=z+'区';btn.dataset.zone=z;
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');renderZone(z);
  };
  tabsEl.appendChild(btn);
});
if(VZ.length){tabsEl.querySelector('.tab').classList.add('active');renderZone(VZ[0]);}

const periodLabels={'7d':'7天','15d':'15天','30d':'30天','60d':'60天'};
function switchPeriod(p){
  curPeriod=p;
  DATA=ALL_DATA[p];
  VZ=getVZ();
  calcPercentiles();
  infoEl.textContent=periodLabels[p]+'出库数据';
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b.dataset.period===p));
  // 重建tabs
  tabsEl.innerHTML='';
  VZ.forEach(z=>{
    const btn=document.createElement('div');
    btn.className='tab';btn.textContent=z+'区';btn.dataset.zone=z;
    btn.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');renderZone(z);
    };
    tabsEl.appendChild(btn);
  });
  if(VZ.length){tabsEl.querySelector('.tab').classList.add('active');renderZone(curZone&&VZ.includes(curZone)?curZone:VZ[0]);}
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function loadSkuData(){
  return SKU_DETAIL || {};
}

function showBinDetail(binName,totalQty){
  modalTitle.textContent=binName+' 库位商品信息';
  modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">加载中...</div>';
  modal.classList.add('show');
  const data=loadSkuData();
  if(!data||!data[binName]){modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">暂无数据</div>';return;}
  const items=data[binName];
  let h='<table class="dt"><thead><tr><th>商品编号</th><th>商品类目</th><th style="text-align:right">现有库存</th><th style="text-align:right">30天出库</th></tr></thead><tbody>';
  let tS=0;
  items.forEach(it=>{
    tS+=(it.k||0);
    h+='<tr><td>'+it.s+'</td><td>'+(it.n||'-')+'</td><td class="kc">'+(it.k||0).toLocaleString()+'</td><td class="qc">'+it.q.toLocaleString()+'</td></tr>';
  });
  h+='</tbody><tfoot><tr style="font-weight:700;background:#f0f2f5"><td>合计 ('+items.length+'个SKU)</td><td></td><td class="kc">'+tS.toLocaleString()+'</td><td class="qc">'+totalQty.toLocaleString()+'</td></tr></tfoot></table>';
  modalBody.innerHTML=h;
}


function exportCSV(){
  const data=loadSkuData();
  if(!data){alert('数据加载失败');return;}
  let csv='\uFEFF库位,商品编号,商品类目,现有库存,30天出库\n';
  // All visible zones
  for(const z of VZ){
    for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]){
      const fn=z+'-'+r+'-'+g+'-'+l;
      const items=data[fn]||[];
      if(items.length===0){
        csv+=fn+',,,,0\n';
      } else {
        items.forEach(it=>{
          csv+=fn+','+it.s+','+(it.n||'')+','+(it.k||0)+','+it.q+'\n';
        });
      }
    }
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='仓库热力图_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}


function showSuggestions(){
  modalTitle.textContent='💡 款级库位调整建议';
  modalBody.innerHTML='<div style="padding:20px;text-align:center;color:#888">分析中...</div>';
  modal.classList.add('show');

  function layerBonus(l){ return (l>=2&&l<=3)?6:(l===1||l===4)?3:0; }

  // 计算每个库位组(区-排-组)的便利度
  const D30=ALL_DATA['30d'];
  const VZ30=Object.keys(D30).filter(z=>!HIDE.has(z)).sort();
  const zoneMaxRow={};
  for(const z of VZ30){
    let mx=0;
    for(const r in D30[z]){ const n=parseInt(r)||0; if(n>mx)mx=n; }
    zoneMaxRow[z]=mx;
  }

  function binGroupConv(binGroup){
    const p=binGroup.split('-');
    if(p.length<3) return 0;
    const z=p[0], rn=parseInt(p[1])||0, gn=parseInt(p[2])||0;
    return ((zoneMaxRow[z]||20)-rn)*4 + gn*3;
  }

  // 款级分析: 用STYLES数据
  const styleList=Object.entries(STYLES).map(([id,s])=>({id,...s}));

  // 高频款在远处(便利度低) = 需要调整
  // 低频/滞销款在好位置 = 浪费
  const suggestions=[];
  const hotStyles=styleList.filter(s=>s['30d']>100).sort((a,b)=>b['30d']-a['30d']);
  const coldStyles=styleList.filter(s=>s['30d']<20 && s.inv>50 && s.days>60).sort((a,b)=>a['30d']-b['30d']);

  // 为每个款计算平均便利度
  hotStyles.forEach(s=>{
    const avgConv=s.bins.reduce((sum,b)=>sum+binGroupConv(b),0)/(s.bins.length||1);
    s.avgConv=Math.round(avgConv);
  });
  coldStyles.forEach(s=>{
    const avgConv=s.bins.reduce((sum,b)=>sum+binGroupConv(b),0)/(s.bins.length||1);
    s.avgConv=Math.round(avgConv);
  });

  // 高频在差位置 vs 低频在好位置 → 互换
  const hotBad=hotStyles.filter(s=>s.avgConv<45).sort((a,b)=>b['30d']-a['30d']);
  const coldGood=coldStyles.filter(s=>s.avgConv>50).sort((a,b)=>b.avgConv-a.avgConv);

  const used=new Set();
  hotBad.forEach(hot=>{
    const target=coldGood.find(c=>!used.has(c.id) && c.bin_count>=1);
    if(target){
      used.add(target.id);
      suggestions.push({hot, cold:target});
    }
  });

  // 渲染
  let html='<div style="padding:12px">';
  html+='<div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">'+
    '<span style="font-size:13px;font-weight:700;color:#333">款级调整建议 ('+suggestions.length+'组)</span>'+
    '<button onclick="exportStyleSuggestions()" style="padding:6px 14px;border-radius:4px;border:1px solid #4caf50;background:#4caf50;color:#fff;font-size:12px;cursor:pointer;font-weight:600">📥 导出建议</button>'+
    '</div>';

  html+='<div style="margin-bottom:10px;padding:10px;background:#e8f5e9;border-radius:6px;font-size:11px;line-height:1.6;color:#555">'+
    '规则: 整款调整(非单SKU) | 高频款应在靠打包台+主干道位置 | 滞销款可挪到远处<br>'+
    '便利度=排号小×4(靠打包台)+组号大×3(靠主干道) | Z字型拣货，同款集中同一过道</div>';

  if(suggestions.length===0){
    html+='<div style="padding:20px;text-align:center;color:#4caf50">✅ 高频款位置均合理</div>';
  } else {
    html+='<div style="overflow-x:auto"><table class="dt" id="suggestTable"><thead><tr>'+
      '<th>#</th><th>高频款号</th><th>品名</th><th>7天</th><th>15天</th><th>30天</th><th>60天</th><th>当前库位</th><th>便利度</th>'+
      '<th>↔</th>'+
      '<th>滞销款号</th><th>库存</th><th>可销天数</th><th>30天出库</th><th>当前库位</th><th>便利度</th>'+
      '</tr></thead><tbody>';
    suggestions.forEach((s,i)=>{
      html+='<tr>'+
        '<td>'+(i+1)+'</td>'+
        '<td style="font-weight:600;color:#f44336">'+s.hot.id+'</td>'+
        '<td>'+s.hot.name+'</td>'+
        '<td class="qc">'+s.hot['7d']+'</td>'+
        '<td class="qc">'+s.hot['15d']+'</td>'+
        '<td class="qc" style="font-weight:700">'+s.hot['30d']+'</td>'+
        '<td class="qc">'+s.hot['60d']+'</td>'+
        '<td style="font-size:10px;color:#f44336">'+s.hot.bins.join(', ')+'</td>'+
        '<td class="qc" style="color:#f44336">'+s.hot.avgConv+'</td>'+
        '<td style="font-size:16px;text-align:center">🔄</td>'+
        '<td style="font-weight:600;color:#4caf50">'+s.cold.id+'</td>'+

    });
    html+='</tbody></table></div>';

function showStyleAnalysis(){
  modalTitle.textContent='📊 动销分析';
  modal.classList.add('show');

  const list=Object.entries(STYLES).map(([id,s])=>({id,...s}));
  const withInv=list.filter(s=>s.inv>0);
  const urgent=withInv.filter(s=>s.days<7).sort((a,b)=>a.days-b.days);
  const slow=withInv.filter(s=>s.days>90&&s.inv>50).sort((a,b)=>b.inv-a.inv);
  const healthy=withInv.filter(s=>s.days>=7&&s.days<=90);

  let html='<div style="padding:12px">';

  // 总览
  const totalInv=withInv.reduce((s,v)=>s+v.inv,0);
  const urgentInv=urgent.reduce((s,v)=>s+v.inv,0);
  const slowInv=slow.reduce((s,v)=>s+v.inv,0);
  html+='<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">'+
    '<div style="flex:1;min-width:120px;padding:12px;background:#e3f2fd;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:#1976d2">'+withInv.length+'</div><div style="font-size:11px;color:#666">有库存款数</div></div>'+
    '<div style="flex:1;min-width:120px;padding:12px;background:#ffebee;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:#e53935">'+urgent.length+'</div><div style="font-size:11px;color:#666">补货紧急(&lt;7天)</div></div>'+
    '<div style="flex:1;min-width:120px;padding:12px;background:#fff3e0;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:#e65100">'+slow.length+'</div><div style="font-size:11px;color:#666">滞销品(&gt;90天)</div></div>'+
    '<div style="flex:1;min-width:120px;padding:12px;background:#e8f5e9;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:700;color:#2e7d32">'+healthy.length+'</div><div style="font-size:11px;color:#666">健康(7-90天)</div></div>'+
    '</div>';

  // 补货紧急表
  html+='<h4 style="color:#e53935;margin:12px 0 6px">🚨 补货紧急 (可销&lt;7天)</h4>';
  if(urgent.length){
    html+='<div style="overflow-x:auto;margin-bottom:16px"><table class="dt"><thead><tr><th>款号</th><th>品名</th><th>库存</th><th>日均出库</th><th>可销天数</th><th>7天</th><th>15天</th><th>30天</th><th>库位</th></tr></thead><tbody>';
    urgent.slice(0,30).forEach(s=>{
      html+='<tr><td>'+s.id+'</td><td>'+s.name+'</td><td class="qc" style="color:#e53935">'+s.inv+'</td><td class="qc">'+s.daily+'</td><td class="qc" style="color:#e53935;font-weight:700">'+s.days+'</td><td class="qc">'+s['7d']+'</td><td class="qc">'+s['15d']+'</td><td class="qc">'+s['30d']+'</td><td style="font-size:10px">'+s.bins.join(', ')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  } else { html+='<div style="padding:10px;color:#4caf50">✅ 无紧急补货款</div>'; }

  // 滞销品表
  html+='<h4 style="color:#e65100;margin:12px 0 6px">📦 滞销品 (可销&gt;90天, 库存&gt;50)</h4>';

    slow.slice(0,30).forEach(s=>{
      html+='<tr><td>'+s.id+'</td><td>'+s.name+'</td><td class="qc" style="color:#e65100">'+s.inv+'</td><td class="qc">'+s.daily+'</td><td class="kc">'+s.days+'</td><td class="qc">'+s['30d']+'</td><td class="qc">'+s.bin_count+'</td><td style="font-size:10px">'+s.bins.join(', ')+'</td></tr>';

function exportStyleCSV(){

}


function showCooccur(){
  modalTitle.textContent='🔗 关联购买分析';
  modal.classList.add('show');

  // 按关联次数排序的款号对
  const pairs=[];
  for(const [style, related] of Object.entries(COOCCUR)){
    const si=STYLES[style];
    if(!si) continue;
    for(const r of related){
      const ri=STYLES[r.id];
      if(!ri) continue;
      // 避免重复(只保留字母序小的在前)
      if(style<r.id){
        // 计算库位距离
        const aBins=si.bins||[];
        const bBins=ri.bins||[];
        const sameZone=aBins.some(a=>bBins.some(b=>a.split("-")[0]===b.split("-")[0]));
        const sameRow=aBins.some(a=>bBins.some(b=>{const pa=a.split("-"),pb=b.split("-");return pa[0]===pb[0]&&pa[1]===pb[1];}));
        pairs.push({a:style,b:r.id,cnt:r.c,ai:si,bi:ri,sameZone,sameRow});
      }
    }
  }
  pairs.sort((a,b)=>b.cnt-a.cnt);

  let html='<div style="padding:12px">';
  html+='<div style="margin-bottom:10px;padding:10px;background:#e0f2f1;border-radius:6px;font-size:11px;line-height:1.6;color:#555">'+
    '分析30天内同一订单出库的款号对。经常一起购买的款应放在相邻库位，减少拣货路径。<br>'+
    '🟢 同排=已在一起 | 🟡 同区=距离较近 | 🔴 不同区=需要优化</div>';

  const needOpt=pairs.filter(p=>!p.sameRow && p.cnt>=10);
  html+='<div style="margin-bottom:8px;font-size:13px"><b>需优化</b>: <span style="color:#e53935;font-weight:700">'+needOpt.length+'</span> 对高关联款不在相邻位置</div>';

  html+='<div style="overflow-x:auto"><table class="dt" id="cooccurTable"><thead><tr>'+
    '<th>#</th><th>款号A</th><th>品名</th><th>库位</th><th>款号B</th><th>品名</th><th>库位</th><th>共现次数</th><th>位置关系</th>'+
    '</tr></thead><tbody>';
  pairs.slice(0,50).forEach((p,i)=>{
    const status=p.sameRow?'🟢同排':p.sameZone?'🟡同区':'🔴不同区';
    const rowStyle=!p.sameRow&&p.cnt>=10?'background:#fff3e0':'';
    html+='<tr style="'+rowStyle+'">'+
      '<td>'+(i+1)+'</td>'+
      '<td style="font-weight:600">'+p.a+'</td>'+
      '<td>'+p.ai.name+'</td>'+
      '<td style="font-size:10px">'+p.ai.bins.join(', ')+'</td>'+
      '<td style="font-weight:600">'+p.b+'</td>'+
      '<td>'+p.bi.name+'</td>'+
      '<td style="font-size:10px">'+p.bi.bins.join(', ')+'</td>'+
      '<td class="qc" style="font-weight:700">'+p.cnt+'</td>'+
      '<td>'+status+'</td>'+
      '</tr>';
  });
  html+='</tbody></table></div>';
  html+='<div style="margin-top:10px;text-align:right"><button onclick="exportCooccur()" style="padding:6px 14px;border-radius:4px;border:1px solid #4caf50;background:#4caf50;color:#fff;font-size:12px;cursor:pointer;font-weight:600">📥 导出</button></div>';
  html+='</div>';
  modalBody.innerHTML=html;
}
