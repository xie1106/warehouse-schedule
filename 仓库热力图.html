<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3">
<title>仓库库位热力图 - 30天出库频次</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.header{padding:16px 20px;background:#16213e;border-bottom:1px solid #0f3460;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;font-weight:600}
.header .stats{font-size:13px;color:#aaa}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:#aaa}
.legend .bar{width:120px;height:12px;border-radius:6px;background:linear-gradient(90deg,#1a472a,#2d6a4f,#ffc300,#e85d04,#d00000)}
.container{padding:10px;overflow:auto}
.grid{display:grid;gap:1px;width:fit-content;margin:0 auto}
.cell{width:42px;height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:600;cursor:pointer;position:relative;transition:transform 0.15s;color:#fff;text-shadow:0 0 2px rgba(0,0,0,0.8)}
.cell:hover{transform:scale(1.8);z-index:10;box-shadow:0 0 8px rgba(255,255,255,0.3)}
.cell.empty{background:transparent;cursor:default}
.cell.empty:hover{transform:none;box-shadow:none}
.cell.arrow{background:transparent;color:#555;font-size:10px;cursor:default}
.cell.arrow:hover{transform:none}
.cell.wall{background:#333;cursor:default}
.cell.wall:hover{transform:none}
.tooltip{display:none;position:fixed;background:#16213e;border:1px solid #0f3460;padding:8px 12px;border-radius:8px;font-size:13px;z-index:100;pointer-events:none;white-space:nowrap}
.tooltip .bin-name{font-weight:700;font-size:15px;margin-bottom:4px}
.tooltip .qty{color:#ffc300}
.zone-label{font-size:11px;color:#0f3460;font-weight:700;text-align:center;padding:2px;background:rgba(15,52,96,0.3);border-radius:3px}
.filters{padding:10px 20px;background:#16213e;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .label{font-size:12px;color:#aaa;margin-right:4px}
.zone-btn{padding:6px 14px;border-radius:16px;border:1px solid #0f3460;background:transparent;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
.zone-btn:hover{border-color:#ffc300;color:#ffc300}
.zone-btn.active{background:#0f3460;color:#fff;border-color:#ffc300}
.zone-stats{font-size:12px;color:#ffc300;margin-left:8px}
.cell.dimmed{opacity:0.08}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🏭 仓库库位热力图</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="legend">
    <span>低频</span>
    <div class="bar"></div>
    <span>高频</span>
  </div>
</div>
<div class="filters" id="filters">
  <span class="label">区域</span>
</div>
<div class="container">
  <div id="grid"></div>
</div>
<div class="tooltip" id="tooltip"></div>

y"},{"type":"empty"},{"type":"empty"},{"type":"empty"},{"type":"empty"},{"type":"empty"},{"type":"empty"},{"type":"empty"},{"type":"empty"},{"type":"empty"}]];
const rows = grid.length;
const cols = grid[0].length;

// Find max qty for color scaling
let maxQty = 0;
grid.forEach(row => row.forEach(c => { if(c.type==='bin' && c.qty > maxQty) maxQty = c.qty; }));
// Use percentile-based scaling (ignore top outliers)
const allQty = [];
grid.forEach(row => row.forEach(c => { if(c.type==='bin' && c.qty > 0) allQty.push(c.qty); }));
allQty.sort((a,b) => a-b);
const p95 = allQty[Math.floor(allQty.length * 0.95)] || maxQty;

function getColor(qty) {
  if(qty === 0) return '#1a1a2e';
  const ratio = Math.min(qty / p95, 1);
  if(ratio < 0.25) return `rgb(${Math.round(26+ratio*4*60)}, ${Math.round(71+ratio*4*60)}, ${Math.round(42-ratio*4*10)})`;
  if(ratio < 0.5) { const r2=(ratio-0.25)*4; return `rgb(${Math.round(86+r2*169)}, ${Math.round(131+r2*64)}, ${Math.round(32-r2*32)})`; }
  if(ratio < 0.75) { const r3=(ratio-0.5)*4; return `rgb(${255}, ${Math.round(195-r3*102)}, ${Math.round(0+r3*4)})`; }
  const r4=(ratio-0.75)*4; return `rgb(${Math.round(255-r4*47)}, ${Math.round(93-r4*93)}, ${Math.round(4-r4*4)})`;
}

const el = document.getElementById('grid');
el.style.gridTemplateColumns = `repeat(${cols}, 42px)`;
el.style.display = 'grid';

const tooltip = document.getElementById('tooltip');
let totalBins = 0, totalQty = 0, activeBins = 0;

grid.forEach((row, ri) => {
  row.forEach((c, ci) => {
    const div = document.createElement('div');
    div.className = 'cell';
    if(c.type === 'empty') {
      div.classList.add('empty');
    } else if(c.type === 'wall') {
      div.classList.add('wall');
    } else if(c.type === 'arrow') {
      div.classList.add('arrow');
      div.textContent = c.dir;
    } else if(c.type === 'bin') {
      totalBins++;
      const qty = c.qty || 0;
      totalQty += qty;
      if(qty > 0) activeBins++;
      div.style.background = getColor(qty);
      div.textContent = c.name.split('-').slice(1).join('-');
      if(qty > 0) div.style.border = '1px solid rgba(255,255,255,0.15)';
      else div.style.border = '1px solid rgba(255,255,255,0.05)';
      div.addEventListener('mouseenter', (e) => {
        tooltip.style.display = 'block';
        tooltip.innerHTML = `<div class="bin-name">${c.name}</div><div class="qty">30天出库: ${qty.toLocaleString()}件</div>`;
      });
      div.addEventListener('mousemove', (e) => {
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY - 40) + 'px';
      });
      div.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
      // touch
      div.addEventListener('touchstart', (e) => {
        e.preventDefault();
        tooltip.style.display = 'block';
        tooltip.innerHTML = `<div class="bin-name">${c.name}</div><div class="qty">30天出库: ${qty.toLocaleString()}件</div>`;
        const t = e.touches[0];
        tooltip.style.left = (t.clientX + 12) + 'px';
        tooltip.style.top = (t.clientY - 50) + 'px';
        setTimeout(() => tooltip.style.display = 'none', 2000);
      });
    }
    el.appendChild(div);
  });
});

document.getElementById('stats').textContent = `${totalBins}个库位 | ${activeBins}个有出库 | 30天总出库 ${totalQty.toLocaleString()}件 | P95=${p95}件`;

// Zone filter
const zones = new Set();
grid.forEach(row => row.forEach(c => {
  if(c.type==='bin' && c.name) zones.add(c.name.split('-')[0]);
}));
const sortedZones = [...zones].sort();
const filtersEl = document.getElementById('filters');
const zoneStatsEl = document.createElement('span');
zoneStatsEl.className = 'zone-stats';
filtersEl.appendChild(zoneStatsEl);

// "全部" button
const allBtn = document.createElement('button');
allBtn.className = 'zone-btn active';
allBtn.textContent = '全部';
allBtn.onclick = () => filterZone(null);
filtersEl.insertBefore(allBtn, zoneStatsEl);

sortedZones.forEach(z => {
  const btn = document.createElement('button');
  btn.className = 'zone-btn';
  btn.dataset.zone = z;
  // Count bins and qty for this zone
  let zBins=0, zQty=0;
  grid.forEach(row => row.forEach(c => {
    if(c.type==='bin' && c.name && c.name.split('-')[0]===z) { zBins++; zQty+=c.qty||0; }
  }));
  btn.textContent = `${z}区`;
  btn.title = `${zBins}个库位, ${zQty.toLocaleString()}件`;
  btn.onclick = () => filterZone(z);
  filtersEl.insertBefore(btn, zoneStatsEl);
});

let activeZone = null;
function filterZone(zone) {
  activeZone = zone;
  document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('active'));
  if(!zone) {
    allBtn.classList.add('active');
    zoneStatsEl.textContent = '';
  } else {
    document.querySelector(`.zone-btn[data-zone="${zone}"]`).classList.add('active');
    let zBins=0, zQty=0, zActive=0;
    grid.forEach(row => row.forEach(c => {
      if(c.type==='bin' && c.name && c.name.split('-')[0]===zone) {
        zBins++; zQty+=c.qty||0; if(c.qty>0) zActive++;
      }
    }));
    zoneStatsEl.textContent = `${zBins}个库位 | ${zActive}个有出库 | ${zQty.toLocaleString()}件`;
  }
  // Update cells
  const cells = el.querySelectorAll('.cell');
  let idx = 0;
  grid.forEach((row, ri) => {
    row.forEach((c, ci) => {
      const cell = cells[idx++];
      if(c.type === 'bin') {
        const cZone = c.name.split('-')[0];
        if(!zone || cZone === zone) {
          cell.classList.remove('dimmed');
        } else {
          cell.classList.add('dimmed');
        }
      }
    });
  });
}
