const ZONES = Object.keys(DATA).sort();
const tabsEl = document.getElementById('tabs');
const statsEl = document.getElementById('zoneStats');
const wrapEl = document.getElementById('tableWrap');
const tooltip = document.getElementById('tooltip');

// Percentiles for color
function getAllQty() {
  const a=[];
  for(const z in DATA) for(const r in DATA[z]) for(const g in DATA[z][r]) for(const l in DATA[z][r][g]) {
    const q=DATA[z][r][g][l]; if(q>0) a.push(q);
  }
  return a.sort((a,b)=>a-b);
}
const allQ = getAllQty();
const p50 = allQ[Math.floor(allQ.length*0.5)]||1;
const p75 = allQ[Math.floor(allQ.length*0.75)]||1;
const p90 = allQ[Math.floor(allQ.length*0.90)]||1;
const p95 = allQ[Math.floor(allQ.length*0.95)]||1;

function heatClass(qty) {
  if(!qty || qty===0) return 'heat-0';
  if(qty <= p50) return 'heat-1';
  if(qty <= p75) return 'heat-2';
  if(qty <= p90) return 'heat-3';
  if(qty <= p95) return 'heat-4';
  if(qty <= p95*2) return 'heat-5';
  return 'heat-6';
}

function padNum(n) { return String(n).padStart(2,'0'); }

function renderZone(zone) {
  const zd = DATA[zone];
  // Get all rows and groups
  const rows = Object.keys(zd).sort((a,b) => {
    const na=parseInt(a), nb=parseInt(b);
    return (isNaN(na)?0:na) - (isNaN(nb)?0:nb);
  });
  const groupSet = new Set();
  let maxLayers = 0;
  rows.forEach(r => {
    Object.keys(zd[r]).forEach(g => {
      groupSet.add(g);
      const layers = Object.keys(zd[r][g]).length;
      if(layers > maxLayers) maxLayers = layers;
    });
  });
  const groups = [...groupSet].sort((a,b) => {
    const na=parseInt(a), nb=parseInt(b);
    return (isNaN(na)?0:na) - (isNaN(nb)?0:nb);
  });

  // Stats
  let totalBins=0, totalQty=0, activeBins=0;
  rows.forEach(r => groups.forEach(g => {
    if(zd[r] && zd[r][g]) {
      Object.entries(zd[r][g]).forEach(([l,q]) => {
        totalBins++; totalQty+=q; if(q>0) activeBins++;
      });
    }
  }));
  statsEl.textContent = `${zone}区: ${totalBins}个库位 | ${activeBins}个有出库 | 30天出库 ${totalQty.toLocaleString()}件`;

  // Build table
  let html = '<table><thead><tr><th class="row-header">排\\组</th>';
  groups.forEach(g => { html += `<th>${g}</th>`; });
  html += '</tr></thead><tbody>';

  rows.forEach(r => {
    html += `<tr><th class="row-header">${r}</th>`;
    groups.forEach(g => {
      if(zd[r] && zd[r][g]) {
        const layers = zd[r][g];
        const lkeys = Object.keys(layers).sort((a,b) => parseInt(a)-parseInt(b));
        html += '<td class="bin-cell">';
        lkeys.forEach(l => {
          const q = layers[l] || 0;
          const fullName = `${zone}-${r}-${g}-${l}`;
          html += `<div class="layer ${heatClass(q)}" data-bin="${fullName}" data-qty="${q}"><span class="name">${fullName}</span><br><span class="qty">(${q})</span></div>`;
        });
        html += '</td>';
      } else {
        html += '<td class="empty-cell"></td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrapEl.innerHTML = html;

  // Tooltip
  wrapEl.querySelectorAll('.layer').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tooltip.style.display='block';
      tooltip.innerHTML=`<b>${el.dataset.bin}</b><br>30天出库: ${parseInt(el.dataset.qty).toLocaleString()}件`;
    });
    el.addEventListener('mousemove', e => {
      tooltip.style.left=(e.clientX+12)+'px';
      tooltip.style.top=(e.clientY-40)+'px';
    });
    el.addEventListener('mouseleave', () => { tooltip.style.display='none'; });
  });
}

// Create tabs
ZONES.forEach(z => {
  const btn = document.createElement('div');
  btn.className = 'tab';
  btn.textContent = z + '区';
  btn.dataset.zone = z;
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderZone(z);
  };
  tabsEl.appendChild(btn);
});

// Default: show A
if(ZONES.length) {
  tabsEl.querySelector('.tab').classList.add('active');
  renderZone(ZONES[0]);
}
</script>
