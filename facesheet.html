function code128Bars(text){
  var codes=[104];
  for(var i=0;i<text.length;i++) codes.push(text.charCodeAt(i)-32);
  var sum=104, w=1;
  for(var i=1;i<codes.length;i++){ sum += codes[i]*w; w++; }
  codes.push(sum%103); codes.push(106);
  var bars=[];
  for(var k=0;k<codes.length;k++) bars=bars.concat(C128B[codes[k]]);
  return bars;
}

  for(var i=0;i<bars.length;i++){ var u=bars[i]*unit; if(i%2===0) ctx.fillRect(x,0,u,H); x+=u; } }
function drawV(canvas,text){ var bars=code128Bars(text); var ctx=canvas.getContext("2d"); var W=canvas.width,H=canvas.height;
