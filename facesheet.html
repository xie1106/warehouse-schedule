<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>电子面单（聚水潭标准）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#e8e8e8; font-family:"SimHei","黑体",Arial,sans-serif; color:#000; }
  .toolbar { position:fixed; top:0; left:0; right:0; z-index:99; background:#fff; padding:8px 16px; border-bottom:1px solid #ccc; display:flex; gap:12px; align-items:center; }
  .toolbar button { padding:6px 16px; font-size:14px; cursor:pointer; }
  .stage { padding:20px; margin-top:52px; display:flex; justify-content:center; }
  @page { size:75.14mm 129.12mm; margin:0; }
  @media print {
    html,body { margin:0; padding:0; background:#fff; width:75.14mm; height:129.12mm; overflow:hidden; }
    .toolbar { display:none !important; }
    .stage { margin:0!important; padding:0!important; width:75.14mm; height:129.12mm; overflow:hidden; }
  }
  .wb { position:relative; width:75.14mm; height:129.12mm; background:#fff; border:0.3mm solid #000; overflow:hidden; font-family:"SimHei","黑体",Arial,sans-serif; }
  .abs { position:absolute; }
  .vtext { writing-mode:vertical-rl; text-orientation:mixed; }
  /* Horizontal rules */
  .hr { position:absolute; left:0; right:0; height:0.3mm; background:#000; }
  /* Vertical rule for barcode column */
  .vr { position:absolute; width:0.3mm; background:#000; }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨 打印面单</button>
  <button onclick="copyData()">📋 复制数据</button>
  <span style="color:#888">运单号: <span id="mn"></span></span>
</div>
<div class="stage">
<div class="wb">
  <!-- 区1: 头部信息 top 0-8mm -->
  <div class="hr" style="top:8mm;"></div>
  <div class="abs" id="el_mailno" style="left:1.5mm; top:1mm; font-size:7.5pt; font-family:Arial;">YT7641039253717</div>
  <div class="abs" style="right:1.5mm; top:1mm; font-size:7pt; text-align:right;">
    <span id="el_date"></span>&nbsp;<span id="el_time"></span>&nbsp;&nbsp;<span id="el_page">第1/1个</span>
  </div>

  <!-- 区2: 三段码 8-20mm -->
  <div class="hr" style="top:20mm;"></div>
  <div class="abs" id="el_code3" style="left:4mm; top:9mm; font-size:22pt; font-weight:bold; font-family:Arial,SimHei;">626-C21-00 103</div>
  <div class="abs" id="el_code3b" style="left:4mm; top:17mm; font-size:8pt;"></div>

  <!-- 区3: 横向条码 20-36mm -->
  <div class="hr" style="top:36mm;"></div>
  <canvas id="barcodeH" class="abs" style="left:5mm; top:21mm; width:52mm; height:10mm;"></canvas>
  <div class="abs" id="el_big" style="left:5mm; top:31.5mm; font-size:8pt; font-family:Arial; width:52mm; text-align:center;">YT7641039253717</div>
  <!-- 竖向条码（右侧列 58mm起） -->
  <div class="vr" style="left:58mm; top:20mm; height:65mm;"></div>
  <canvas id="barcodeV" class="abs" style="left:60mm; top:21mm; width:7mm; height:50mm;"></canvas>
  <div class="abs vtext" id="sideMailV" style="left:68mm; top:22mm; font-size:7pt; font-family:Arial;">YT7641039253717</div>

  <!-- 区4: 大头笔/目的地 36-44mm -->
  <div class="hr" style="top:44mm; left:0; width:58mm;"></div>
  <div class="abs" style="left:4mm; top:36.5mm; width:7mm; height:6.5mm; border:0.3mm solid #000; display:flex; align-items:center; justify-content:center; font-size:14pt; font-weight:bold;" id="el_dest_box">」</div>
  <div class="abs" id="el_dest" style="left:13mm; top:36.5mm; font-size:16pt; font-weight:bold;"></div>
  <div class="abs" id="el_dest2" style="left:48mm; top:37mm; font-size:12pt; font-weight:bold;">省</div>

  <!-- 区5: 收件人信息 44-74mm (最大区域 ~30mm = 23%) -->
  <div class="hr" style="top:74mm; left:0; width:58mm;"></div>
  <div class="abs" style="left:4mm; top:44.5mm; font-size:11pt; color:#e00;">❤<span style="color:#000;font-weight:bold;">收</span></div>
  <div class="abs" id="el_rname" style="left:14mm; top:44.5mm; font-size:12pt; font-weight:bold;"></div>
  <div class="abs" id="el_rphone" style="left:32mm; top:44.5mm; font-size:11pt;"></div>
  <div class="abs" id="el_raddr" style="left:4mm; top:50mm; font-size:11pt; font-weight:bold; width:52mm; white-space:normal; word-break:break-all; line-height:1.4; max-height:22mm; overflow:hidden;"></div>

  <!-- 区6: 寄件人信息 74-86mm -->
  <div class="hr" style="top:86mm;"></div>
  <div class="abs" style="left:4mm; top:74.5mm; font-size:8pt; color:#e00;">❤<span style="color:#000;font-weight:bold;">寄</span></div>
  <div class="abs" id="el_sname" style="left:14mm; top:74.5mm; font-size:8pt;"></div>
  <div class="abs" id="el_sphone" style="left:22mm; top:74.5mm; font-size:8pt;"></div>
  <div class="abs" id="el_saddr2" style="left:4mm; top:78.5mm; font-size:8pt; width:52mm; white-space:normal; word-break:break-all; line-height:1.3; max-height:7mm; overflow:hidden;"></div>
  <!-- hidden compat elements -->
  <div class="abs" id="el_saddr1" style="display:none;"></div>
  <div class="abs" id="el_saddr3" style="display:none;"></div>

  <!-- 区7: 商品信息 86-103mm -->
  <div class="hr" style="top:103mm;"></div>
  <div class="abs" id="el_pono" style="left:1.5mm; top:86.5mm; font-size:8pt; font-weight:bold;"></div>
  <div id="el_items" class="abs" style="left:1.5mm; top:91mm; width:70mm;"></div>
  <div class="abs" id="el_code" style="display:none;"></div>

  <!-- 区8: 底部统计 103-129mm -->
  <div class="abs" id="el_total" style="right:18mm; top:104mm; font-size:9pt; font-weight:bold;">合计</div>
  <div class="abs" id="el_totaln" style="right:10mm; top:104mm; font-size:9pt; font-weight:bold;"></div>
  <div class="abs" id="el_checked" style="right:2mm; top:107mm; font-size:8pt;">已验视</div>

  <!-- 左侧竖向运单号 -->
  <div class="abs vtext" id="sideL1" style="left:0.5mm; top:10mm; font-size:7pt; font-family:Arial; letter-spacing:0.2mm;">YT7641039253717</div>
  <div class="abs vtext" id="sideL2" style="left:0.5mm; top:55mm; font-size:7pt; font-family:Arial; letter-spacing:0.2mm;">YT7641039253717</div>
  <!-- 右侧竖向运单号 -->
  <div class="abs vtext" id="sideR1" style="right:0.5mm; top:10mm; font-size:7pt; font-family:Arial; letter-spacing:0.2mm;">YT7641039253717</div>
  <div class="abs vtext" id="sideR2" style="right:0.5mm; top:55mm; font-size:7pt; font-family:Arial; letter-spacing:0.2mm;">YT7641039253717</div>

</div>
</div>
<script>
const C128B={0:[2,1,2,2,2,2],1:[2,2,2,1,2,2],2:[2,2,2,2,2,1],3:[1,2,1,2,2,3],4:[1,2,1,3,2,2],5:[1,3,1,2,2,2],6:[1,2,2,2,1,2],7:[1,2,2,1,3,2],8:[1,1,2,2,3,2],9:[1,2,2,2,3,1],10:[1,1,2,3,2,2],11:[1,2,1,1,3,3],12:[1,2,1,3,3,1],13:[1,1,1,2,3,3],14:[1,3,1,1,2,3],15:[1,2,2,1,1,3],16:[1,1,2,2,1,3],17:[1,3,2,1,2,2],18:[1,1,3,2,1,2],19:[1,2,3,1,1,2],20:[2,2,3,2,1,1],21:[2,2,1,1,3,2],22:[2,2,1,2,3,1],23:[2,1,2,2,1,3],24:[2,1,2,2,3,1],25:[2,1,1,2,2,3],26:[2,2,1,2,1,3],27:[2,2,1,1,2,3],28:[2,1,3,1,2,2],29:[2,2,3,1,1,2],30:[1,3,2,1,3,1],31:[1,3,2,3,1,1],32:[1,1,2,3,2,1],33:[1,3,1,1,3,2],34:[1,1,3,1,2,3],35:[1,3,1,2,3,1],36:[1,1,2,2,3,2],37:[1,3,2,2,1,2],38:[1,1,3,2,2,2],39:[2,1,3,2,1,2],40:[2,2,1,3,1,2],41:[2,1,1,3,2,2],42:[2,1,2,1,1,3],43:[2,1,2,3,1,1],44:[2,3,1,1,2,2],45:[2,3,1,2,1,2],46:[2,3,2,1,1,2],47:[1,3,1,2,2,2],48:[1,3,2,1,2,2],49:[1,1,2,1,3,2],50:[1,1,2,3,2,2],51:[1,2,1,2,1,3],52:[1,2,1,3,1,2],53:[1,2,2,2,2,1],54:[1,1,3,2,2,2],55:[1,2,3,1,2,2],56:[2,3,1,2,1,2],57:[2,2,1,2,1,3],58:[2,2,1,3,1,2],59:[2,1,2,1,2,3],60:[2,1,2,3,2,1],61:[2,3,2,1,2,1],62:[1,1,2,1,2,3],63:[1,1,2,3,1,2],64:[1,2,1,2,3,1],65:[1,2,1,3,2,1],66:[1,1,3,2,1,2],67:[1,2,3,1,1,2],68:[1,3,1,2,1,2],69:[1,3,1,3,1,1],70:[2,1,2,2,1,2],71:[2,1,2,2,2,1],72:[2,1,1,2,2,2],73:[2,2,2,1,2,1],74:[2,2,1,2,2,1],75:[2,2,2,2,1,1],76:[2,1,2,1,3,1],77:[2,1,2,3,1,1],78:[2,1,1,3,1,2],79:[2,1,1,3,2,1],80:[2,2,1,1,1,3],81:[2,2,1,1,3,1],82:[2,1,3,1,1,3],83:[2,1,3,2,1,1],84:[2,2,3,1,2,1],85:[2,2,1,3,2,1],86:[2,2,2,2,1,1],87:[1,2,1,1,2,3],88:[1,2,1,2,1,3],89:[1,2,1,3,1,2],90:[1,3,1,1,2,2],91:[1,3,1,2,2,1],92:[1,3,2,1,2,1],93:[1,1,3,1,3,1],94:[1,1,3,2,1,3],95:[1,1,3,3,1,1],96:[2,2,1,1,3,1],97:[1,3,2,2,2,2],98:[1,3,2,2,1,3],99:[1,3,1,3,1,2],100:[1,1,1,3,2,3],101:[1,3,1,1,3,3],102:[1,3,2,1,1,3],103:[2,2,1,2,2,3],104:[2,2,1,2,2,3],105:[2,2,2,1,1,3],106:[2,2,2,1,3,1]};
function code128Bars(text){
  var codes=[104];
  for(var i=0;i<text.length;i++) codes.push(text.charCodeAt(i)-32);
  var sum=104,w=1;
  for(var i=1;i<codes.length;i++){sum+=codes[i]*w;w++;}
  codes.push(sum%103);codes.push(106);
  var bars=[];
  for(var k=0;k<codes.length;k++) bars=bars.concat(C128B[codes[k]]);
  return bars;
}
function drawH(canvas,text){var bars=code128Bars(text);var ctx=canvas.getContext("2d");var W=canvas.width,H=canvas.height;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);var unit=W/bars.length;ctx.fillStyle="#000";var x=0;for(var i=0;i<bars.length;i++){var u=bars[i]*unit;if(i%2===0)ctx.fillRect(x,0,u,H);x+=u;}}
function drawV(canvas,text){var bars=code128Bars(text);var ctx=canvas.getContext("2d");var W=canvas.width,H=canvas.height;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);var unit=H/bars.length;ctx.fillStyle="#000";var y=0;for(var i=0;i<bars.length;i++){var u=bars[i]*unit;if(i%2===0)ctx.fillRect(0,y,W,u);y+=u;}}
function setupCanvas(id,wmm,hmm){var c=document.getElementById(id);c.width=Math.round(wmm*96/25.4*3);c.height=Math.round(hmm*96/25.4*3);}

// 脱敏函数
function maskName(name){if(!name||name.length<=1)return name||'*';return name[0]+'*'.repeat(name.length-1);}
function maskPhone(phone){if(!phone||phone.length<=4)return phone||'';return '*'.repeat(phone.length-4)+phone.slice(-4);}
function maskAddress(addr){if(!addr)return '';var m=addr.match(/(.*?省)?(.*?市)?(.*?区|.*?县)?/);var visible=(m?(m[1]||'')+(m[2]||'')+(m[3]||''):'').replace(/\s/g,'');return visible+'******';}

var mailNo="YT7641039253717";
function setText(id,t){var el=document.getElementById(id);if(el)el.textContent=(t==null?'':t);}

function fitText(el,minPt){
  if(!el)return;
  var pt=parseFloat(getComputedStyle(el).fontSize)/1.3333||10.5;
  el.style.fontSize=pt+'pt';
  while(pt>minPt&&el.scrollWidth>el.clientWidth+2){pt-=0.5;el.style.fontSize=pt+'pt';}
  var h0=el.clientHeight;
  while(pt>minPt&&el.scrollHeight>h0+2){pt-=0.5;el.style.fontSize=pt+'pt';}
}
function fitAll(){
  ['el_raddr','el_saddr2'].forEach(function(id){fitText(document.getElementById(id),5);});
}

function renderItems(rows){
  var box=document.getElementById("el_items");if(!box)return;
  var html="";
  (rows||[]).forEach(function(r,i){
    var y=i*2.7;
    html+='<div style="position:absolute;left:0;top:'+y+'mm;font-size:7.5pt;">'+
      '<span>'+(r.style||'')+'</span> '+
      '<span style="margin-left:2mm;">'+(r.color||'')+'</span> '+
      '<span style="margin-left:2mm;">'+(r.size||'')+'</span> '+
      '<span style="margin-left:2mm;">'+(r.qty!=null?'*'+r.qty+'件':'')+'</span></div>';
  });
  box.innerHTML=html;
}

var _lastData=null;
function _trackData(d){if(d)_lastData=d;}

function loadData(d){
  if(!d)return;
  _trackData(d);
  mailNo=d.mailNo||mailNo;
  setText("el_mailno",mailNo);setText("mn",mailNo);
  setText("el_date",d.date||"");setText("el_time",d.time||"");setText("el_page",d.page||"第1/1个");
  setText("el_code3",d.seg||"");setText("el_code3b",d.seg2||"");
  setText("el_big",mailNo);
  setText("el_dest",d.landmark||"");setText("el_dest2",d.dest2||"省");
  if(d.receiver){
    setText("el_rname",d.receiver.name||"");
    setText("el_rphone",d.receiver.phone||"");
    var fullRAddr=(d.receiver.address||(d.receiver.addressLines||[]).filter(Boolean).join("")||"").replace(/\s+/g,"");
    setText("el_raddr",fullRAddr);
  }
  if(d.sender){
    var sRaw=d.sender.name||"";
    var sPhoneM=sRaw.match(/(\d{11})$/);
    var sName2=sPhoneM?sRaw.slice(0,-11).trim():sRaw;
    var sPhone2=sPhoneM?sPhoneM[1]:(d.sender.phone||"");
    setText("el_sname",maskName(sName2));
    setText("el_sphone",maskPhone(sPhone2));
    var maskedAddr=maskAddress(d.sender.address||"");
    setText("el_saddr2",maskedAddr);
    setText("el_saddr1","");setText("el_saddr3","");
  }
  setText("el_pono",d.poId?"采购单号："+d.poId:"");
  setText("el_code",d.item1||"");
  setText("el_total","合计");
  setText("el_totaln",d.totalQty!=null?d.totalQty:"");
  setText("el_checked","已验视");
  setupCanvas("barcodeH",52,10);drawH(document.getElementById("barcodeH"),mailNo);
  setupCanvas("barcodeV",7,50);drawV(document.getElementById("barcodeV"),mailNo);
  setTimeout(fitAll,30);
  setText("sideL1",mailNo);setText("sideL2",mailNo);setText("sideR1",mailNo);setText("sideR2",mailNo);setText("sideMailV",mailNo);
  renderItems(d.rows||[{style:d.pattern||'',color:'',size:'',qty:d.totalQty!=null?d.totalQty:''}]);
}

// Init
document.getElementById("mn").textContent=mailNo;
setupCanvas("barcodeH",52,10);drawH(document.getElementById("barcodeH"),mailNo);
setupCanvas("barcodeV",7,50);drawV(document.getElementById("barcodeV"),mailNo);

try{var raw=localStorage.getItem("facesheet_data");if(raw){loadData(JSON.parse(raw));}}catch(e){}
try{var qp=new URLSearchParams(location.search).get("d");if(qp){loadData(JSON.parse(decodeURIComponent(escape(atob(qp.replace(/-/g,"+").replace(/_/g,"/"))))));}}catch(e){}

async function copyData(){
  try{
    var src=_lastData?JSON.stringify(_lastData):localStorage.getItem("facesheet_data");
    if(!src)src="{}";
    await navigator.clipboard.writeText(src);
    alert("数据已复制");
  }catch(e){alert("复制失败: "+e.message);}
}
window.loadFacesheetData=loadData;
</script>
</body>
</html>
