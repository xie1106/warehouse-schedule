<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, minimum-scale=0.5">
    <title>仓库排班管理系统</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --secondary-light: #f472b6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px 40px;
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--text);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 36px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .nav-link::after {
            content: '→';
            position: absolute;
            right: 24px;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.2s ease;
        }
        .nav-link:hover::after {
            opacity: 1;
            transform: translateX(0);
        }
        .nav-link:nth-child(1) {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }
        .nav-link:nth-child(2) {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
        }
        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.25);
        }
        .nav-link:nth-child(2):hover {
            box-shadow: 0 8px 24px rgba(236, 72, 153, 0.25);
        }
        .nav-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .nav-text {
            text-align: left;
        }
        .nav-text span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 2px;
        }
        .footer {
            margin-top: 32px;
            color: var(--text-light);
            font-size: 12px;
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 16px;
            color: var(--text-light);
        }
        .loading-overlay.hidden { display: none; }
        @media (max-width: 480px) {
            .container { padding: 32px 24px; }
            .nav-link { padding: 16px 20px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">加载中...</div>
    <div class="container">
        <div class="logo">📋</div>
        <h1>仓库排班管理系统</h1>
        <p class="subtitle">员工指定休收集 & 智能排班生成</p>
        <div class="nav-links">
            <a href="员工指定休管理.html" class="nav-link">
                <div class="nav-icon">📅</div>
                <div class="nav-text">
                    指定休收集
                    <span>员工提交每月指定休日期</span>
                </div>
            </a>
            <a href="javascript:void(0)" class="nav-link" id="scheduleLink" onclick="goToSchedule()">
                <div class="nav-icon">⚙️</div>
                <div class="nav-text">
                    一键生成排班表
                    <span>智能排班、手动调整、导出Excel（仅管理员）</span>
                </div>
            </a>
        </div>
        <p class="footer">捷展贸易 · 仓库管理</p>
    </div>

    <script>
    // === Supabase Config ===
    const SUPABASE_URL = 'https://elyfxyrdbuykyklfjfdr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseWZ4eXJkYnV5a3lrbGZqZmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIwMjQsImV4cCI6MjA5NjU3ODAyNH0.irrMM8iKJVGnOBW6VQ4BHlkwiVIDtB97EPiHvasOWyg';

    async function supaFetch(table, options = {}) {
        const { method = 'GET', query = '', body = null, headers = {} } = options;
        const url = `${SUPABASE_URL}/rest/v1/${table}${query}`;
        const opts = {
            method,
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : (method === 'DELETE' ? 'return=minimal' : ''),
                ...headers
            }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(url, opts);
        if (method === 'GET') return res.json();
        return res;
    }

    // === State ===
    let adminList = ['谢焕君'];

    async function init() {
        try {
            const data = await supaFetch('settings', { query: '?key=eq.admin_list&select=value' });
            if (data.length > 0) adminList = data[0].value;
        } catch (e) {
            console.error('Failed to load admin list:', e);
        }
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function goToSchedule() {
        const savedEmployee = localStorage.getItem('last_selected_employee');
        if (!savedEmployee) {
            alert('请先在"指定休收集"页面选择你是谁');
            window.location.href = '员工指定休管理.html';
            return;
        }
        if (adminList.includes(savedEmployee)) {
            window.location.href = '排班表生成.html';
        } else {
            alert('⚠️ ' + savedEmployee + ' 不是管理员，无法进入排班表生成功能');
        }
    }

    init();
    </script>
</body>
</html>
