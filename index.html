<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, minimum-scale=0.5">
    <title>仓库排班管理系统</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --secondary-light: #f472b6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px 40px;
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--text);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 36px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .nav-link::after {
            content: '→';
            position: absolute;
            right: 24px;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.2s ease;
        }
        .nav-link:hover::after {
            opacity: 1;
            transform: translateX(0);
        }
        .nav-link:nth-child(1) {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }
        .nav-link:nth-child(2) {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
        }
        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.25);
        }
        .nav-link:nth-child(2):hover {
            box-shadow: 0 8px 24px rgba(236, 72, 153, 0.25);
        }
        .nav-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .nav-text {
            text-align: left;
        }
        .nav-text span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 2px;
        }
        .footer {
            margin-top: 32px;
            color: var(--text-light);
            font-size: 12px;
        }
        @media (max-width: 480px) {
            .container { padding: 32px 24px; }
            .nav-link { padding: 16px 20px; }
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 12px;
            padding: 28px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal h3 { font-size: 18px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📋</div>
        <h1>仓库排班管理系统</h1>
        <p class="subtitle">员工指定休收集 & 智能排班生成</p>
        <div class="nav-links">
            <a href="员工指定休管理.html" class="nav-link">
                <div class="nav-icon">📅</div>
                <div class="nav-text">
                    指定休收集
                    <span>员工提交每月指定休日期</span>
                </div>
            </a>
            <a href="javascript:void(0)" class="nav-link" id="scheduleLink" onclick="checkAdminAccess()">
                <div class="nav-icon">⚙️</div>
                <div class="nav-text">
                    一键生成排班表
                    <span>智能排班、手动调整、导出Excel（仅管理员）</span>
                </div>
            </a>
        </div>
        <p class="footer">捷展贸易 · 仓库管理</p>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <h3>🔐 管理员验证</h3>
            <p style="margin-bottom:16px;color:var(--text-light);font-size:14px;">排班表生成功能仅管理员可用，请选择你的身份：</p>
            <select id="adminSelect" style="width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:16px;">
                <option value="">-- 请选择 --</option>
            </select>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="nav-link" onclick="closeAdminModal()" style="background:#e2e8f0;color:var(--text);padding:10px 20px;font-size:13px;display:inline-block;width:auto;">取消</button>
                <button class="nav-link" onclick="confirmAdmin()" style="background:linear-gradient(135deg,var(--primary),var(--primary-light));padding:10px 20px;font-size:13px;display:inline-block;width:auto;">确认进入</button>
            </div>
        </div>
    </div>

    <script>
    function getAdminList() {
        const saved = localStorage.getItem('admin_list');
        return saved ? JSON.parse(saved) : ['谢焕君'];
    }

    function getEmployeeList() {
        const saved = localStorage.getItem('employee_list');
        if (saved) return JSON.parse(saved);
        return [
            { name: '谢焕君', group: '经理' }, { name: '陈文童', group: '主管' },
            { name: '付新远', group: '主管' }, { name: '林创武', group: '到货' },
            { name: '李亚景', group: '到货' }, { name: '迟喻阳', group: '到货' },
            { name: '蒋能', group: '到货' }, { name: '林镇兴', group: '主管' },
            { name: '林佗贵', group: '发货' }, { name: '吴兴义', group: '发货' },
            { name: '吴兴浪', group: '发货' }, { name: '刘少东', group: '发货' },
            { name: '李仁', group: '发货' }, { name: '陈安然', group: '发货' },
            { name: '黄丽情', group: '发货' }, { name: '崔斯欣', group: '发货' }
        ];
    }

    function checkAdminAccess() {
        const admins = getAdminList();
        const savedOperator = localStorage.getItem('current_operator');

        // 如果已有记忆的操作人
        if (savedOperator) {
            if (admins.includes(savedOperator)) {
                // 已知是管理员，直接跳转
                window.location.href = '排班表生成.html';
            } else {
                // 已知不是管理员，直接提示
                alert('⚠️ 你不是管理员，无法进入排班表生成功能');
            }
            return;
        }

        // 还没选过，弹窗选择
        const employees = getEmployeeList();
        const select = document.getElementById('adminSelect');
        select.innerHTML = '<option value="">-- 请选择 --</option>';
        employees.forEach(emp => {
            const isAdmin = admins.includes(emp.name);
            select.innerHTML += `<option value="${emp.name}">${isAdmin ? '⭐ ' : ''}${emp.name}（${emp.group}）</option>`;
        });
        document.getElementById('adminModal').classList.add('active');
    }

    function closeAdminModal() {
        document.getElementById('adminModal').classList.remove('active');
    }

    function confirmAdmin() {
        const selected = document.getElementById('adminSelect').value;
        if (!selected) {
            alert('请选择你的身份');
            return;
        }
        // 保存到 localStorage
        localStorage.setItem('current_operator', selected);

        const admins = getAdminList();
        if (admins.includes(selected)) {
            window.location.href = '排班表生成.html';
        } else {
            alert('⚠️ 你不是管理员，无法进入排班表生成功能');
        }
    }
    </script>
</body>
</html>
