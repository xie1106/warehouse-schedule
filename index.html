<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, minimum-scale=0.5">
    <title>排班系统</title>
    <style>
        :root {
            --primary: #1e3a5f;
            --primary-light: #2d5a8e;
            --primary-lighter: #3b7dd8;
            --accent: #4f8fda;
            --secondary: #6366f1;
            --secondary-light: #818cf8;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1d23;
            --text-light: #6b7280;
            --shadow: 0 2px 8px rgba(30, 58, 95, 0.06), 0 8px 32px rgba(30, 58, 95, 0.08);
            --shadow-hover: 0 4px 16px rgba(30, 58, 95, 0.1), 0 12px 40px rgba(30, 58, 95, 0.12);
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 56px 48px;
            text-align: center;
            max-width: 540px;
            width: 100%;
            border: 1px solid rgba(30, 58, 95, 0.04);
        }
        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }
        h1 {
            color: var(--text);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 40px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 22px 28px;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }
        .nav-link::after {
            content: '→';
            position: absolute;
            right: 28px;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-size: 18px;
        }
        .nav-link:hover::after {
            opacity: 1;
            transform: translateX(0);
        }
        .nav-link:nth-child(1) {
            background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
        }
        .nav-link:nth-child(2) {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
        }
        .nav-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(30, 58, 95, 0.3);
        }
        .nav-link:nth-child(2):hover {
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.3);
        }
        .nav-link:active {
            transform: translateY(-1px);
        }
        .nav-icon {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.18);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }
        .nav-text {
            text-align: left;
        }
        .nav-text span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 3px;
        }
        .footer {
            margin-top: 36px;
            color: var(--text-light);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(240, 242, 245, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 16px;
            color: var(--text-light);
            backdrop-filter: blur(8px);
        }
        .loading-overlay.hidden { display: none; }
        @media (max-width: 480px) {
            body { padding: 16px; }
            .container { padding: 36px 24px; border-radius: 16px; }
            .nav-link { padding: 18px 20px; border-radius: 12px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">加载中...</div>
    <div class="container">
        <div class="logo"><img src="logo-bg.png" alt="捷展云仓"></div>
        <h1>排班系统</h1>
        <div class="nav-links">
            <a href="员工指定休管理.html" class="nav-link">
                <div class="nav-icon">🕐</div>
                <div class="nav-text">
                    休假收集
                    <span>提交截止时间25日</span>
                </div>
            </a>
            <a href="javascript:void(0)" class="nav-link" id="scheduleLink" onclick="goToSchedule()">
                <div class="nav-icon">⚡</div>
                <div class="nav-text">
                    一键生成
                    <span>智能排班、手动调整、导出Excel</span>
                </div>
            </a>
        </div>
        <p class="footer">捷展 · 云仓</p>
    </div>

    <script>
    // === Supabase Config ===
    const SUPABASE_URL = 'https://elyfxyrdbuykyklfjfdr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseWZ4eXJkYnV5a3lrbGZqZmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIwMjQsImV4cCI6MjA5NjU3ODAyNH0.irrMM8iKJVGnOBW6VQ4BHlkwiVIDtB97EPiHvasOWyg';

    async function supaFetch(table, options = {}) {
        const { method = 'GET', query = '', body = null, headers = {} } = options;
        const url = `${SUPABASE_URL}/rest/v1/${table}${query}`;
        const opts = {
            method,
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : (method === 'DELETE' ? 'return=minimal' : ''),
                ...headers
            }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(url, opts);
        if (method === 'GET') return res.json();
        return res;
    }

    // === State ===
    let adminList = ['谢焕君'];

    async function init() {
        try {
            const data = await supaFetch('settings', { query: '?key=eq.admin_list&select=value' });
            if (data.length > 0) adminList = data[0].value;
        } catch (e) {
            console.error('Failed to load admin list:', e);
        }
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function goToSchedule() {
        const savedEmployee = localStorage.getItem('last_selected_employee');
        if (!savedEmployee) {
            alert('请先在"休假收集"页面选择你是谁');
            window.location.href = '员工指定休管理.html';
            return;
        }
        // 所有人都能进入排班表页面（非管理员只能查看）
        window.location.href = '排班表生成.html?v=' + Date.now();
    }

    init();
    </script>
</body>
</html>
